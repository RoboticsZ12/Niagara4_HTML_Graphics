<style>
*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
:root {
  --bg-deep:#0d1117;--bg-panel:#161b27;--bg-card:#1e2535;--bg-card-hover:#252d42;
  --accent:#00c8ff;--accent-glow:rgba(0,200,255,0.25);
  --green:#00e676;--red:#ff4444;--amber:#ffab00;
  --text-primary:#e8ecf4;--text-muted:#7a8499;
  --border:rgba(0,200,255,0.15);
  --font-head:'Courier New',Courier,monospace;--font-body:Georgia,'Times New Roman',serif;
  --transition:0.22s cubic-bezier(0.4,0,0.2,1);
}

/* ── LIGHT MODE ── */
body.light-mode {
  --bg-deep:#f0f4f8;--bg-panel:#ffffff;--bg-card:#e8edf5;--bg-card-hover:#dce4f0;
  --accent:#dc143c;--accent-glow:rgba(220,20,60,0.18);
  --green:#16a34a;--red:#dc2626;--amber:#d97706;
  --text-primary:#1a1e2a;--text-muted:#4b5563;
  --border:rgba(220,20,60,0.18);
}

html { height: 100%; overflow: hidden; }
body { height: 100%; font-family: var(--font-body); background: var(--bg-deep); color: var(--text-primary); display: flex; flex-direction: column; overflow: hidden; opacity: 0; transition: opacity 0.6s ease, background 0.3s ease; }
body.fade-in  { opacity: 1; }
body.fade-out { opacity: 0; transition: opacity 0.3s ease; }

/* ── OVERLAY ── */
.overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.6); backdrop-filter: blur(4px); z-index: 200; opacity: 0; visibility: hidden; transition: var(--transition); }
.overlay.active { opacity: 1; visibility: visible; }

/* ── SIDE PANEL ── */
.side-panel { position: fixed; top: 0; left: -300px; width: 280px; height: 100vh; background: var(--bg-panel); border-right: 1px solid var(--border); z-index: 300; transition: left 0.3s ease; padding: 80px 0 20px; overflow-y: auto; }
.side-panel.active { left: 0; }
.side-panel-header { padding: 20px; border-bottom: 1px solid var(--border); margin-bottom: 10px; }
.side-panel-header h2 { font-family: var(--font-head); font-size: 14px; letter-spacing: 2px; color: var(--accent); font-weight: normal; }
.side-panel-header p { font-size: 12px; color: var(--text-muted); margin-top: 4px; }
.nav-image-grid { padding: 10px 14px; display: flex; flex-direction: column; gap: 7px; }
.nav-image-btn { display: flex; align-items: center; gap: 12px; padding: 10px 14px; background: var(--bg-card); border: 1px solid var(--border); border-radius: 8px; cursor: pointer; text-decoration: none; transition: var(--transition); position: relative; overflow: hidden; color: var(--text-primary); }
.nav-image-btn::before { content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 2px; background: var(--accent); opacity: 0; transition: opacity 0.2s; }
.nav-image-btn:hover { border-color: var(--accent); background: var(--bg-card-hover); transform: translateX(3px); }
.nav-image-btn:hover::before { opacity: 1; }
.nav-btn-icon { width: 40px; height: 40px; border-radius: 8px; background: rgba(0,200,255,0.08); border: 1px solid rgba(0,200,255,0.15); display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
body.light-mode .nav-btn-icon { background: rgba(220,20,60,0.08); border-color: rgba(220,20,60,0.15); }
.nav-btn-text { display: flex; flex-direction: column; gap: 2px; }
.nav-btn-label { font-family: var(--font-head); font-size: 12px; color: var(--text-primary); letter-spacing: 0.5px; }
.nav-btn-sublabel { font-family: var(--font-head); font-size: 10px; color: var(--text-muted); letter-spacing: 0.5px; }
.nav-section-label { padding: 14px 14px 4px; font-family: var(--font-head); font-size: 9px; letter-spacing: 3px; color: var(--text-muted); text-transform: uppercase; }

/* ── TOP BAR ── */
.top-bar { background: rgba(13,17,23,0.97); border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; padding: 0 20px; height: 64px; flex-shrink: 0; position: relative; z-index: 100; backdrop-filter: blur(12px); transition: background 0.3s ease; }
body.light-mode .top-bar { background: rgba(255,255,255,0.97); box-shadow: 0 1px 12px rgba(0,0,0,0.08); }
.top-bar::after { content: ''; position: absolute; bottom: 0; left: 0; right: 0; height: 1px; background: linear-gradient(90deg, transparent, var(--accent), transparent); }
.hamburger { width: 36px; height: 36px; background: var(--bg-card); border: 1px solid var(--border); border-radius: 6px; cursor: pointer; display: flex; flex-direction: column; justify-content: center; align-items: center; gap: 5px; transition: var(--transition); flex-shrink: 0; }
.hamburger:hover { border-color: var(--accent); background: var(--bg-card-hover); }
.hamburger-line { width: 18px; height: 2px; background: var(--text-primary); border-radius: 2px; transition: var(--transition); }
.hamburger.active .hamburger-line:nth-child(1) { transform: rotate(45deg) translate(5px,5px); }
.hamburger.active .hamburger-line:nth-child(2) { opacity: 0; }
.hamburger.active .hamburger-line:nth-child(3) { transform: rotate(-45deg) translate(5px,-5px); }
.top-center { position: absolute; left: 50%; transform: translateX(-50%); display: flex; flex-direction: column; align-items: center; gap: 2px; }
.site-label { font-family: var(--font-head); font-size: 12px; letter-spacing: 4px; color: var(--accent); text-transform: uppercase; }
.page-title { font-family: var(--font-head); font-size: 18px; font-weight: normal; letter-spacing: 1px; color: var(--text-primary); }
.top-right { display: flex; align-items: center; gap: 12px; }
.theme-toggle-wrap { display: flex; align-items: center; gap: 8px; }
.theme-label { font-family: var(--font-head); font-size: 11px; letter-spacing: 2px; color: var(--text-muted); text-transform: uppercase; }
.switch { position: relative; display: inline-block; width: 42px; height: 22px; }
.switch input { opacity: 0; width: 0; height: 0; }
.slider { position: absolute; cursor: pointer; inset: 0; background: var(--bg-card); border: 1px solid var(--border); border-radius: 34px; transition: 0.3s; }
.slider:before { position: absolute; content: ""; height: 16px; width: 16px; left: 2px; bottom: 2px; background: var(--text-muted); border-radius: 50%; transition: 0.3s; }
input:checked + .slider { background: var(--accent-glow); border-color: var(--accent); }
input:checked + .slider:before { transform: translateX(20px); background: var(--accent); }
.user-badge { background: var(--bg-card); border: 1px solid var(--border); border-radius: 20px; padding: 6px 14px; font-size: 13px; color: var(--text-muted); display: flex; align-items: center; gap: 8px; font-family: var(--font-head); }
.user-dot { width: 8px; height: 8px; background: var(--green); border-radius: 50%; box-shadow: 0 0 6px var(--green); }
#userDisplay { color: var(--text-primary); }

/* ── MAIN CONTENT ── */
.main-content { flex: 1; overflow-y: auto; overflow-x: hidden; padding: 24px 28px; background: radial-gradient(ellipse at 15% 50%, rgba(0,200,255,0.08) 0%, transparent 55%), radial-gradient(ellipse at 85% 20%, rgba(123,94,167,0.12) 0%, transparent 50%), linear-gradient(135deg, #080d14 0%, #0d1520 25%, #0a1128 50%, #101828 75%, #0d1117 100%); background-attachment: fixed; }
body.light-mode .main-content { background: radial-gradient(ellipse at 15% 50%, rgba(220,20,60,0.05) 0%, transparent 55%), linear-gradient(135deg, #e8edf8 0%, #f0f4fb 50%, #e4ecf5 100%); }

/* ── SECTION HEADING ── */
.section-heading { display: flex; align-items: center; gap: 14px; margin-bottom: 22px; }
.section-heading .line { flex: 1; height: 1px; background: linear-gradient(90deg, var(--border), transparent); }
.section-heading h2 { font-family: var(--font-head); font-size: 11px; letter-spacing: 4px; color: var(--accent); text-transform: uppercase; font-weight: normal; white-space: nowrap; }

/* ── EF GRID ── */
.ef-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
  gap: 16px;
}

/* ── EF CARD ── */
.ef-card {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 18px 16px 16px;
  display: flex;
  flex-direction: column;
  gap: 14px;
  position: relative;
  transition: border-color 0.3s ease, box-shadow 0.3s ease, background 0.3s ease;
  overflow: hidden;
}
.ef-card::before {
  content: '';
  position: absolute;
  inset: 0;
  background: radial-gradient(ellipse at 30% 50%, rgba(0,80,140,0.12) 0%, transparent 65%);
  pointer-events: none;
  z-index: 0;
}
.ef-card.running {
  border-color: rgba(0,230,118,0.35);
  box-shadow: 0 0 18px rgba(0,230,118,0.08), 0 4px 20px rgba(0,0,0,0.4);
}
.ef-card.stopped {
  border-color: rgba(122,132,153,0.2);
  box-shadow: 0 4px 16px rgba(0,0,0,0.3);
}
.ef-card.error {
  border-color: rgba(255,68,68,0.3);
  box-shadow: 0 0 14px rgba(255,68,68,0.07), 0 4px 16px rgba(0,0,0,0.3);
}
body.light-mode .ef-card { background: #fff; }
body.light-mode .ef-card.running { border-color: rgba(22,163,74,0.4); box-shadow: 0 0 16px rgba(22,163,74,0.08), 0 4px 16px rgba(0,0,0,0.06); }
body.light-mode .ef-card.stopped { border-color: rgba(75,85,99,0.2); }
body.light-mode .ef-card.error { border-color: rgba(220,38,38,0.35); }

/* ── CARD HEADER ── */
.ef-card-header {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 10px;
  position: relative;
  z-index: 1;
}
.ef-name {
  font-family: var(--font-head);
  font-size: 12px;
  letter-spacing: 1.5px;
  color: var(--text-primary);
  text-transform: uppercase;
  line-height: 1.3;
  flex: 1;
  min-width: 0;
  word-break: break-word;
}
.ef-name a {
  color: var(--accent);
  text-decoration: none;
  transition: opacity 0.2s;
}
.ef-name a:hover {
  opacity: 0.75;
  text-decoration: underline;
}

/* ── STATUS INDICATOR LIGHT ── */
.status-light-wrap {
  flex-shrink: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 4px;
}
.status-light {
  width: 18px;
  height: 18px;
  border-radius: 50%;
  position: relative;
  flex-shrink: 0;
  transition: background 0.5s ease, box-shadow 0.5s ease;
}
.status-light.off {
  background: radial-gradient(circle at 40% 35%, #555, #2a2a2a);
  box-shadow: 0 0 4px rgba(0,0,0,0.6), inset 0 1px 0 rgba(255,255,255,0.08);
}
.status-light.on {
  background: radial-gradient(circle at 38% 30%,
    #b8ffdc 0%,
    #00e676 30%,
    #00c853 60%,
    #00a040 100%
  );
  box-shadow:
    0 0 8px rgba(0,230,118,0.8),
    0 0 20px rgba(0,230,118,0.45),
    0 0 40px rgba(0,200,100,0.2),
    inset 0 1px 2px rgba(255,255,255,0.5);
  animation: lightPulse 2.6s ease-in-out infinite;
}
.status-light.err {
  background: radial-gradient(circle at 38% 30%, #ff9999, #ff4444, #cc0000);
  box-shadow: 0 0 8px rgba(255,68,68,0.7), 0 0 20px rgba(255,68,68,0.35), inset 0 1px 2px rgba(255,255,255,0.3);
  animation: errPulse 1.4s ease-in-out infinite;
}
@keyframes lightPulse {
  0%, 100% { box-shadow: 0 0 8px rgba(0,230,118,0.8), 0 0 20px rgba(0,230,118,0.45), 0 0 40px rgba(0,200,100,0.2), inset 0 1px 2px rgba(255,255,255,0.5); }
  50%       { box-shadow: 0 0 14px rgba(0,230,118,1.0), 0 0 32px rgba(0,230,118,0.65), 0 0 60px rgba(0,200,100,0.35), inset 0 1px 2px rgba(255,255,255,0.6); }
}
@keyframes errPulse {
  0%, 100% { box-shadow: 0 0 6px rgba(255,68,68,0.6), 0 0 14px rgba(255,68,68,0.3), inset 0 1px 2px rgba(255,255,255,0.2); }
  50%       { box-shadow: 0 0 12px rgba(255,68,68,1.0), 0 0 26px rgba(255,68,68,0.55), inset 0 1px 2px rgba(255,255,255,0.35); }
}
.status-light::after {
  content: '';
  position: absolute;
  top: 3px;
  left: 4px;
  width: 5px;
  height: 3px;
  background: rgba(255,255,255,0.55);
  border-radius: 50%;
  transform: rotate(-20deg);
}
.status-light-label {
  font-family: var(--font-head);
  font-size: 8px;
  letter-spacing: 1.5px;
  text-transform: uppercase;
  text-align: center;
  line-height: 1;
}
.status-light-label.on  { color: var(--green); }
.status-light-label.off { color: var(--text-muted); }
.status-light-label.err { color: var(--red); }

/* ── FAN STATUS ROW ── */
.ef-stat-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  background: rgba(0,0,0,0.2);
  border: 1px solid rgba(0,200,255,0.1);
  border-radius: 8px;
  padding: 10px 14px;
  position: relative;
  z-index: 1;
  transition: background 0.3s ease;
}
body.light-mode .ef-stat-row { background: rgba(0,0,0,0.04); border-color: rgba(0,53,128,0.12); }
.ef-stat-label {
  font-family: var(--font-head);
  font-size: 9px;
  letter-spacing: 2px;
  text-transform: uppercase;
  color: var(--text-muted);
}
.ef-stat-value {
  font-family: var(--font-head);
  font-size: 13px;
  font-weight: bold;
  color: var(--accent);
  letter-spacing: 0.5px;
  line-height: 1;
  transition: color 0.3s ease;
}
.ef-stat-value.running-text { color: var(--green); }
.ef-stat-value.stopped-text { color: var(--text-muted); }
.ef-stat-value.loading      { color: var(--text-muted); font-weight: normal; }
.ef-stat-value.error        { color: var(--red); font-weight: normal; }

/* ── DETAIL LINK BUTTON ── */
.ef-detail-btn {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  background: rgba(0,200,255,0.07);
  border: 1px solid rgba(0,200,255,0.2);
  border-radius: 7px;
  padding: 8px 12px;
  text-decoration: none;
  color: var(--accent);
  font-family: var(--font-head);
  font-size: 10px;
  letter-spacing: 1.5px;
  text-transform: uppercase;
  position: relative;
  z-index: 1;
  transition: var(--transition);
}
.ef-detail-btn:hover {
  background: rgba(0,200,255,0.14);
  border-color: var(--accent);
  transform: translateY(-1px);
  box-shadow: 0 4px 14px rgba(0,200,255,0.2);
}
body.light-mode .ef-detail-btn {
  background: rgba(220,20,60,0.06);
  border-color: rgba(220,20,60,0.2);
  color: var(--accent);
}
body.light-mode .ef-detail-btn:hover {
  background: rgba(220,20,60,0.12);
  border-color: var(--accent);
  box-shadow: 0 4px 14px rgba(220,20,60,0.15);
}

/* ── LOADING / ERROR ── */
.grid-loading {
  grid-column: 1 / -1;
  text-align: center;
  padding: 60px 20px;
  font-family: var(--font-head);
  font-size: 13px;
  letter-spacing: 2px;
  color: var(--accent);
}
.grid-error {
  grid-column: 1 / -1;
  text-align: center;
  padding: 60px 20px;
  font-family: var(--font-head);
  font-size: 13px;
  letter-spacing: 1px;
  color: var(--red);
}

/* ── BOTTOM BAR ── */
.bottom-bar { background: rgba(13,17,23,0.97); border-top: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; padding: 0 20px; height: 50px; flex-shrink: 0; position: relative; }
body.light-mode .bottom-bar { background: rgba(255,255,255,0.97); box-shadow: 0 -1px 12px rgba(0,0,0,0.06); }
.bottom-bar::before { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 1px; background: linear-gradient(90deg, transparent, var(--accent), transparent); }
.back-btn { background: none; border: 1px solid var(--border); border-radius: 6px; color: var(--text-muted); padding: 6px 16px; cursor: pointer; font-size: 13px; font-family: var(--font-head); letter-spacing: 1px; display: flex; align-items: center; gap: 8px; transition: var(--transition); }
.back-btn:hover { border-color: var(--accent); color: var(--accent); }
.datetime-display { font-family: var(--font-head); font-size: 13px; color: var(--text-muted); letter-spacing: 1px; }
.logoff-btn { background: none; border: 1px solid var(--border); border-radius: 6px; color: var(--text-muted); padding: 6px 16px; cursor: pointer; font-size: 13px; font-family: var(--font-head); letter-spacing: 1px; display: flex; align-items: center; gap: 8px; transition: var(--transition); }
.logoff-btn:hover { border-color: var(--red); color: var(--red); }

::-webkit-scrollbar { width: 6px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
</style>
</head>

<!-- ── MAIN ── -->
<div class="main-content">
  <div class="section-heading">
    <div class="line"></div>
    <h2>Exhaust Fan Unit Status</h2>
    <div class="line" style="background:linear-gradient(90deg,transparent,var(--border));"></div>
  </div>
  <div class="ef-grid" id="ef-grid">
    <div class="grid-loading">Discovering exhaust fan units…</div>
  </div>
</div>

<!-- ── BOTTOM BAR ── */
<div class="bottom-bar">
  <button class="back-btn" onclick="history.back()">← Back</button>
  <div class="datetime-display" id="currentDateTime">—</div>
  <button class="logoff-btn" onclick="handleLogoff()">🔒 Logoff</button>
</div>

<!-- ── SCRIPTS ── -->
<script>
/* fade */
document.addEventListener('DOMContentLoaded', () => {
  document.body.classList.add('fade-in');
  document.body.addEventListener('click', e => {
    const link = e.target.closest('a');
    if (!link || link.hostname !== location.hostname) return;
    e.preventDefault();
    document.body.classList.remove('fade-in');
    document.body.classList.add('fade-out');
    setTimeout(() => { window.location.href = link.href; }, 300);
  });
});
</script>

<script>
/* datetime */
function updateDateTime() {
  const now = new Date();
  const opts = { day:'2-digit', month:'short', year:'numeric', hour:'numeric', minute:'2-digit', hour12:true, timeZoneName:'short' };
  document.getElementById('currentDateTime').textContent = now.toLocaleString('en-US', opts).replace(',','');
}
updateDateTime();
setInterval(updateDateTime, 1000);
</script>

<script>
/* theme */
function toggleTheme() {
  const c = document.getElementById('themeSwitch');
  document.body.classList.toggle('light-mode', c.checked);
  localStorage.setItem('theme', c.checked ? 'light' : 'dark');
}
document.addEventListener('DOMContentLoaded', () => {
  const s = localStorage.getItem('theme'), c = document.getElementById('themeSwitch');
  if (s === 'light') { document.body.classList.add('light-mode'); c.checked = true; }
});
</script>

<script>
/* auth */
window.onload = function() {
  const u = sessionStorage.getItem('username');
  if (!u) { window.location.href = '../LOGIN/Login.html'; return; }
  document.getElementById('userDisplay').textContent = u;
};
function handleLogoff() { sessionStorage.removeItem('username'); window.location.href = '../LOGIN/Login.html'; }
</script>

<script>
/* hamburger */
document.addEventListener('DOMContentLoaded', () => {
  const h = document.getElementById('hamburgerMenu'), s = document.getElementById('sidePanel'), o = document.getElementById('overlay');
  h.addEventListener('click', () => { h.classList.toggle('active'); s.classList.toggle('active'); o.classList.toggle('active'); });
  o.addEventListener('click', () => { h.classList.remove('active'); s.classList.remove('active'); o.classList.remove('active'); });
});
</script>

<!-- ── EF MONITORING CORE ── -->
<script>
require(['baja!'], function(baja) {
  'use strict';

  function decodeNiagaraName(name) {
    if (!name) return name;
    return name.replace(/\$([0-9a-fA-F]{2})/g, (m, h) => String.fromCharCode(parseInt(h, 16)));
  }

  /* ── Detect exhaust fan devices ── */
  function isExhaustFan(deviceKey) {
    const k = deviceKey.toUpperCase();
    return (
      /\bEF\b/.test(k)         ||
      /\bEF[-_]/.test(k)       ||
      k.startsWith('EF')       ||
      k.includes('EXHAUST')    ||
      k.includes('EXHAUSTFAN')
    );
  }

  /* ── Collect EF devices from globalVariables ── */
  function collectEFDevices(globalVariables) {
    const devices = {};
    Object.keys(globalVariables).forEach(deviceKey => {
      if (!isExhaustFan(deviceKey)) return;
      const d = globalVariables[deviceKey];
      if (d && Array.isArray(d.points)) devices[deviceKey] = d.points;
    });
    return devices;
  }
  
function renderFanRow(deviceKey, fanName, initText, initClass) {
  const container = document.getElementById(`fanstat-rows-${deviceKey}`);
  if (!container) return;
  const rowId = `fanstat-${deviceKey}-${fanName || 'default'}`;
  if (document.getElementById(rowId)) return; // already exists
  const label = fanName ? `Fan Status (${fanName})` : 'Fan Status';
  const row = document.createElement('div');
  row.className = 'ef-stat-row';
  row.innerHTML = `<span class="ef-stat-label">${label}</span>
    <span class="ef-stat-value ${initClass || 'loading'}" id="${rowId}">${initText || '—'}</span>`;
  container.appendChild(row);
}

  /* ── Build a card DOM element ── */
  function buildCard(deviceKey) {
    const label = decodeNiagaraName(deviceKey);
    const card = document.createElement('div');
    card.className = 'ef-card stopped';
    card.id = `ef-card-${deviceKey}`;

    card.innerHTML = `
      <div class="ef-card-header">
        <div class="ef-name">
          <a href="../ExhaustFans/Exhaust_Fans.html" title="View Exhaust Fan detail">${label}</a>
        </div>
        <div class="status-light-wrap">
          <div class="status-light off" id="light-${deviceKey}"></div>
          <div class="status-light-label off" id="light-label-${deviceKey}">OFF</div>
        </div>
      </div>
<div id="fanstat-rows-${deviceKey}"></div>
      <a href="../ExhaustFans/Exhaust_Fans.html" class="ef-detail-btn">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>
        View Detail
      </a>`;

    return card;
  }

  /* ── Apply fan status to card ── */
function applyFanStat(deviceKey, rawVal, fanName) {
    const light      = document.getElementById(`light-${deviceKey}`);
    const lightLabel = document.getElementById(`light-label-${deviceKey}`);
    const card       = document.getElementById(`ef-card-${deviceKey}`);
  const statVal = document.getElementById(`fanstat-${deviceKey}-${fanName || 'default'}`);
    if (!light || !card) return;

    const isOn = String(rawVal ?? '').toLowerCase().includes('on')
              || String(rawVal ?? '').toLowerCase() === 'true'
              || parseFloat(rawVal) > 0;

    light.className      = `status-light ${isOn ? 'on' : 'off'}`;
    lightLabel.className = `status-light-label ${isOn ? 'on' : 'off'}`;
    lightLabel.textContent = isOn ? 'RUNNING' : 'OFF';
    card.className = `ef-card ${isOn ? 'running' : 'stopped'}`;

    if (statVal) {
      statVal.textContent = isOn ? 'Fan ON' : 'Fan OFF';
      statVal.className   = `ef-stat-value ${isOn ? 'running-text' : 'stopped-text'}`;
    }
  }

  /* ── Subscribe to one point ── */
  const subscriber = new baja.Subscriber();
  subscriber.attach('changed', function(prop) {
    if (prop.getName() !== 'out') return;
    const ud = this.userData;
    if (!ud) return;
    const val = this.getOut().getValue();
if (role === 'fan') applyFanStat(deviceKey, val, fanName);
});

 function subscribePoint(fullPath, deviceKey, role, fanName) {
  renderFanRow(deviceKey, fanName, '—', 'loading'); // ensure row exists before data arrives
  baja.Ord.make(fullPath).get({ subscriber })
    .then(point => {
      point.userData = { deviceKey, role, fanName };
      const val = point.getOut().getValue();
if (role === 'fan') applyFanStat(deviceKey, val, fanName);
})
    .catch(err => {
      console.warn(`[EF] Failed to subscribe [${deviceKey}/${role}/${fanName}]:`, err.message);
      if (role === 'fan') {
        const light   = document.getElementById(`light-${deviceKey}`);
        const ll      = document.getElementById(`light-label-${deviceKey}`);
        const card    = document.getElementById(`ef-card-${deviceKey}`);
        const statVal = document.getElementById(`fanstat-${deviceKey}-${fanName || 'default'}`);
        if (light)   light.className = 'status-light err';
        if (ll)      { ll.className = 'status-light-label err'; ll.textContent = 'ERR'; }
        if (card)    card.className = 'ef-card error';
        if (statVal) { statVal.textContent = 'Err'; statVal.className = 'ef-stat-value error'; }
      }
    });
}

  /* ── Main init ── */
  async function init() {
    let globalConfig;
    try {
      const resp = await fetch('../Global.json');
      if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
      globalConfig = await resp.json();
    } catch(e) {
      document.getElementById('ef-grid').innerHTML = `<div class="grid-error">Failed to load Global.json: ${e.message}</div>`;
      return;
    }

    const efDevices  = collectEFDevices(globalConfig.globalVariables || {});
    const deviceKeys = Object.keys(efDevices).sort((a, b) =>
      decodeNiagaraName(a).localeCompare(decodeNiagaraName(b))
    );

    if (!deviceKeys.length) {
      document.getElementById('ef-grid').innerHTML = `<div class="grid-error">No Exhaust Fan devices found in Global.json</div>`;
      return;
    }

    const grid = document.getElementById('ef-grid');
    grid.innerHTML = '';

    deviceKeys.forEach(deviceKey => {
      const points = efDevices[deviceKey];
      const card   = buildCard(deviceKey);
      grid.appendChild(card);

      /* Find Fan-Stat point */
const fanPoints = points.filter(p => /^Fan-Stat\d*$/i.test((p.id || '').trim()));

if (fanPoints.length) {
  fanPoints.forEach((fanPoint, idx) => {
    if (fanPoint.fullPath && fanPoint.status === 'connected') {
      subscribePoint(fanPoint.fullPath, deviceKey, 'fan', fanPoint.name || `Fan ${idx+1}`);
    } else {
      renderFanRow(deviceKey, fanPoint.name || `Fan ${idx+1}`, 'N/A', 'stopped-text');
    }
  });
} else {
  renderFanRow(deviceKey, null, 'N/A', 'stopped-text');
}
    });

    console.log(`[EF Summary] Monitoring ${deviceKeys.length} unit(s):`, deviceKeys.map(k => decodeNiagaraName(k)));
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', init);
  } else {
    setTimeout(init, 100);
  }

  window.addEventListener('beforeunload', () => { try { subscriber.unsubscribeAll(); } catch(e) {} });
});
</script>

</body>
</html>
