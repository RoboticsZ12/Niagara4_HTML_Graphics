<!DOCTYPE html>
<!-- @noSnoop -->
<html lang="en" xmlns:b="http://www.tridium.com/baja/baja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Murphy Control Panel - Login</title>
<style>
*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
:root {
  --bg-deep:#0d1117;--bg-panel:#161b27;--bg-card:#1e2535;--bg-card-hover:#252d42;
  --accent:#00c8ff;--accent-glow:rgba(0,200,255,0.25);
  --green:#00e676;--red:#ff4444;--amber:#ffab00;
  --text-primary:#e8ecf4;--text-muted:#7a8499;
  --border:rgba(0,200,255,0.15);
  --font-head:'Courier New',Courier,monospace;--font-body:Georgia,'Times New Roman',serif;
  --transition:0.22s cubic-bezier(0.4,0,0.2,1);
  --tbl-border:#2a3550;
}
body.light-mode {
  --bg-deep:#f0f4f8;--bg-panel:#ffffff;--bg-card:#e8edf5;--bg-card-hover:#dce4f0;
  --accent:#dc143c;--accent-glow:rgba(220,20,60,0.18);
  --green:#16a34a;--red:#dc2626;--amber:#d97706;
  --text-primary:#1a1e2a;--text-muted:#4b5563;
  --border:rgba(220,20,60,0.18);
  --tbl-border:#c5cedc;
}

html, body {
  height: 100%;
  font-family: var(--font-body);
  background: var(--bg-deep);
  color: var(--text-primary);
  display: flex;
  flex-direction: column;
  overflow: hidden;
  transition: background 0.3s ease, color 0.3s ease;
}

/* ── TOP BAR ── */
.top-bar {
  background: rgba(13,17,23,0.97);
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 20px;
  height: 64px;
  flex-shrink: 0;
  position: relative;
  z-index: 100;
  backdrop-filter: blur(12px);
  transition: background 0.3s ease;
}
body.light-mode .top-bar { background: rgba(255,255,255,0.97); box-shadow: 0 1px 12px rgba(0,0,0,0.08); }
.top-bar::after { content:''; position:absolute; bottom:0; left:0; right:0; height:1px; background:linear-gradient(90deg,transparent,var(--accent),transparent); }

.top-center { position:absolute; left:50%; transform:translateX(-50%); display:flex; flex-direction:column; align-items:center; gap:2px; }
.site-label { font-family:var(--font-head); font-size:12px; letter-spacing:4px; color:var(--accent); text-transform:uppercase; }
.page-title { font-family:var(--font-head); font-size:18px; font-weight:normal; letter-spacing:1px; color:var(--text-primary); }

.top-right { display:flex; align-items:center; gap:12px; }
.theme-toggle-wrap { display:flex; align-items:center; gap:8px; }
.theme-label { font-family:var(--font-head); font-size:11px; letter-spacing:2px; color:var(--text-muted); text-transform:uppercase; }
.switch { position:relative; display:inline-block; width:42px; height:22px; }
.switch input { opacity:0; width:0; height:0; }
.slider { position:absolute; cursor:pointer; inset:0; background:var(--bg-card); border:1px solid var(--border); border-radius:34px; transition:0.3s; }
.slider:before { position:absolute; content:""; height:16px; width:16px; left:2px; bottom:2px; background:var(--text-muted); border-radius:50%; transition:0.3s; }
input:checked+.slider { background:var(--accent-glow); border-color:var(--accent); }
input:checked+.slider:before { transform:translateX(20px); background:var(--accent); }

/* ── MAIN ── */
.main-content {
  flex: 1;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 24px 20px;
  position: relative;
  overflow: hidden;
}

/* Subtle animated grid background */
.main-content::before {
  content: '';
  position: absolute;
  inset: 0;
  background-image:
    linear-gradient(var(--border) 1px, transparent 1px),
    linear-gradient(90deg, var(--border) 1px, transparent 1px);
  background-size: 40px 40px;
  opacity: 0.4;
  pointer-events: none;
}

/* Glowing orb behind card */
.main-content::after {
  content: '';
  position: absolute;
  width: 600px;
  height: 600px;
  background: radial-gradient(circle, var(--accent-glow) 0%, transparent 70%);
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  pointer-events: none;
}

/* ── LOGIN CARD ── */
.login-card {
  position: relative;
  z-index: 10;
  background: var(--bg-panel);
  border: 1px solid var(--border);
  border-radius: 16px;
  width: 420px;
  max-width: 100%;
  padding: 40px 44px 36px;
  box-shadow:
    0 24px 64px rgba(0,0,0,0.5),
    0 0 0 1px rgba(0,200,255,0.05),
    inset 0 1px 0 rgba(255,255,255,0.04);
  animation: cardIn 0.5s cubic-bezier(0.16,1,0.3,1) both;
}
@keyframes cardIn {
  from { opacity:0; transform:translateY(24px) scale(0.97); }
  to   { opacity:1; transform:translateY(0) scale(1); }
}

/* Top accent line */
.login-card::before {
  content: '';
  position: absolute;
  top: 0; left: 20px; right: 20px;
  height: 2px;
  background: linear-gradient(90deg, transparent, var(--accent), transparent);
  border-radius: 0 0 2px 2px;
}

.card-header {
  text-align: center;
  margin-bottom: 32px;
}

.card-brand {
  font-family: var(--font-head);
  font-size: 11px;
  letter-spacing: 4px;
  color: var(--accent);
  text-transform: uppercase;
  margin-bottom: 8px;
}

.card-title {
  font-family: var(--font-head);
  font-size: 22px;
  font-weight: normal;
  color: var(--text-primary);
  letter-spacing: 0.5px;
  margin-bottom: 6px;
}

.card-subtitle {
  font-size: 13px;
  color: var(--text-muted);
  font-family: var(--font-head);
  letter-spacing: 0.5px;
}

/* ── FORM FIELDS ── */
.field-group {
  margin-bottom: 18px;
}

.field-label {
  display: block;
  font-family: var(--font-head);
  font-size: 11px;
  letter-spacing: 2px;
  text-transform: uppercase;
  color: var(--text-muted);
  margin-bottom: 8px;
}

.field-wrap {
  position: relative;
  display: flex;
  align-items: center;
}

.field-icon {
  position: absolute;
  left: 14px;
  color: var(--text-muted);
  font-size: 15px;
  pointer-events: none;
  line-height: 1;
}

.field-input {
  width: 100%;
  padding: 12px 16px 12px 42px;
  background: var(--bg-card);
  border: 1px solid var(--tbl-border);
  border-radius: 8px;
  color: var(--text-primary);
  font-family: var(--font-head);
  font-size: 14px;
  letter-spacing: 0.5px;
  transition: var(--transition);
  outline: none;
}

.field-input:focus {
  border-color: var(--accent);
  box-shadow: 0 0 0 3px var(--accent-glow);
  background: var(--bg-card-hover, #252d42);
}

.field-input::placeholder { color: var(--text-muted); }

.field-input.password-input { padding-right: 44px; }

.eye-toggle {
  position: absolute;
  right: 14px;
  cursor: pointer;
  color: var(--text-muted);
  font-size: 15px;
  transition: color var(--transition);
  user-select: none;
  line-height: 1;
}

.eye-toggle:hover { color: var(--accent); }

/* ── REMEMBER / FORGOT ── */
.meta-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin: 8px 0 24px;
}

.remember-wrap {
  display: flex;
  align-items: center;
  gap: 8px;
  cursor: pointer;
}

.remember-wrap input[type="checkbox"] {
  width: 15px;
  height: 15px;
  accent-color: var(--accent);
  cursor: pointer;
}

.remember-wrap span {
  font-family: var(--font-head);
  font-size: 11px;
  letter-spacing: 1px;
  color: var(--text-muted);
  text-transform: uppercase;
}

.forgot-link {
  font-family: var(--font-head);
  font-size: 11px;
  letter-spacing: 1px;
  color: var(--accent);
  text-decoration: none;
  text-transform: uppercase;
  transition: opacity var(--transition);
}
.forgot-link:hover { opacity: 0.7; }

/* ── SIGN IN BUTTON ── */
.signin-btn {
  width: 100%;
  padding: 13px;
  background: transparent;
  border: 1px solid var(--accent);
  border-radius: 8px;
  color: var(--accent);
  font-family: var(--font-head);
  font-size: 12px;
  letter-spacing: 3px;
  text-transform: uppercase;
  cursor: pointer;
  transition: var(--transition);
  position: relative;
  overflow: hidden;
}

.signin-btn::before {
  content: '';
  position: absolute;
  inset: 0;
  background: var(--accent);
  opacity: 0;
  transition: opacity var(--transition);
}

.signin-btn:hover::before { opacity: 0.12; }
.signin-btn:hover { box-shadow: 0 0 20px var(--accent-glow); }
.signin-btn:active { transform: scale(0.99); }

.signin-btn.loading {
  pointer-events: none;
  color: transparent;
}
.signin-btn.loading::after {
  content: '';
  position: absolute;
  width: 18px; height: 18px;
  top: 50%; left: 50%;
  margin: -9px 0 0 -9px;
  border: 2px solid rgba(0,200,255,0.3);
  border-top-color: var(--accent);
  border-radius: 50%;
  animation: spin 0.7s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }

/* ── MESSAGE ── */
.message {
  margin-top: 16px;
  padding: 10px 14px;
  border-radius: 6px;
  font-family: var(--font-head);
  font-size: 12px;
  letter-spacing: 1px;
  text-align: center;
  display: none;
  animation: msgIn 0.3s ease;
}
@keyframes msgIn { from { opacity:0; transform:translateY(-6px); } to { opacity:1; transform:translateY(0); } }

.message.success {
  background: rgba(0,230,118,0.1);
  border: 1px solid rgba(0,230,118,0.3);
  color: var(--green);
}
.message.error {
  background: rgba(255,68,68,0.1);
  border: 1px solid rgba(255,68,68,0.3);
  color: var(--red);
  animation: msgIn 0.3s ease, shake 0.5s ease 0.3s;
}
@keyframes shake {
  0%,100%{transform:translateX(0);}
  20%,60%{transform:translateX(-5px);}
  40%,80%{transform:translateX(5px);}
}

/* ── DIVIDER ── */
.divider {
  display: flex;
  align-items: center;
  gap: 12px;
  margin: 24px 0 18px;
}
.divider-line {
  flex: 1;
  height: 1px;
  background: var(--tbl-border);
}
.divider-text {
  font-family: var(--font-head);
  font-size: 10px;
  letter-spacing: 2px;
  color: var(--text-muted);
  text-transform: uppercase;
}

/* ── STATUS INDICATORS ── */
.system-status {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 20px;
  margin-top: 20px;
}
.status-dot-wrap {
  display: flex;
  align-items: center;
  gap: 6px;
}
.status-dot {
  width: 7px;
  height: 7px;
  border-radius: 50%;
}
.status-dot.online { background: var(--green); box-shadow: 0 0 6px var(--green); animation: blink 2s ease-in-out infinite; }
@keyframes blink { 0%,100%{opacity:1;} 50%{opacity:0.4;} }
.status-text {
  font-family: var(--font-head);
  font-size: 10px;
  letter-spacing: 1.5px;
  color: var(--text-muted);
  text-transform: uppercase;
}

/* ── BOTTOM BAR ── */
.bottom-bar {
  background: rgba(13,17,23,0.97);
  border-top: 1px solid var(--border);
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 0 20px;
  height: 50px;
  flex-shrink: 0;
  position: relative;
}
body.light-mode .bottom-bar { background: rgba(255,255,255,0.97); }
.bottom-bar::before { content:''; position:absolute; top:0; left:0; right:0; height:1px; background:linear-gradient(90deg,transparent,var(--accent),transparent); }
.datetime-display { font-family:var(--font-head); font-size:13px; color:var(--text-muted); letter-spacing:1px; }
</style>
</head>
<body>

<!-- Top Bar -->
<div class="top-bar">
  <div class="top-center">
    <span class="site-label">Murphy Control</span>
    <span class="page-title" id="pageTitle">Authenticating</span>
  </div>
  <div class="top-right">
    <div class="theme-toggle-wrap">
      <span class="theme-label">Light</span>
      <label class="switch">
        <input type="checkbox" id="themeSwitch" onchange="toggleTheme()">
        <span class="slider"></span>
      </label>
    </div>
  </div>
</div>

<!-- Main -->
<div class="main-content">
  <div class="login-card">

    <div class="card-header">
      <div class="card-brand">Murphy Control Panel</div>
      <div class="card-title" id="buildingTitle">Loading...</div>
      <div class="card-subtitle">Enter credentials to access the system</div>
    </div>

    <!-- Username -->
    <div class="field-group">
      <label class="field-label" for="username">Username</label>
      <div class="field-wrap">
        <span class="field-icon">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="4"/><path d="M4 20c0-4 3.6-7 8-7s8 3 8 7"/></svg>
        </span>
        <input type="text" id="username" class="field-input" placeholder="Enter username" autocomplete="username" />
      </div>
    </div>

    <!-- Password -->
    <div class="field-group">
      <label class="field-label" for="password">Password</label>
      <div class="field-wrap">
        <span class="field-icon">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
        </span>
        <input type="password" id="password" class="field-input password-input" placeholder="Enter password" autocomplete="current-password" />
        <span class="eye-toggle" id="eyeToggle" title="Toggle visibility">
          <svg id="eyeIcon" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
        </span>
      </div>
    </div>

    <!-- Remember / Forgot -->
    <div class="meta-row">
      <label class="remember-wrap">
        <input type="checkbox" id="rememberMe" />
        <span>Remember me</span>
      </label>
      <a href="#" class="forgot-link" onclick="showForgotPassword(); return false;">Forgot Password</a>
    </div>

    <!-- Sign In -->
    <button class="signin-btn" id="signinBtn" onclick="validateLogin()">Sign In</button>

    <!-- Message -->
    <div class="message" id="message"></div>

    <!-- Divider -->
    <div class="divider">
      <div class="divider-line"></div>
      <span class="divider-text">System Status</span>
      <div class="divider-line"></div>
    </div>

    <!-- Status -->
    <div class="system-status">
      <div class="status-dot-wrap">
        <div class="status-dot online"></div>
        <span class="status-text">System Online</span>
      </div>
      <div class="status-dot-wrap">
        <div class="status-dot online"></div>
        <span class="status-text">BAS Connected</span>
      </div>
    </div>

  </div>
</div>

<!-- Bottom Bar -->
<div class="bottom-bar">
  <div class="datetime-display" id="currentDateTime">—</div>
</div>

<!-- Theme -->
<script>
function toggleTheme(){const c=document.getElementById('themeSwitch');document.body.classList.toggle('light-mode',c.checked);localStorage.setItem('theme',c.checked?'light':'dark');}
document.addEventListener('DOMContentLoaded',function(){const s=localStorage.getItem('theme'),c=document.getElementById('themeSwitch');if(s==='light'){document.body.classList.add('light-mode');c.checked=true;}});
</script>

<!-- Clock -->
<script>
function updateDateTime(){const now=new Date(),opts={day:'2-digit',month:'short',year:'numeric',hour:'numeric',minute:'2-digit',hour12:true,timeZoneName:'short'};document.getElementById('currentDateTime').textContent=now.toLocaleString('en-US',opts).replace(',','');}
updateDateTime();setInterval(updateDateTime,1000);
</script>

<!-- Building Name -->
<script>
async function loadBuildingName(){
  try{
    const r=await fetch('../HomeConfig.json');
    if(!r.ok)throw new Error();
    const c=await r.json();
    const title=c.JobBuilding?c.JobBuilding+' Login':'Secure Login';
    document.getElementById('buildingTitle').textContent=title;
    document.getElementById('pageTitle').textContent=c.JobBuilding||'Login';
  }catch(e){
    document.getElementById('buildingTitle').textContent='Secure Login';
    document.getElementById('pageTitle').textContent='Login';
  }
}
loadBuildingName();
</script>

<!-- Auth -->
<script>
async function fetchUsersFromConfig(){
  try{
    const r=await fetch('../HomeConfig.json');
    if(!r.ok)throw new Error();
    const c=await r.json();
    if(c.Users&&Array.isArray(c.Users))return c.Users;
  }catch(e){console.error('Error loading users:',e);}
  return[];
}

async function validateLogin(){
  const username=document.getElementById('username').value.trim();
  const password=document.getElementById('password').value;
  const msg=document.getElementById('message');
  const btn=document.getElementById('signinBtn');
  const remember=document.getElementById('rememberMe').checked;

  if(!username||!password){
    showMessage('Please enter both username and password.','error');
    return;
  }

  btn.classList.add('loading');
  msg.style.display='none';

  await new Promise(res=>setTimeout(res,600));

  const users=await fetchUsersFromConfig();
  const matched=users.find(u=>u.name===username&&u.password===password);

  btn.classList.remove('loading');

  if(matched){
    showMessage('✓ Authenticated — redirecting...','success');
    if(remember){localStorage.setItem('rememberedUsername',username);}
    else{localStorage.removeItem('rememberedUsername');}
    sessionStorage.setItem('loggedIn','true');
    sessionStorage.setItem('username',username);
    sessionStorage.setItem('role',matched.role);
    let stored=JSON.parse(localStorage.getItem('validUsers'))||[];
    if(!stored.includes(username))stored.push(username);
    localStorage.setItem('validUsers',JSON.stringify(stored));
    setTimeout(()=>window.location.href='../Home.html',900);
  }else{
    showMessage('✗ Invalid username or password.','error');
    document.getElementById('password').value='';
    document.getElementById('password').focus();
  }
}

function showMessage(text,type){
  const msg=document.getElementById('message');
  msg.textContent=text;
  msg.className='message '+type;
  msg.style.display='block';
  // force reflow to re-trigger animation
  void msg.offsetWidth;
  msg.className='message '+type;
}

function showForgotPassword(){
  alert('For password or username assistance, contact Murphy Controls support at (314) 378-9158.');
}

// Enter key
document.addEventListener('DOMContentLoaded',()=>{
  document.getElementById('password').addEventListener('keydown',e=>{if(e.key==='Enter')validateLogin();});
  document.getElementById('username').addEventListener('keydown',e=>{if(e.key==='Enter')document.getElementById('password').focus();});

  // Eye toggle
  const eyeBtn=document.getElementById('eyeToggle');
  const pwField=document.getElementById('password');
  const eyeIcon=document.getElementById('eyeIcon');
  eyeBtn.addEventListener('click',()=>{
    const show=pwField.type==='password';
    pwField.type=show?'text':'password';
    eyeIcon.innerHTML=show
      ?'<path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94"/><path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19"/><line x1="1" y1="1" x2="23" y2="23"/>'
      :'<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>';
  });

  // Remember me
  const remembered=localStorage.getItem('rememberedUsername');
  if(remembered){
    document.getElementById('username').value=remembered;
    document.getElementById('rememberMe').checked=true;
    document.getElementById('password').focus();
  }
});
</script>

</body>
</html>
