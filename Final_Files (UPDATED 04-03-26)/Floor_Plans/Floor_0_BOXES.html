<!DOCTYPE html>
<!-- @noSnoop -->
<html lang="en" xmlns:b="http://www.tridium.com/baja/baja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Murphy Control — Floor Plan Viewer</title>

<script type='text/javascript' src='/requirejs/config.js'></script>
<script type='text/javascript' src='/module/js/com/tridium/js/ext/require/require.min.js?'></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<!--<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;500;600;700&family=Share+Tech+Mono&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">-->

<style>
/* ── RESET ─────────────────────────────────────────── */
*, *::before, *::after { box-sizing: border-box; margin:0; padding:0; }

:root {
  --bg:           #080d14;
  --surface:      #0d1520;
  --surface-2:    #111c2b;
  --border:       rgba(0,180,255,0.12);
  --border-hover: rgba(0,180,255,0.45);
  --accent:       #00b4ff;
  --accent-dim:   rgba(0,180,255,0.18);
  --accent-glow:  rgba(0,180,255,0.35);
  --amber:        #ffab00;
  --green:        #00e676;
  --red:          #ff4444;
  --text:         #c8d8ea;
  --text-dim:     #5a7080;
  --text-muted:   #334455;
  --font-ui:      'Rajdhani', sans-serif;
  --font-mono:    'Share Tech Mono', monospace;
  --top-h:        54px;
  --bot-h:        44px;
}

body {
  font-family: var(--font-ui);
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

body.light-mode {
  --bg:         #eef2f7;
  --surface:    #ffffff;
  --surface-2:  #f4f7fc;
  --border:     rgba(0,100,180,0.14);
  --text:       #1a2535;
  --text-dim:   #6080a0;
  --accent-dim: rgba(0,120,200,0.1);
}

body.fade-in  { opacity:1; }
body.fade-out { opacity:0; }
body { opacity:0; transition:opacity .3s ease; }

/* ── OVERLAY ────────────────────────────────────────── */
.overlay {
  position:fixed; inset:0;
  background:rgba(0,0,0,.55);
  backdrop-filter:blur(2px);
  z-index:100; opacity:0; pointer-events:none;
  transition:opacity .3s;
}
.overlay.active { opacity:1; pointer-events:all; }

/* ── SIDE PANEL ─────────────────────────────────────── */
.side-panel {
  position:fixed; top:0; left:-280px; width:260px; height:100%;
  background:var(--surface);
  border-right:1px solid var(--border);
  z-index:200; transition:left .3s cubic-bezier(.4,0,.2,1);
  display:flex; flex-direction:column;
}
.side-panel.active { left:0; }

.side-panel-header {
  padding:24px 20px 16px;
  border-bottom:1px solid var(--border);
}
.side-panel-header h2 {
  font-family:var(--font-ui); font-size:1.4rem; font-weight:700;
  color:var(--accent); letter-spacing:.1em;
}
.side-panel-header p {
  font-size:.7rem; color:var(--text-dim);
  letter-spacing:.12em; text-transform:uppercase; margin-top:2px;
}
.side-panel-nav { padding:12px 0; flex:1; overflow-y:auto; }
.side-nav-section-label {
  font-size:.62rem; letter-spacing:.18em; text-transform:uppercase;
  color:var(--text-muted); padding:8px 20px 4px;
}
.side-nav-link {
  display:flex; align-items:center; gap:12px;
  padding:10px 20px; text-decoration:none;
  color:var(--text); transition:background .18s, color .18s;
  font-family:var(--font-ui); font-size:1rem; font-weight:500;
  letter-spacing:.04em;
}
.side-nav-link:hover { background:var(--accent-dim); color:var(--accent); }
.side-nav-icon { width:26px; height:26px; flex-shrink:0; }
.side-nav-icon svg { width:100%; height:100%; }

/* ── TOP BAR ────────────────────────────────────────── */
.top-bar {
  position:fixed; top:0; left:0; right:0; height:var(--top-h);
  background:rgba(8,13,20,.92);
  backdrop-filter:blur(12px);
  border-bottom:1px solid var(--border);
  display:flex; align-items:center; justify-content:space-between;
  padding:0 20px; z-index:50;
}
body.light-mode .top-bar { background:rgba(238,242,247,.92); }

.hamburger {
  width:36px; height:36px; cursor:pointer;
  display:flex; flex-direction:column; justify-content:center;
  gap:5px; padding:4px;
}
.hamburger-line {
  height:2px; background:var(--text); border-radius:2px;
  transition:transform .25s, opacity .25s;
}
.hamburger:hover .hamburger-line { background:var(--accent); }
.hamburger.active .hamburger-line:nth-child(1) { transform:translateY(7px) rotate(45deg); }
.hamburger.active .hamburger-line:nth-child(2) { opacity:0; }
.hamburger.active .hamburger-line:nth-child(3) { transform:translateY(-7px) rotate(-45deg); }

.top-center {
  position:absolute; left:50%; transform:translateX(-50%);
  text-align:center; pointer-events:none;
}
.site-label {
  display:block; font-family:var(--font-ui);
  font-size:.72rem; font-weight:600;
  letter-spacing:.28em; text-transform:uppercase;
  color:var(--accent);
}
.page-title {
  display:block; font-family:var(--font-ui);
  font-size:.82rem; font-weight:500;
  letter-spacing:.18em; text-transform:uppercase;
  color:var(--text-dim);
}
#ahu-header-display {
  display:block; font-family:var(--font-ui);
  font-size:.75rem; font-weight:600;
  letter-spacing:.15em; text-transform:uppercase;
  color:var(--text);
}

.top-right { display:flex; align-items:center; gap:14px; }

.toggle-container { display:flex; align-items:center; gap:8px; }
.toggle-label {
  font-size:.7rem; letter-spacing:.1em;
  text-transform:uppercase; color:var(--text-dim);
}
.toggle-switch {
  width:40px; height:22px; background:var(--surface-2);
  border:1px solid var(--border); border-radius:11px;
  cursor:pointer; position:relative; transition:background .2s;
}
.toggle-switch.active { background:rgba(0,180,255,.25); }
.toggle-slider {
  width:16px; height:16px; background:var(--text-dim);
  border-radius:50%; position:absolute; top:2px; left:2px;
  transition:transform .25s, background .2s;
}
.toggle-switch.active .toggle-slider { transform:translateX(18px); background:var(--accent); }

.user-badge {
  display:flex; align-items:center; gap:7px;
  background:var(--surface-2); border:1px solid var(--border);
  border-radius:20px; padding:4px 12px 4px 8px;
}
.user-dot {
  width:7px; height:7px; border-radius:50%;
  background:var(--green); box-shadow:0 0 6px var(--green);
  animation:pulse 2s ease-in-out infinite;
}
@keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.5} }
#userDisplay {
  font-size:.72rem; font-family:var(--font-mono);
  color:var(--text); letter-spacing:.05em;
}

/* drag mode pill */
.drag-mode-pill {
  display:flex; align-items:center; gap:6px;
  background:var(--surface-2); border:1px solid var(--border);
  border-radius:20px; padding:4px 12px;
  font-size:.7rem; font-family:var(--font-mono);
  letter-spacing:.08em; color:var(--text-dim);
  cursor:pointer; transition:all .2s;
  user-select:none;
}
.drag-mode-pill:hover { border-color:var(--accent); color:var(--accent); }
.drag-mode-pill.active {
  border-color:var(--amber); color:var(--amber);
  background:rgba(255,171,0,.08);
  box-shadow:0 0 10px rgba(255,171,0,.2);
}
.drag-mode-dot {
  width:6px; height:6px; border-radius:50%;
  background:var(--text-dim); transition:background .2s;
}
.drag-mode-pill.active .drag-mode-dot { background:var(--amber); }

/* export btn */
#exportJsonBtn {
  display:none;
  background:var(--surface-2); border:1px solid var(--green);
  color:var(--green); font-family:var(--font-mono);
  font-size:.65rem; letter-spacing:.1em;
  padding:4px 12px; border-radius:5px; cursor:pointer;
  transition:all .2s;
}
#exportJsonBtn:hover { background:rgba(0,230,118,.1); }
#exportJsonBtn.visible { display:block; }

/* ── MAIN CONTENT ───────────────────────────────────── */
.main-content {
  flex:1;
  margin-top:var(--top-h);
  margin-bottom:var(--bot-h);
  position:relative;
  overflow:visible;
  background:linear-gradient(135deg, #060d1a 0%, #0a1628 50%, #06111e 100%);
  display:flex; align-items:center; justify-content:center;
}

/* floor plan status */
.floor-plan-status {
  position:absolute; top:12px; left:12px;
  font-family:var(--font-mono); font-size:.65rem;
  letter-spacing:.08em; padding:5px 12px;
  border-radius:4px; z-index:20;
  background:rgba(0,180,255,.12);
  border:1px solid var(--border); color:var(--accent);
  transition:opacity .5s;
}
.floor-plan-status.status-success {
  background:rgba(0,230,118,.1); border-color:rgba(0,230,118,.3);
  color:var(--green);
}
.floor-plan-status.status-error {
  background:rgba(255,68,68,.1); border-color:rgba(255,68,68,.3);
  color:var(--red);
}

/* AHU dropdown */
#ahuContainerBubbles {
  position:absolute; top:14px; right:14px;
  z-index:30;
}
#ahuContainerBubbles select {
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:6px;
  color:var(--text);
  font-family:var(--font-mono);
  font-size:.72rem; letter-spacing:.06em;
  padding:6px 10px;
  cursor:pointer; outline:none;
  transition:border-color .2s;
}
#ahuContainerBubbles select:hover { border-color:var(--accent); }

/* floor nav dropdown */
.floor-dropdown-wrapper {
  position:absolute; top:14px; left:14px; z-index:30;
}
.floor-dropdown-wrapper select {
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:6px; color:var(--text);
  font-family:var(--font-mono); font-size:.72rem;
  letter-spacing:.06em; padding:6px 10px;
  cursor:pointer; outline:none; transition:border-color .2s;
}
.floor-dropdown-wrapper select:hover { border-color:var(--accent); }

/* ── IMAGE WRAPPER ──────────────────────────────────── */
#floorPlanWrapper {
  position: relative;
  display: inline-block;
  max-width: 100%;
  max-height: 100%;
  background: #1b2633;
  border-radius: 8px;
  box-shadow: inset 0 0 40px rgba(0,0,0,0.4);
}
#floorPlanImage {
  display:none;
  max-width:100%; max-height:calc(100vh - var(--top-h) - var(--bot-h));
  object-fit:contain;
  border-radius:6px;
}

/* ── ZONE BOX ───────────────────────────────────────── */
.zone-box {
  position:absolute;
  border:2px solid rgba(0,180,255,0.5);
  background: rgba(0,180,255,0.08);
  cursor:move;
  border-radius:4px;
  transition:border-color .2s, background .2s, box-shadow .2s, transform .05s;
  z-index:60;
  transform-origin: center center;
}

/* ── TEMPERATURE COLORS — always visible ── */
.zone-box.temp-normal {
  border-color: rgb(0, 255, 55);
  background:   rgba(0,160,80,0.10);
  box-shadow:   0 0 6px rgba(0,160,80,0.18);
}
.zone-box.temp-cold {
  border-color: rgba(5, 17, 182, 0.7);
  background:   rgba(0,180,255,0.12);
  box-shadow:   0 0 8px rgba(0,180,255,0.25);
}
.zone-box.temp-hot {
  border-color: rgb(255, 140, 0);
  background:   rgba(255,140,0,0.12);
  box-shadow:   0 0 8px rgba(255,140,0,0.25);
}
.zone-box.temp-loading {
  border-color: rgba(90,112,128,0.4);
  background:   transparent;
  box-shadow:   none;
}

/* ── HOVER — darken/intensify each color ── */
.zone-box.temp-normal:hover,
.zone-box.temp-normal.hovered {
  border-color: rgba(0,160,80,0.95);
  background:   rgba(0,160,80,0.20);
  box-shadow:   0 0 0 1px rgba(0,160,80,0.35),
                inset 0 0 0 1000px rgba(0,160,80,0.10);
  z-index:300;
}
.zone-box.temp-cold:hover,
.zone-box.temp-cold.hovered {
  border-color: rgba(0,180,255,0.95);
  background:   rgba(0,180,255,0.22);
  box-shadow:   0 0 0 1px rgba(0,180,255,0.3),
                inset 0 0 0 1000px rgba(0,180,255,0.1);
  z-index:300;
}
.zone-box.temp-hot:hover,
.zone-box.temp-hot.hovered {
  border-color: rgba(255,140,0,0.95);
  background:   rgba(255,140,0,0.22);
  box-shadow:   0 0 0 1px rgba(255,140,0,0.3),
                inset 0 0 0 1000px rgba(255,140,0,0.1);
  z-index:300
}
.zone-box.temp-loading:hover,
.zone-box.temp-loading.hovered {
  border-color: rgba(0,180,255,0.9);
  background:   rgba(0,180,255,0.06);
  box-shadow:   0 0 0 1px rgba(0,180,255,0.2),
                inset 0 0 0 1000px rgba(0,180,255,0.04);
  z-index:300;
}

/* drag mode: show all boxes clearly */
body.drag-mode .zone-box {
  border-style: dashed;
  border-color:rgba(255,255,255,.7);
  cursor:move;
}

/* resize handle (bottom-right corner) */
.zone-resize-handle {
  position:absolute;
  bottom:0; right:0;
  width:14px; height:14px;
  cursor:se-resize;
  z-index:300;
}
.zone-resize-handle::before {
  content:'';
  position:absolute; bottom:3px; right:3px;
  width:7px; height:7px;
  border-right:2px solid rgba(0,180,255,0.6);
  border-bottom:2px solid rgba(0,180,255,0.6);
}
body.drag-mode .zone-resize-handle::before {
  border-color:rgba(255,255,255,.8);
}
.zone-resize-handle:hover::before {
  border-color:var(--accent);
}

/* rotation handle (top-center) */
.zone-rotate-handle {
  position:absolute;
  top:-22px; left:50%;
  transform:translateX(-50%);
  width:14px; height:14px;
  cursor:grab;
  z-index:13;
  display:none; /* only shown in drag mode */
}
.zone-rotate-handle::before {
  content:'↻';
  position:absolute; top:0; left:50%;
  transform:translateX(-50%);
  font-size:14px; line-height:1;
  color:rgba(0,220,255,0.8);
  transition:color .2s;
}
.zone-rotate-handle:hover::before { color:#fff; }
body.drag-mode .zone-rotate-handle { display:block; }
body.drag-mode .zone-rotate-handle::before { color:rgba(255,255,255,.7); }

/* stem line from box top to rotate handle */
.zone-rotate-handle::after {
  content:'';
  position:absolute;
  top:14px; left:50%;
  transform:translateX(-50%);
  width:1px; height:8px;
  background:rgba(0,220,255,0.5);
}
body.drag-mode .zone-rotate-handle::after { background:rgba(255,255,255,.4); }

/* ── ZONE TOOLTIP ───────────────────────────────────── */
.zone-tooltip {
  position:absolute;
  bottom:calc(100% + 8px); left:50%;
  transform: translateX(-50%) rotate(var(--zone-counter-rot, 0deg));
  transform-origin: center bottom;
  background:rgba(8,13,20,.95);
  border:1px solid var(--border-hover);
  border-radius:6px;
  padding:8px 14px;
  min-width:140px;
  pointer-events:none;
  opacity:0;
  transition:opacity .18s;
  z-index:400;
  white-space:nowrap;
  backdrop-filter:blur(8px);
}
.zone-box:hover .zone-tooltip,
.zone-box.hovered .zone-tooltip {
  opacity:1;
}
.tooltip-unit {
  font-family:var(--font-ui); font-weight:700;
  font-size:.9rem; letter-spacing:.05em;
  color:var(--text); margin-bottom:4px;
}
.tooltip-mode {
  font-family:var(--font-mono); font-size:.68rem;
  color:var(--text-dim); letter-spacing:.06em;
  margin-bottom:3px;
}
.tooltip-temp {
  font-family:var(--font-mono); font-size:.85rem;
  font-weight:600; letter-spacing:.04em;
  color:var(--accent);
}
.zone-box.temp-cold .tooltip-temp { color:#00b4ff; }
.zone-box.temp-hot  .tooltip-temp { color:#ff8c00; }
.zone-box.temp-normal .tooltip-temp { color:#00a050; }
.zone-box.temp-loading .tooltip-temp { color:var(--text-dim); }

.tooltip-setpoint {
  font-family:var(--font-mono); font-size:.65rem;
  color:var(--text-dim); letter-spacing:.04em;
  margin-top:3px; padding-top:3px;
  border-top:1px solid rgba(255,255,255,0.08);
}

/* keep tooltip on screen */
.zone-tooltip.flip-up {
  bottom:auto; top:calc(100% + 8px);
}

/* ── BOTTOM BAR ─────────────────────────────────────── */
.bottom-bar {
  position:fixed; bottom:0; left:0; right:0; height:var(--bot-h);
  background:rgba(8,13,20,.92);
  backdrop-filter:blur(12px);
  border-top:1px solid var(--border);
  display:flex; align-items:center; justify-content:space-between;
  padding:0 20px; z-index:50;
}
body.light-mode .bottom-bar { background:rgba(238,242,247,.92); }

.back-btn, .logoff-btn {
  background:none; border:1px solid var(--border);
  color:var(--text-dim); font-family:var(--font-ui);
  font-size:.78rem; font-weight:600;
  letter-spacing:.1em; text-transform:uppercase;
  padding:5px 14px; border-radius:5px; cursor:pointer;
  transition:border-color .2s, color .2s, background .2s;
}
.back-btn:hover { border-color:var(--accent); color:var(--accent); background:var(--accent-dim); }
.logoff-btn:hover { border-color:#ff5252; color:#ff5252; background:rgba(255,82,82,.1); }

.datetime-display {
  font-family:var(--font-mono);
  font-size:.68rem; color:var(--text-dim); letter-spacing:.08em;
}

/* export modal */
#exportModal {
  display:none;
  position:fixed; inset:0;
  background:rgba(0,0,0,.7);
  z-index:3000;
  align-items:center; justify-content:center;
}
#exportModal.open { display:flex; }
.modal-box {
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:10px;
  padding:24px; max-width:580px; width:90%;
  max-height:80vh; overflow:auto;
}
.modal-box h3 {
  font-family:var(--font-ui); font-size:1.1rem;
  letter-spacing:.1em; text-transform:uppercase;
  color:var(--accent); margin-bottom:12px;
}
.modal-box textarea {
  width:100%; height:260px;
  background:var(--bg); color:var(--text);
  border:1px solid var(--border); border-radius:6px;
  padding:10px; font-family:var(--font-mono); font-size:.7rem;
  resize:vertical;
}
.modal-actions { display:flex; gap:10px; margin-top:12px; }
.modal-btn {
  flex:1; padding:9px;
  font-family:var(--font-ui); font-size:.85rem;
  font-weight:600; letter-spacing:.08em;
  border:1px solid var(--border); border-radius:6px;
  cursor:pointer; transition:all .2s;
  background:var(--surface-2); color:var(--text);
}
.modal-btn.primary { border-color:var(--accent); color:var(--accent); }
.modal-btn.primary:hover { background:var(--accent-dim); }
.modal-btn:hover { background:rgba(255,255,255,.05); }
</style>
</head>

          <path d="M22,20 Q28,20 28,26" fill="none" stroke="#00c8ff" stroke-width="1.5"/>

        </svg>

      <span class="side-nav-label">Floor Plan</span>
    </a>
    <a href="../Alarms.html" class="side-nav-link">
      <span class="side-nav-icon">
        <svg viewBox="0 0 40 40" xmlns="http://www.w3.org/2000/svg">
          <polygon points="20,5 37,34 3,34" fill="none" stroke="#ffab00" stroke-width="2.2" stroke-linejoin="round"/>

<!-- ════════════════════════════════════════════════════════════════
     CORE FLOOR PLAN + ZONE BOX SYSTEM
════════════════════════════════════════════════════════════════ -->
<script>
'use strict';

// ── State ──────────────────────────────────────────────────────────
let configData        = null;
let globalConfigData  = null;
let positionData      = null;
let usingJsonData     = false;
let dragEnabled       = localStorage.getItem('drag-enabled') === 'true';

// ── Page ID from filename ──────────────────────────────────────────
function parseFileName(fileName) {
  const base = fileName.replace('.html','');
  let wing = null;
  if (base.includes('_East') || base.toLowerCase().endsWith('east')) wing = 'East';
  else if (base.includes('_West') || base.toLowerCase().endsWith('west')) wing = 'West';
  const m = base.match(/Floor(\d+)/i);
  return { floorNumber: m ? parseInt(m[1]) : null, wing, baseName: base };
}

const _path     = window.location.pathname;
const _fileName = _path.substring(_path.lastIndexOf('/') + 1);
const { floorNumber: PAGE_FLOOR, wing: PAGE_WING } = parseFileName(_fileName);

function getPageId() {
  if (PAGE_WING === 'East') return `${PAGE_FLOOR}_E`;
  if (PAGE_WING === 'West') return `${PAGE_FLOOR}_W`;
  return String(PAGE_FLOOR);
}
const pageId = getPageId();
console.log(`🔢 Page ID: ${pageId}`);

// ── Drag mode UI ───────────────────────────────────────────────────
function updateDragModeUI() {
  const pill  = document.getElementById('dragToggle');
  const label = document.getElementById('dragToggleLabel');
  const exportBtn = document.getElementById('exportJsonBtn');
  if (dragEnabled) {
    pill.classList.add('active');
    label.textContent = 'Exit Edit';
    document.body.classList.add('drag-mode');
    exportBtn.classList.add('visible');
  } else {
    pill.classList.remove('active');
    label.textContent = 'Edit Mode';
    document.body.classList.remove('drag-mode');
    exportBtn.classList.remove('visible');
  }
}

function toggleDragMode() {
  dragEnabled = !dragEnabled;
  localStorage.setItem('drag-enabled', dragEnabled);
  updateDragModeUI();
}

// ── Floor name map ─────────────────────────────────────────────────
function buildFloorNameMap(config) {
  const map = {};
  if (config?.floorNames) config.floorNames.forEach((n,i) => { map[i] = n; });
  if (config?.VAVs) config.VAVs.forEach(v => { if (v.floornumber !== undefined && v.Floornumber_NAME && !map[v.floornumber]) map[v.floornumber] = v.Floornumber_NAME; });
  if (config?.FTU)  config.FTU.forEach(f => { if (f.floornumber !== undefined && f.Floornumber_NAME && !map[f.floornumber]) map[f.floornumber] = f.Floornumber_NAME; });
  return map;
}

// ── Config loading ─────────────────────────────────────────────────
async function loadHomeConfig() {
  if (configData) return configData;
  try {
    const r = await fetch('../HomeConfig.json');
    if (!r.ok) throw new Error(`HTTP ${r.status}`);
    configData = await r.json();
    return configData;
  } catch(e) {
    showStatus(`Config error: ${e.message}`, 'error');
    return null;
  }
}

async function loadGlobalConfig() {
  if (globalConfigData) return globalConfigData;
  try {
    const r = await fetch('../Global.json');
    if (!r.ok) throw new Error(`HTTP ${r.status}`);
    globalConfigData = await r.json();
    return globalConfigData;
  } catch(e) {
    console.warn('Global.json not available:', e.message);
    return null;
  }
}

// ── Position JSON ──────────────────────────────────────────────────
async function loadPositionsFromJSON() {
  try {
    const r = await fetch('../FloorPlan.json');
    if (!r.ok) throw new Error();
    const data = await r.json();
    if (data && data[pageId]) {
      positionData = data[pageId];
      usingJsonData = true;
      console.log(`✅ Loaded positions from FloorPlan.json for ${pageId}`);
      return true;
    }
  } catch { /* fall through */ }
  return false;
}

async function exportPositionsToJSON() {
  let existing = {};
  try {
    const r = await fetch('../FloorPlan.json');
    if (r.ok) existing = await r.json();
  } catch {}

  const current = { zones: {} };
  const img = document.getElementById('floorPlanImage');
  if (!img) return existing;
  const imgRect = img.getBoundingClientRect();

  document.querySelectorAll('.zone-box').forEach(el => {
    if (!el.id) return;
    const w  = parseFloat(el.style.width)  || 100;
    const h  = parseFloat(el.style.height) || 60;
    const cx = parseFloat(el.style.left) + w / 2;
    const cy = parseFloat(el.style.top)  + h / 2;
    current.zones[el.id] = {
      leftPercent:  parseFloat(((cx / img.clientWidth)  * 100).toFixed(2)),
      topPercent:   parseFloat(((cy / img.clientHeight) * 100).toFixed(2)),
      widthPercent: parseFloat((w   / img.clientWidth   * 100).toFixed(2)),
      heightPercent:parseFloat((h   / img.clientHeight  * 100).toFixed(2)),
      rotation:     getZoneRotation(el),
    };
  });

  existing[pageId] = current;
  return existing;
}

// ── Export modal ───────────────────────────────────────────────────
async function openExportModal() {
  document.getElementById('modalPageId').textContent = pageId;
  const data = await exportPositionsToJSON();
  document.getElementById('jsonOutput').value = JSON.stringify(data, null, 2);
  document.getElementById('exportModal').classList.add('open');
}
function closeExportModal() { document.getElementById('exportModal').classList.remove('open'); }
function copyExportJson() {
  const ta = document.getElementById('jsonOutput');
  ta.select(); document.execCommand('copy');
  alert('JSON copied to clipboard!');
}

// ── Status bar ─────────────────────────────────────────────────────
function showStatus(msg, type='loading') {
  const el = document.getElementById('floorPlanStatus');
  el.className = `floor-plan-status status-${type}`;
  el.textContent = msg;
  el.style.opacity = '1';
  if (type !== 'loading') setTimeout(() => { el.style.opacity = '0'; }, 3000);
}

// ── Image / Wrapper helpers ────────────────────────────────────────
function getImg() { return document.getElementById('floorPlanImage'); }
function getWrapper() { return document.getElementById('floorPlanWrapper'); }

// ── Floor plan loading ─────────────────────────────────────────────
function findMatchingFloorPlan(config) {
  const floorNameMap = buildFloorNameMap(config);
  for (const [, value] of Object.entries(config.floorPlans)) {
    if (value.FloorNUM !== PAGE_FLOOR) continue;
    if (value.wing === 'Split') {
      if (PAGE_WING === 'East' && value.dataEast) {
        return { ...value, data: value.dataEast, originalFileName: value.originalFileNameEast, name: `${floorNameMap[PAGE_FLOOR]||`Floor ${PAGE_FLOOR}`} East` };
      }
      if (PAGE_WING === 'West' && value.dataWest) {
        return { ...value, data: value.dataWest, originalFileName: value.originalFileNameWest, name: `${floorNameMap[PAGE_FLOOR]||`Floor ${PAGE_FLOOR}`} West` };
      }
    } else {
      return { ...value, name: floorNameMap[PAGE_FLOOR] || value.name };
    }
  }
  return null;
}

async function loadFloorPlan() {
  showStatus('Loading floor plan…', 'loading');
  const config = await loadHomeConfig();
  if (!config?.floorPlans) { showStatus('Config missing floorPlans', 'error'); return; }

  const fp = findMatchingFloorPlan(config);
  if (!fp) { showStatus('No matching floor plan found', 'error'); return; }

  const img = getImg();
  img.onload = () => {
    showStatus(`Loaded: ${fp.name}`, 'success');
    img.style.display = 'block';
    repositionAllZones();
  };
  img.onerror = () => showStatus('Image load error', 'error');
  img.src = fp.data;
  img.alt = fp.name;
}

// ── Rotation helpers ───────────────────────────────────────────────
function getZoneRotation(el) {
  return parseFloat(el.dataset.rotation || '0');
}
function applyZoneRotation(el, deg) {
  el.dataset.rotation = deg;
  el.style.transform = `rotate(${deg}deg)`;
  el.style.setProperty('--zone-counter-rot', `${-deg}deg`);
}

// ── Position save/load per zone ────────────────────────────────────
function saveZonePosition(el) {
  if (usingJsonData) return;
  const img = getImg(); if (!img) return;
  const w  = parseFloat(el.style.width)  || 100;
  const h  = parseFloat(el.style.height) || 60;
  const cx = parseFloat(el.style.left) + w / 2;
  const cy = parseFloat(el.style.top)  + h / 2;
  const data = {
    leftPercent:  (cx / img.clientWidth)  * 100,
    topPercent:   (cy / img.clientHeight) * 100,
    widthPercent: (w  / img.clientWidth)  * 100,
    heightPercent:(h  / img.clientHeight) * 100,
    rotation:     getZoneRotation(el),
  };
  localStorage.setItem(`zone-pos-${pageId}-${el.id}`, JSON.stringify(data));
}

function loadZonePosition(el) {
  const img = getImg(); if (!img) return;
  el.style.position = 'absolute';

  if (usingJsonData && positionData?.zones?.[el.id]) {
    const p = positionData.zones[el.id];
    applyZonePosition(el, p, img);
    return;
  }
  const raw = localStorage.getItem(`zone-pos-${pageId}-${el.id}`);
  if (!raw) { setDefaultZonePosition(el, img); return; }
  applyZonePosition(el, JSON.parse(raw), img);
}

function applyZonePosition(el, p, img) {
  const w = (p.widthPercent  / 100) * img.clientWidth;
  const h = (p.heightPercent / 100) * img.clientHeight;
  const cx = (p.leftPercent  / 100) * img.clientWidth;
  const cy = (p.topPercent   / 100) * img.clientHeight;
  el.style.width  = `${w}px`;
  el.style.height = `${h}px`;
  el.style.left   = `${cx - w/2}px`;
  el.style.top    = `${cy - h/2}px`;
  if (p.rotation !== undefined) applyZoneRotation(el, p.rotation);
  else el.style.setProperty('--zone-counter-rot', '0deg');
}

function setDefaultZonePosition(el, img) {
  const zones = Array.from(document.querySelectorAll('.zone-box'));
  const idx = zones.indexOf(el);
  const cols = Math.ceil(Math.sqrt(zones.length));
  const row  = Math.floor(idx / cols);
  const col  = idx % cols;
  const w = Math.min(120, img.clientWidth * 0.12);
  const h = Math.min(80,  img.clientHeight * 0.1);
  const startX = img.clientWidth  * 0.1;
  const startY = img.clientHeight * 0.1;
  const gapX   = (img.clientWidth  * 0.8) / Math.max(cols - 1, 1);
  const gapY   = (img.clientHeight * 0.8) / Math.max(Math.ceil(zones.length / cols) - 1, 1);
  el.style.width  = `${w}px`;
  el.style.height = `${h}px`;
  el.style.left   = `${startX + col * gapX - w/2}px`;
  el.style.top    = `${startY + row * gapY - h/2}px`;
}

function repositionAllZones() {
  const img = getImg(); if (!img?.complete) return;
  setTimeout(() => {
    document.querySelectorAll('.zone-box').forEach(el => loadZonePosition(el));
  }, 30);
}

// ── Zone dragging ──────────────────────────────────────────────────
function makeZoneDraggable(el) {
  const wrapper = getWrapper();
  let dragging = false, moved = false;
  let startMx, startMy, startL, startT;

  el.addEventListener('mousedown', e => {
    if (!dragEnabled) return;
    if (e.target.classList.contains('zone-resize-handle')) return;
    dragging = true; moved = false;
    startMx = e.clientX; startMy = e.clientY;
    startL  = parseFloat(el.style.left) || 0;
    startT  = parseFloat(el.style.top)  || 0;
    el.style.zIndex = 100;
    e.preventDefault();
  });

  document.addEventListener('mousemove', e => {
    if (!dragging || !dragEnabled) return;
    const img = getImg(); if (!img) return;
    const imgRect  = img.getBoundingClientRect();
    const wrapRect = wrapper.getBoundingClientRect();
    const dx = e.clientX - startMx;
    const dy = e.clientY - startMy;
    let newL = startL + dx;
    let newT = startT + dy;
    const w = parseFloat(el.style.width)  || 100;
    const h = parseFloat(el.style.height) || 60;
    const offL = imgRect.left - wrapRect.left;
    const offT = imgRect.top  - wrapRect.top;
    newL = Math.max(offL, Math.min(newL, offL + imgRect.width  - w));
    newT = Math.max(offT, Math.min(newT, offT + imgRect.height - h));
    el.style.left = `${newL}px`;
    el.style.top  = `${newT}px`;
    moved = true;
  });

  document.addEventListener('mouseup', e => {
    if (!dragging) return;
    dragging = false;
    el.style.zIndex = '';
    if (moved) saveZonePosition(el);
    moved = false;
  });

  el.addEventListener('click', e => {
    if (moved) return;
    if (dragEnabled) return;
    const href = el.dataset.href;
    if (href) window.open(href, '_blank');
  });
}

// ── Zone resizing ──────────────────────────────────────────────────
function makeZoneResizable(el) {
  const handle = el.querySelector('.zone-resize-handle');
  if (!handle) return;
  let resizing = false;
  let startMx, startMy, startW, startH;

  handle.addEventListener('mousedown', e => {
    if (!dragEnabled) return;
    resizing = true;
    startMx = e.clientX; startMy = e.clientY;
    startW  = parseFloat(el.style.width)  || 120;
    startH  = parseFloat(el.style.height) || 80;
    e.preventDefault(); e.stopPropagation();
  });

  document.addEventListener('mousemove', e => {
    if (!resizing || !dragEnabled) return;
    const dx = e.clientX - startMx;
    const dy = e.clientY - startMy;
    el.style.width  = `${Math.max(10, startW + dx)}px`;
    el.style.height = `${Math.max(10, startH + dy)}px`;
  });

  document.addEventListener('mouseup', () => {
    if (!resizing) return;
    resizing = false;
    saveZonePosition(el);
  });
}

// ── Zone rotation ──────────────────────────────────────────────────
function makeZoneRotatable(el) {
  const handle = el.querySelector('.zone-rotate-handle');
  if (!handle) return;
  let rotating = false;
  let startAngle = 0;
  let startRot   = 0;

  function getAngle(cx, cy, mx, my) {
    return Math.atan2(my - cy, mx - cx) * (180 / Math.PI);
  }

  handle.addEventListener('mousedown', e => {
    if (!dragEnabled) return;
    rotating = true;
    handle.style.cursor = 'grabbing';
    const rect = el.getBoundingClientRect();
    const cx = rect.left + rect.width  / 2;
    const cy = rect.top  + rect.height / 2;
    startAngle = getAngle(cx, cy, e.clientX, e.clientY);
    startRot   = getZoneRotation(el);
    e.preventDefault(); e.stopPropagation();
  });

  document.addEventListener('mousemove', e => {
    if (!rotating || !dragEnabled) return;
    const rect = el.getBoundingClientRect();
    const cx = rect.left + rect.width  / 2;
    const cy = rect.top  + rect.height / 2;
    const currentAngle = getAngle(cx, cy, e.clientX, e.clientY);
    let newRot = startRot + (currentAngle - startAngle);
    if (e.shiftKey) newRot = Math.round(newRot / 5) * 5;
    applyZoneRotation(el, newRot);
  });

  document.addEventListener('mouseup', () => {
    if (!rotating) return;
    rotating = false;
    handle.style.cursor = 'grab';
    saveZonePosition(el);
  });
}

// ── Temperature class helper ───────────────────────────────────────
// Uses setpoint if available: hot = temp > setpoint+3, cold = temp < setpoint-3
// Falls back to absolute thresholds (>77 hot, <65 cold) when no setpoint found.
function getTempClass(temp, setpoint) {
  const t = parseFloat(temp);
  if (isNaN(t)) return 'temp-loading';
  const sp = parseFloat(setpoint);
  if (!isNaN(sp)) {
    if (t > sp + 3) return 'temp-hot';
    if (t < sp - 3) return 'temp-cold';
    return 'temp-normal';
  }
  // fallback: no setpoint available
  if (t > 77) return 'temp-hot';
  if (t < 65) return 'temp-cold';
  return 'temp-normal';
}

// ── Build tooltip content ──────────────────────────────────────────
function buildTooltip(unitId, mode, temp) {
  const tooltip = document.createElement('div');
  tooltip.className = 'zone-tooltip';
  tooltip.innerHTML = `
    <div class="tooltip-unit">${unitId}</div>
    <div class="tooltip-mode">${mode || '—'}</div>
    <div class="tooltip-temp">${temp !== null ? `${temp}°F` : 'Loading…'}</div>
    <div class="tooltip-setpoint" data-setpoint-line></div>
  `;
  return tooltip;
}

// ── Update setpoint line in tooltip ───────────────────────────────
function updateTooltipSetpointLine(zoneBoxEl, setpointVal) {
  const line = zoneBoxEl.querySelector('[data-setpoint-line]');
  if (!line) return;
  const sp = parseFloat(setpointVal);
  if (!isNaN(sp)) {
    line.textContent = `SP: ${sp}°F`;
    line.style.display = '';
  } else {
    // No setpoint — show fallback band calculation
    line.textContent = `Band: >77°F / <65°F`;
    line.style.display = '';
  }
}

// ── Create a zone box ──────────────────────────────────────────────
function createZoneBox(unitId, href, initialMode, initialTemp) {
  const wrapper = getWrapper();
  const box = document.createElement('div');
  box.className = 'zone-box draggable temp-loading';
  box.id = `zone_${unitId}`;
  box.dataset.href = href;
  box.dataset.unit = unitId;

  const rh = document.createElement('div');
  rh.className = 'zone-resize-handle';
  box.appendChild(rh);

  const rotH = document.createElement('div');
  rotH.className = 'zone-rotate-handle';
  box.appendChild(rotH);

  const tooltip = buildTooltip(unitId, initialMode, initialTemp);
  box.appendChild(tooltip);

  wrapper.appendChild(box);

  loadZonePosition(box);

  makeZoneDraggable(box);
  makeZoneResizable(box);
  makeZoneRotatable(box);

  return box;
}

// ── Update zone box data (temp, mode) ─────────────────────────────
function updateZoneBox(unitId, mode, temp) {
  const box = document.getElementById(`zone_${unitId}`);
  if (!box) return;
  const tu = box.querySelector('.tooltip-unit');
  const tm = box.querySelector('.tooltip-mode');
  const tt = box.querySelector('.tooltip-temp');
  if (tu) tu.textContent = unitId;
  if (tm) tm.textContent = mode || '—';
  if (tt) tt.textContent = temp !== null ? `${temp}°F` : 'N/A';
  box.classList.remove('temp-cold','temp-hot','temp-normal','temp-loading');
  box.classList.add(getTempClass(temp));
}

// ── Reposition on resize ───────────────────────────────────────────
let resizeTimer;
window.addEventListener('resize', () => {
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(repositionAllZones, 150);
});

// ── Baja point reading ─────────────────────────────────────────────
function fetchBajaPoint(pointPath, callback) {
  if (typeof require !== 'undefined') {
    require(['baja!', 'baja!control:Override', 'baja!control:NumericOverride'], function(baja) {
      'use strict';
      try {
        if (!pointPath || typeof pointPath !== 'string' || pointPath.includes('{')) {
          return callback(new Error(`Invalid path: ${pointPath}`), null);
        }
        baja.Ord.make(pointPath).get()
          .then(point => {
            if (point?.getOut) {
              callback(null, point.getOut().getValueDisplay());
            } else {
              callback(new Error('No getOut'), null);
            }
          })
          .catch(err => callback(err, null));
      } catch(err) { callback(err, null); }
    });
  } else {
    callback(new Error('Baja not available'), null);
  }
}

// ── Create units (VAV/FTU/FCU/AHU) ────────────────────────────────
function filterByFloor(arr, isEast, isWest) {
  return arr.filter(item => {
    const s = String(item.FLNUM ?? item.floornumber ?? '');
    const base = s.split('_')[0];
    if (Number(base) !== PAGE_FLOOR) return false;
    if (isEast)  return s.endsWith('_E');
    if (isWest)  return s.endsWith('_W');
    return !s.includes('_E') && !s.includes('_W');
  });
}

const tryTempPoints    = ['SpaceTemp','ZN_T','Rm_T','RoomTemp','ZoneTemp'];
const SETPOINT_POINT   = 'Space-Setpoint';

// Match a point by id first, then fall back to name
function findPoint(points, idOrName) {
  return points.find(p => p.id === idOrName) || points.find(p => p.name === idOrName);
}

// ── Fetch unit data: mode, setpoint, then temp ─────────────────────
// Fetches Space-Setpoint first, then tries temp points in order.
// getTempClass receives both temp and setpoint so color logic is setpoint-relative.
function fetchUnitData(unitId, globalConfig, zoneBoxEl) {
  const unitData = globalConfig?.globalVariables?.[unitId];
  if (!unitData?.points) return;

  // --- Mode (StringWritable) ---
  const strPoint = findPoint(unitData.points, 'StringWritable');
  if (strPoint?.fullPath) {
    fetchBajaPoint(strPoint.fullPath, (err, val) => {
      const mode = err ? 'N/A' : val;
      const tm = zoneBoxEl.querySelector('.tooltip-mode');
      if (tm) tm.textContent = mode || 'N/A';
    });
  }

  // --- Setpoint then temp ---
  const spPoint = findPoint(unitData.points, SETPOINT_POINT);

  function fetchTempWithSetpoint(setpointVal) {
    // Update the setpoint display line in the tooltip
    updateTooltipSetpointLine(zoneBoxEl, setpointVal);

    const tryList = [...tryTempPoints];
    const tryNext = () => {
      if (!tryList.length) {
        const tt = zoneBoxEl.querySelector('.tooltip-temp');
        if (tt) tt.textContent = 'N/A';
        return;
      }
      const pName = tryList.shift();
      const pData = findPoint(unitData.points, pName);
      if (!pData?.fullPath) { tryNext(); return; }
      fetchBajaPoint(pData.fullPath, (err, val) => {
        if (err || val == null) { tryNext(); return; }
        const numVal = parseFloat(val);
        const tt = zoneBoxEl.querySelector('.tooltip-temp');
        if (tt) tt.textContent = val.toString().replace(/\s*°?\s*[Ff]\s*$/, '').trim() + '°F';
        zoneBoxEl.classList.remove('temp-cold','temp-hot','temp-normal','temp-loading');
        zoneBoxEl.classList.add(getTempClass(numVal, setpointVal));
      });
    };
    tryNext();
  }

  if (spPoint?.fullPath) {
    fetchBajaPoint(spPoint.fullPath, (err, val) => {
      if (err || val == null) {
        console.warn(`[${unitId}] Space-Setpoint fetch failed:`, err?.message ?? 'null value', '— using fallback thresholds');
        fetchTempWithSetpoint(null);
      } else {
        const spVal = parseFloat(val);
        console.log(`[${unitId}] Space-Setpoint = ${spVal}`);
        fetchTempWithSetpoint(isNaN(spVal) ? null : spVal);
      }
    });
  } else {
    console.log(`[${unitId}] No Space-Setpoint point found — using fallback thresholds`);
    fetchTempWithSetpoint(null);
  }
}

function createVAVUnits(config, globalConfig) {
  if (!Array.isArray(config.VAVs)) return;
  const isEast = PAGE_WING === 'East', isWest = PAGE_WING === 'West';
  const matches = filterByFloor(config.VAVs, isEast, isWest);
  console.log(`Found ${matches.length} VAVs for floor ${PAGE_FLOOR}`);
  matches.forEach(vav => {
    const flStr = String(vav.floornumber).split('_')[0];
    const href  = `../VAVs/VAV_${flStr}/${vav.name}.html`;
    const box   = createZoneBox(vav.name, href, null, null);
    fetchUnitData(vav.name, globalConfig, box);
  });
}

function createFTUUnits(config, globalConfig) {
  if (!Array.isArray(config.FTU)) return;
  const isEast = PAGE_WING === 'East', isWest = PAGE_WING === 'West';
  const matches = filterByFloor(config.FTU, isEast, isWest);
  console.log(`Found ${matches.length} FTUs for floor ${PAGE_FLOOR}`);
  matches.forEach(ftu => {
    const box = createZoneBox(ftu.name, `../FTUs/${ftu.name}.html`, null, null);
    fetchUnitData(ftu.name, globalConfig, box);
  });
}

function createFCUUnits(config, globalConfig) {
  if (!Array.isArray(config.FCUs)) return;
  const isEast = PAGE_WING === 'East', isWest = PAGE_WING === 'West';
  const matches = filterByFloor(config.FCUs, isEast, isWest);
  console.log(`Found ${matches.length} FCUs for floor ${PAGE_FLOOR}`);
  matches.forEach(fcu => {
    const box = createZoneBox(fcu.name, `../FCUs/${fcu.name}.html`, null, null);
    fetchUnitData(fcu.name, globalConfig, box);
  });
}

function createAHUUnits(config, globalConfig) {
  if (!Array.isArray(config.AHUs)) return;
  const isEast = PAGE_WING === 'East', isWest = PAGE_WING === 'West';
  const matches = config.AHUs.filter(ahu => {
    const obj  = typeof ahu === 'object' ? ahu : { name: ahu, FLNUM: '' };
    const s    = String(obj.FLNUM || '');
    if (!s) return false;
    const base = s.split('_')[0];
    if (Number(base) !== PAGE_FLOOR) return false;
    if (isEast) return s.endsWith('_E');
    if (isWest) return s.endsWith('_W');
    return !s.includes('_E') && !s.includes('_W');
  });
  console.log(`Found ${matches.length} AHUs for floor ${PAGE_FLOOR}`);
  matches.forEach(ahu => {
    const name = typeof ahu === 'object' ? ahu.name : ahu;
    const box  = createZoneBox(name, `../AHUs/${name}.html`, null, null);
    const tt = box.querySelector('.tooltip-temp');
    if (tt) tt.textContent = 'AHU Unit';
    box.classList.remove('temp-loading'); box.classList.add('temp-normal');
  });
}

async function createAllZoneBoxes() {
  const config       = await loadHomeConfig();
  const globalConfig = await loadGlobalConfig();
  if (!config) return;
  const img = getImg();
  if (!img.complete || img.naturalWidth === 0) {
    img.addEventListener('load', () => createAllZoneBoxes(), { once: true });
    return;
  }
  createVAVUnits(config, globalConfig);
  createFTUUnits(config, globalConfig);
  createFCUUnits(config, globalConfig);
  createAHUUnits(config, globalConfig);
}

// ── AHU Dropdown (top right) ───────────────────────────────────────
async function createAHUDropdown() {
  const config = await loadHomeConfig();
  if (!config?.AHUs?.length) return;
  const container = document.getElementById('ahuContainerBubbles');

  const select = document.createElement('select');
  const def = document.createElement('option');
  def.value = ''; def.textContent = `AHUs (${config.AHUs.length})`;
  def.disabled = true; def.selected = true;
  select.appendChild(def);

  config.AHUs.forEach(ahu => {
    const name = typeof ahu === 'object' ? ahu.name : ahu;
    const opt = document.createElement('option');
    opt.value = `../AHUs/${name}.html`;
    opt.textContent = name;
    select.appendChild(opt);
  });

  select.addEventListener('change', e => { if (e.target.value) window.location.href = e.target.value; });
  container.appendChild(select);

  const sideSection = document.getElementById('sideAhuSection');
  const sideList    = document.getElementById('sideAhuList');
  if (sideSection && sideList) {
    sideSection.style.display = 'block';
    config.AHUs.forEach(ahu => {
      const name = typeof ahu === 'object' ? ahu.name : ahu;
      const link = document.createElement('a');
      link.href = `../AHUs/${name}.html`;
      link.className = 'side-nav-link';
      link.style.fontSize = '.85rem';
      link.textContent = name;
      sideList.appendChild(link);
    });
  }
}

// ── Floor nav dropdown (top left) ─────────────────────────────────
async function createFloorPlanNavDropdown() {
  const config = await loadHomeConfig();
  if (!config?.floorPlans) return;
  const container = document.getElementById('floorPlanNavContainer');

  const floorNameMap = buildFloorNameMap(config);
  const select = document.createElement('select');
  const def = document.createElement('option');
  def.value = ''; def.textContent = 'Jump to floor…';
  def.disabled = true; def.selected = true;
  select.appendChild(def);

  Object.values(config.floorPlans).forEach(fp => {
    const num  = fp.FloorNUM;
    const name = floorNameMap[num] || fp.name || `Floor ${num}`;
    if (fp.wing === 'Split') {
      if (fp.dataEast) {
        const o = document.createElement('option');
        o.value = `${name.replace(/\s+/g,'_')}_Floor${num}_East.html`;
        o.textContent = `${name} – East`;
        select.appendChild(o);
      }
      if (fp.dataWest) {
        const o = document.createElement('option');
        o.value = `${name.replace(/\s+/g,'_')}_Floor${num}_West.html`;
        o.textContent = `${name} – West`;
        select.appendChild(o);
      }
    } else {
      if (!fp.originalFileName || fp.originalFileName === 'null') return;
      const o = document.createElement('option');
      o.value = `${name.replace(/\s+/g,'_')}_Floor${num}.html`;
      o.textContent = name;
      select.appendChild(o);
    }
  });

  select.addEventListener('change', e => { if (e.target.value) window.location.href = e.target.value; });
  container.appendChild(select);
}

// ── Header / page title ────────────────────────────────────────────
async function setPageHeader() {
  const config = await loadHomeConfig();
  const floorNameMap = buildFloorNameMap(config || {});
  let name = floorNameMap[PAGE_FLOOR] || `Floor ${PAGE_FLOOR}`;
  if (PAGE_WING) name += ` – ${PAGE_WING}`;
  document.getElementById('ahu-header').textContent = name;
  document.title = `Murphy Control — ${name}`;
}

// ── Init ───────────────────────────────────────────────────────────
document.addEventListener('DOMContentLoaded', async () => {
  updateDragModeUI();
  await loadPositionsFromJSON();
  await setPageHeader();
  await loadFloorPlan();
  await createAHUDropdown();
  await createFloorPlanNavDropdown();
  setTimeout(createAllZoneBoxes, 200);
  
  
});


</script>
