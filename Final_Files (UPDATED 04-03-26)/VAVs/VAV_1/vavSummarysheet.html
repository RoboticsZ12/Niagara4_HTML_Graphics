<!DOCTYPE html>
<!-- @noSnoop -->
<html lang="en" xmlns:b="http://www.tridium.com/baja/baja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Murphy Control Panel - VAV Summary</title>
    <script type='text/javascript' src='/requirejs/config.js'></script>
    <script type='text/javascript' src='/module/js/com/tridium/js/ext/require/require.min.js?'></script>
    <style>
*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
:root {
  --bg-deep:#0d1117;--bg-panel:#161b27;--bg-card:#1e2535;--bg-card-hover:#252d42;
  --accent:#00c8ff;--accent-glow:rgba(0,200,255,0.25);--accent2:#7b5ea7;
  --green:#00e676;--red:#ff4444;--amber:#ffab00;
  --text-primary:#e8ecf4;--text-muted:#7a8499;
  --border:rgba(0,200,255,0.15);--border-hover:rgba(0,200,255,0.45);
  --radius:10px;--font-head:'Courier New',Courier,monospace;--font-body:Georgia,'Times New Roman',serif;
  --transition:0.22s cubic-bezier(0.4,0,0.2,1);
  --tbl-border:#2a3550;--tbl-head-bg:#0f1825;--tbl-row-even:#141c2e;--tbl-row-odd:#1a2438;--tbl-row-hover:#1e2d45;
  --thresh-over:#e67e00;--thresh-under:#0e7a8a;
  --thresh-over-bg:rgba(230,126,0,0.18);--thresh-under-bg:rgba(14,122,138,0.22);
}
body.light-mode {
  --bg-deep:#f0f4f8;--bg-panel:#ffffff;--bg-card:#e8edf5;--bg-card-hover:#dce4f0;
  --accent:#dc143c;--accent-glow:rgba(220,20,60,0.18);--accent2:#991b1b;
  --green:#16a34a;--red:#dc2626;--amber:#d97706;
  --text-primary:#1a1e2a;--text-muted:#4b5563;
  --border:rgba(220,20,60,0.18);--border-hover:rgba(220,20,60,0.45);
  --tbl-border:#c5cedc;--tbl-head-bg:#dce4f0;--tbl-row-even:#f5f8fc;--tbl-row-odd:#eef2f8;--tbl-row-hover:#e2e9f4;
}
html{height:100%;overflow:hidden;}
body{height:100%;font-family:var(--font-body);background:var(--bg-deep);color:var(--text-primary);display:flex;flex-direction:column;overflow:hidden;opacity:0;transition:opacity 0.6s ease,background 0.3s ease,color 0.3s ease;}
body.fade-in{opacity:1;}body.fade-out{opacity:0;transition:opacity 0.3s ease;}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,0.6);backdrop-filter:blur(4px);z-index:200;opacity:0;visibility:hidden;transition:var(--transition);}
.overlay.active{opacity:1;visibility:visible;}
.side-panel{position:fixed;top:0;left:-300px;width:280px;height:100vh;background:var(--bg-panel);border-right:1px solid var(--border);z-index:300;transition:left 0.3s ease;padding:80px 0 20px;overflow-y:auto;}
.side-panel.active{left:0;}
.side-panel-header{padding:20px;border-bottom:1px solid var(--border);margin-bottom:10px;}
.side-panel-header h2{font-family:var(--font-head);font-size:14px;letter-spacing:2px;color:var(--accent);font-weight:normal;}
.side-panel-header p{font-size:12px;color:var(--text-muted);margin-top:4px;}
.nav-image-grid{padding:10px 14px;display:flex;flex-direction:column;gap:7px;}
.nav-image-btn{display:flex;align-items:center;gap:12px;padding:10px 14px;background:var(--bg-card);border:1px solid var(--border);border-radius:8px;cursor:pointer;text-decoration:none;transition:var(--transition);position:relative;overflow:hidden;color:var(--text-primary);}
.nav-image-btn::before{content:'';position:absolute;left:0;top:0;bottom:0;width:2px;background:var(--accent);opacity:0;transition:opacity 0.2s;}
.nav-image-btn:hover{border-color:var(--accent);background:var(--bg-card-hover);transform:translateX(3px);}
.nav-image-btn:hover::before{opacity:1;}
.nav-btn-icon{width:40px;height:40px;border-radius:8px;background:rgba(0,200,255,0.08);border:1px solid rgba(0,200,255,0.15);display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:18px;}
body.light-mode .nav-btn-icon{background:rgba(220,20,60,0.08);border-color:rgba(220,20,60,0.15);}
.nav-btn-text{display:flex;flex-direction:column;gap:2px;}
.nav-btn-label{font-family:var(--font-head);font-size:12px;color:var(--text-primary);letter-spacing:0.5px;}
.nav-btn-sublabel{font-family:var(--font-head);font-size:10px;color:var(--text-muted);letter-spacing:0.5px;}
.top-bar{background:rgba(13,17,23,0.97);border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;padding:0 20px;height:64px;flex-shrink:0;position:relative;z-index:100;backdrop-filter:blur(12px);transition:background 0.3s ease;}
body.light-mode .top-bar{background:rgba(255,255,255,0.97);box-shadow:0 1px 12px rgba(0,0,0,0.08);}
.top-bar::after{content:'';position:absolute;bottom:0;left:0;right:0;height:1px;background:linear-gradient(90deg,transparent,var(--accent),transparent);}
.hamburger{width:36px;height:36px;background:var(--bg-card);border:1px solid var(--border);border-radius:6px;cursor:pointer;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:5px;transition:var(--transition);flex-shrink:0;}
.hamburger:hover{border-color:var(--accent);background:var(--bg-card-hover);}
.hamburger-line{width:18px;height:2px;background:var(--text-primary);border-radius:2px;transition:var(--transition);}
.hamburger.active .hamburger-line:nth-child(1){transform:rotate(45deg) translate(5px,5px);}
.hamburger.active .hamburger-line:nth-child(2){opacity:0;}
.hamburger.active .hamburger-line:nth-child(3){transform:rotate(-45deg) translate(5px,-5px);}
.top-center{position:absolute;left:50%;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:2px;}
.site-label{font-family:var(--font-head);font-size:12px;letter-spacing:4px;color:var(--accent);text-transform:uppercase;}
.page-title{font-family:var(--font-head);font-size:18px;font-weight:normal;letter-spacing:1px;color:var(--text-primary);}
.top-right{display:flex;align-items:center;gap:12px;}
.theme-toggle-wrap{display:flex;align-items:center;gap:8px;}
.theme-label{font-family:var(--font-head);font-size:11px;letter-spacing:2px;color:var(--text-muted);text-transform:uppercase;}
.switch{position:relative;display:inline-block;width:42px;height:22px;}
.switch input{opacity:0;width:0;height:0;}
.slider{position:absolute;cursor:pointer;inset:0;background:var(--bg-card);border:1px solid var(--border);border-radius:34px;transition:0.3s;}
.slider:before{position:absolute;content:"";height:16px;width:16px;left:2px;bottom:2px;background:var(--text-muted);border-radius:50%;transition:0.3s;}
input:checked+.slider{background:var(--accent-glow);border-color:var(--accent);}
input:checked+.slider:before{transform:translateX(20px);background:var(--accent);}
.user-badge{background:var(--bg-card);border:1px solid var(--border);border-radius:20px;padding:6px 14px;font-size:13px;color:var(--text-muted);display:flex;align-items:center;gap:8px;font-family:var(--font-head);}
.user-dot{width:8px;height:8px;background:var(--green);border-radius:50%;box-shadow:0 0 6px var(--green);}
#userDisplay{color:var(--text-primary);}
.main-content{flex:1;display:flex;flex-direction:column;min-height:0;min-width:0;overflow:hidden;}

/* ── EXPORT CONTROLS ── */
#vav-export-controls{display:flex;align-items:center;gap:12px;padding:12px 20px;background:var(--bg-panel);border-bottom:1px solid var(--border);flex-wrap:wrap;flex-shrink:0;}
#vav-export-controls input[type="datetime-local"]{background:var(--bg-card);border:1px solid var(--border);border-radius:6px;color:var(--text-primary);padding:8px 12px;font-family:var(--font-head);font-size:12px;letter-spacing:0.5px;transition:var(--transition);outline:none;cursor:pointer;}
#vav-export-controls input[type="datetime-local"]:focus,#vav-export-controls input[type="datetime-local"]:hover{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-glow);}
#vav-export-controls input::-webkit-calendar-picker-indicator{filter:invert(0.6) sepia(1) hue-rotate(160deg);cursor:pointer;}
body.light-mode #vav-export-controls input::-webkit-calendar-picker-indicator{filter:invert(0.3) sepia(1) hue-rotate(320deg);}
.export-btn{background:var(--bg-card);border:1px solid var(--border);border-radius:6px;color:var(--text-muted);padding:8px 18px;font-family:var(--font-head);font-size:11px;letter-spacing:1.5px;text-transform:uppercase;cursor:pointer;display:flex;align-items:center;gap:8px;transition:var(--transition);white-space:nowrap;}
.export-btn:hover{border-color:var(--accent);color:var(--accent);background:var(--bg-card-hover);box-shadow:0 0 12px var(--accent-glow);}

/* ── TABLE SCROLL WRAPPER ── */
.table-scroll-wrap{
  flex:1;
  overflow-x:auto;
  overflow-y:auto;
  min-height:0;
  min-width:0;
  -webkit-overflow-scrolling:touch;
  padding:24px 32px;
}
.table-scroll-wrap::-webkit-scrollbar{width:8px;height:8px;}
.table-scroll-wrap::-webkit-scrollbar-track{background:var(--bg-panel);}
.table-scroll-wrap::-webkit-scrollbar-thumb{background:rgba(0,200,255,0.35);border-radius:4px;}
.table-scroll-wrap::-webkit-scrollbar-thumb:hover{background:var(--accent);}
.table-scroll-wrap::-webkit-scrollbar-corner{background:var(--bg-panel);}

#main-content{flex:1;display:flex;flex-direction:column;min-height:0;min-width:0;overflow:hidden;}

/* ── GRID TABLE ── */
.vav-table{
  width:auto;
  min-width:860px;
  max-width:100%;
  margin:0 auto;
  border-collapse:separate;
  border-spacing:0;
  font-family:var(--font-head);
  font-size:15px;
  border:2px solid var(--tbl-border);
  border-radius:12px;
  overflow:hidden;
  box-shadow:0 8px 32px rgba(0,0,0,0.4);
}
.vav-table thead{position:sticky;top:0;z-index:10;}
.vav-table thead tr{background:var(--tbl-head-bg);}
.vav-table thead th{
  padding:13px 18px;
  font-family:var(--font-head);
  font-size:12px;
  letter-spacing:2px;
  text-transform:uppercase;
  color:var(--accent);
  font-weight:normal;
  text-align:center;
  border-bottom:2px solid var(--tbl-border);
  border-right:1px solid var(--tbl-border);
  white-space:nowrap;
  background:var(--tbl-head-bg);
  position:relative;
}
.vav-table thead th:last-child{border-right:none;}
.vav-table thead th:first-child{text-align:left;}

/* sortable */
.vav-table thead th.sortable{cursor:pointer;user-select:none;padding-right:30px;transition:background 0.15s,color 0.15s;}
.vav-table thead th.sortable:hover{background:rgba(0,200,255,0.12);color:#fff;}
body.light-mode .vav-table thead th.sortable:hover{background:rgba(220,20,60,0.10);}
.vav-table thead th.sortable::after{content:'⇅';position:absolute;right:9px;top:50%;transform:translateY(-50%);font-size:12px;opacity:0.35;transition:opacity 0.15s;}
.vav-table thead th.sortable:hover::after{opacity:0.75;}
.vav-table thead th.sort-asc::after{content:'▲';opacity:1;color:var(--accent);}
.vav-table thead th.sort-desc::after{content:'▼';opacity:1;color:var(--accent);}

/* rows */
.vav-table tbody tr:nth-child(even){background:var(--tbl-row-even);}
.vav-table tbody tr:nth-child(odd){background:var(--tbl-row-odd);}
.vav-table tbody tr:hover{background:var(--tbl-row-hover)!important;}
.vav-table td{
  padding:11px 18px;
  text-align:center;
  border-bottom:1px solid var(--tbl-border);
  border-right:1px solid var(--tbl-border);
  color:var(--text-primary);
  font-size:15px;
  vertical-align:middle;
  white-space:nowrap;
  transition:background-color 0.3s ease, box-shadow 0.3s ease;
}
.vav-table td:last-child{border-right:none;}
.vav-table tbody tr:last-child td{border-bottom:none;}
.vav-table td:first-child{text-align:left;}

/* ── THRESHOLD COLORS ── */
.temp-over-threshold{background-color:var(--thresh-over-bg)!important;color:var(--thresh-over)!important;font-weight:bold;}
.temp-under-threshold{background-color:var(--thresh-under-bg)!important;color:#4dd8e8!important;font-weight:bold;}

/* ── CELL ALARM STATE HIGHLIGHTS ── */
.cell-alarm{
  background-color:rgba(255,68,68,0.18)!important;
  color:#ff6b6b!important;
  font-weight:bold;
  box-shadow:inset 0 0 0 2px rgba(255,68,68,0.7);
  animation:cellAlarmPulse 1.8s ease-in-out infinite;
  position:relative;
}
.cell-alarm::after{
  content:'⚠';
  position:absolute;
  top:3px;right:5px;
  font-size:9px;
  color:#ff4444;
  opacity:0.85;
  line-height:1;
}
@keyframes cellAlarmPulse{
  0%,100%{box-shadow:inset 0 0 0 2px rgba(255,68,68,0.7),0 0 0 0 rgba(255,68,68,0);}
  50%{box-shadow:inset 0 0 0 2px rgba(255,68,68,1),0 0 8px 2px rgba(255,68,68,0.3);}
}

.cell-override{
  background-color:rgba(147,51,234,0.18)!important;
  color:#c084fc!important;
  font-weight:bold;
  box-shadow:inset 0 0 0 2px rgba(147,51,234,0.6);
  position:relative;
}
.cell-override::after{
  content:'↑';
  position:absolute;
  top:3px;right:5px;
  font-size:9px;
  color:#a855f7;
  opacity:0.85;
  font-weight:bold;
  line-height:1;
}

.cell-fault{
  background-color:rgba(255,171,0,0.18)!important;
  color:#ffcf40!important;
  font-weight:bold;
  box-shadow:inset 0 0 0 2px rgba(255,171,0,0.65);
  animation:cellFaultPulse 2.4s ease-in-out infinite;
  position:relative;
}
.cell-fault::after{
  content:'⛔';
  position:absolute;
  top:3px;right:5px;
  font-size:9px;
  opacity:0.85;
  line-height:1;
}
@keyframes cellFaultPulse{
  0%,100%{box-shadow:inset 0 0 0 2px rgba(255,171,0,0.65),0 0 0 0 rgba(255,171,0,0);}
  50%{box-shadow:inset 0 0 0 2px rgba(255,171,0,1),0 0 8px 2px rgba(255,171,0,0.28);}
}

body.light-mode .cell-alarm{
  background-color:rgba(220,38,38,0.12)!important;
  color:#b91c1c!important;
  box-shadow:inset 0 0 0 2px rgba(220,38,38,0.5);
}
body.light-mode .cell-override{
  background-color:rgba(126,34,206,0.10)!important;
  color:#7e22ce!important;
  box-shadow:inset 0 0 0 2px rgba(126,34,206,0.4);
}
body.light-mode .cell-fault{
  background-color:rgba(217,119,6,0.12)!important;
  color:#92400e!important;
  box-shadow:inset 0 0 0 2px rgba(217,119,6,0.5);
}

/* ── STATUS LEGEND ── */
.status-legend{
  display:flex;
  align-items:center;
  gap:20px;
  padding:9px 20px;
  background:var(--bg-panel);
  border-bottom:1px solid var(--border);
  flex-shrink:0;
  flex-wrap:wrap;
}
.legend-item{
  display:flex;
  align-items:center;
  gap:7px;
  font-family:var(--font-head);
  font-size:12px;
  font-weight:bold;
  letter-spacing:1px;
  color:#ffffff;
  text-transform:uppercase;
}
.legend-swatch{
  width:16px;height:16px;border-radius:3px;flex-shrink:0;
}
.legend-swatch.alarm{background:rgba(255,68,68,0.25);box-shadow:inset 0 0 0 1.5px rgba(255,68,68,0.8);}
.legend-swatch.override{background:rgba(147,51,234,0.25);box-shadow:inset 0 0 0 1.5px rgba(147,51,234,0.8);}
.legend-swatch.fault{background:rgba(255,171,0,0.25);box-shadow:inset 0 0 0 1.5px rgba(255,171,0,0.8);}
.legend-swatch.thresh-over{background:var(--thresh-over-bg);box-shadow:inset 0 0 0 1.5px var(--thresh-over);}
.legend-swatch.thresh-under{background:var(--thresh-under-bg);box-shadow:inset 0 0 0 1.5px #4dd8e8;}

/* ── NAME LINK ── */
.vav-name{font-family:var(--font-head);font-size:15px;font-weight:bold;letter-spacing:0.5px;}
.vav-name a{color:var(--accent);text-decoration:none;transition:var(--transition);font-weight:bold;}
.vav-name a:hover{color:#fff;text-shadow:0 0 10px var(--accent);}
.vav-name a:visited{color:var(--accent);}
body.light-mode .vav-name a,body.light-mode .vav-name a:visited{color:var(--accent);}
body.light-mode .vav-name a:hover{color:#1a1e2a;text-shadow:none;}

/* ── VALUE STATES ── */
.value-loading{color:var(--text-muted);font-style:italic;font-size:13px;letter-spacing:1px;}
.value-loading::after{content:'';animation:dots 1.4s infinite;}
@keyframes dots{0%{content:'';}33%{content:'.';}66%{content:'..';}100%{content:'...'}}
.value-error{color:var(--red);font-size:14px;font-weight:bold;}
.value-missing{color:var(--text-muted);font-size:13px;}
.value-normal{color:var(--text-primary);font-family:var(--font-head);font-size:15px;}
.value-active{color:var(--green);font-family:var(--font-head);font-weight:bold;font-size:15px;}
.value-inactive{color:#8a9ab5;font-family:var(--font-head);font-weight:bold;font-size:15px;}

/* ── BOTTOM BAR ── */
.bottom-bar{background:rgba(13,17,23,0.97);border-top:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;padding:0 20px;height:50px;flex-shrink:0;position:relative;}
body.light-mode .bottom-bar{background:rgba(255,255,255,0.97);box-shadow:0 -1px 12px rgba(0,0,0,0.06);}
.bottom-bar::before{content:'';position:absolute;top:0;left:0;right:0;height:1px;background:linear-gradient(90deg,transparent,var(--accent),transparent);}
.back-btn{background:none;border:1px solid var(--border);border-radius:6px;color:var(--text-muted);padding:6px 16px;cursor:pointer;font-size:13px;font-family:var(--font-head);letter-spacing:1px;display:flex;align-items:center;gap:8px;transition:var(--transition);}
.back-btn:hover{border-color:var(--accent);color:var(--accent);}
.datetime-display{font-family:var(--font-head);font-size:13px;color:var(--text-muted);letter-spacing:1px;}
.logoff-btn{background:none;border:1px solid var(--border);border-radius:6px;color:var(--text-muted);padding:6px 16px;cursor:pointer;font-size:13px;font-family:var(--font-head);letter-spacing:1px;display:flex;align-items:center;gap:8px;transition:var(--transition);}
.logoff-btn:hover{border-color:var(--red);color:var(--red);}
.loading-msg{text-align:center;padding:60px 20px;color:var(--text-muted);font-family:var(--font-head);font-size:13px;letter-spacing:2px;}
.error-msg{text-align:center;padding:60px 20px;color:var(--red);font-family:var(--font-head);font-size:13px;letter-spacing:1px;}

/* ── SETPOINTS MODAL ── */
.setpoints-modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.7);backdrop-filter:blur(8px);z-index:500;display:flex;align-items:center;justify-content:center;}
.setpoints-modal-content{background:var(--bg-panel);border:1px solid var(--border);border-radius:14px;width:90%;max-width:680px;max-height:80vh;display:flex;flex-direction:column;box-shadow:0 24px 80px rgba(0,0,0,0.6);overflow:hidden;}
.setpoints-modal-header{padding:18px 24px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;background:rgba(0,200,255,0.04);}
.setpoints-modal-header h2{font-family:var(--font-head);font-size:15px;font-weight:normal;letter-spacing:2px;color:var(--accent);}
.modal-close-x{width:32px;height:32px;border:1px solid var(--border);border-radius:6px;background:var(--bg-card);color:var(--text-muted);cursor:pointer;font-size:18px;display:flex;align-items:center;justify-content:center;transition:var(--transition);}
.modal-close-x:hover{border-color:var(--red);color:var(--red);}
.setpoints-modal-body{overflow-y:auto;flex:1;padding:8px 0;}
.setpoints-table{width:100%;border-collapse:collapse;font-family:var(--font-head);font-size:14px;}
.setpoints-table thead th{padding:12px 20px;font-size:11px;letter-spacing:3px;text-transform:uppercase;color:var(--accent);font-weight:normal;text-align:center;background:rgba(0,200,255,0.04);border-bottom:1px solid var(--border);}
.setpoints-table tbody tr{border-bottom:1px solid rgba(255,255,255,0.04);}
.setpoints-table tbody tr:hover{background:rgba(0,200,255,0.05);}
.setpoints-table td{padding:11px 20px;text-align:center;color:var(--text-muted);}
.setpoint-loading{color:var(--text-muted);font-style:italic;font-size:12px;}
.setpoint-value{color:var(--text-primary);}
    </style>
</head>
<body>

<div class="overlay" id="overlay"></div>

<div class="side-panel" id="sidePanel">
  <div class="side-panel-header"><h2>NAV Sheet</h2><p>System Selection</p></div>
  <div class="nav-image-grid">

<script>
// ── SORT ENGINE ──
const COL_NAME=0,COL_OCCUPANCY=1,COL_MODE=2,COL_SPACE_TEMP=3,COL_SPACE_SP=4,COL_AIR_FLOW=5,COL_AIR_SP=6,COL_DPR=7,COL_REHEAT=8,COL_DAT=9;
let currentSortCol=null,currentSortDir=null;
const SORTABLE_COLS={[COL_NAME]:'th-name',[COL_SPACE_TEMP]:'th-space-temp',[COL_DPR]:'th-dpr-pos',[COL_DAT]:'th-da-temp'};

function getNumericFromCell(td){const n=parseFloat(td.textContent.trim());return isNaN(n)?null:n;}

function sortTable(colIndex){
  const table=document.querySelector('.vav-table');
  if(!table)return;
  const tbody=table.querySelector('tbody');
  const rows=Array.from(tbody.querySelectorAll('tr'));
  if(currentSortCol===colIndex){currentSortDir=currentSortDir==='desc'?'asc':'desc';}
  else{currentSortCol=colIndex;currentSortDir='desc';}
  rows.sort((a,b)=>{
    const ca=a.querySelectorAll('td')[colIndex],cb=b.querySelectorAll('td')[colIndex];
    if(!ca||!cb)return 0;
    if(colIndex===COL_NAME){const ta=ca.textContent.trim().toLowerCase(),tb=cb.textContent.trim().toLowerCase();return currentSortDir==='desc'?-ta.localeCompare(tb):ta.localeCompare(tb);}
    const na=getNumericFromCell(ca),nb=getNumericFromCell(cb);
    if(na===null&&nb===null)return 0;if(na===null)return 1;if(nb===null)return -1;
    return currentSortDir==='desc'?nb-na:na-nb;
  });
  rows.forEach(r=>tbody.appendChild(r));
  document.querySelectorAll('.vav-table thead th.sortable').forEach(th=>th.classList.remove('sort-asc','sort-desc'));
  const id=SORTABLE_COLS[colIndex];
  if(id){const th=document.getElementById(id);if(th)th.classList.add(currentSortDir==='desc'?'sort-desc':'sort-asc');}
}
</script>

<script>
// ── VAV CORE ──
let pointSubscriptions=[],pointValues={},stringWritableValues={},allVAVPoints={},subscriber;

// ── RESOLVED POINT STORE (for status re-checks) ──
const resolvedPoints={};

function extractTrailingNumber(name){const d=decodeVAVName(name),m=d.match(/(\d+)\s*$/);return m?parseInt(m[1],10):Number.MAX_SAFE_INTEGER;}
function normalizeFloorNumber(f){return f?f.toString().replace(/_(E|W)$/i,''):null;}

// async function isAuthorizedUser(){
//   const u=sessionStorage.getItem('username');
//   if(!u)return{authorized:true,isAdmin:false};
//   try{const r=await fetch('../../HomeConfig.json');if(!r.ok)throw new Error();const c=await r.json();const usr=c.Users.find(x=>x.name.toLowerCase()===u.toLowerCase());if(!usr)return{authorized:true,isAdmin:false};return{authorized:true,isAdmin:usr.role.toLowerCase()==='admin'};}
//   catch(e){return{authorized:true,isAdmin:false};}
// }

function getCurrentVAVFolder(){const p=window.location.pathname,m=p.match(/\/VAVs\/VAV_(\d+)\//);return m?m[1]:null;}
function extractVAVNumber(v){let d=v.replace(/\$([0-9a-fA-F]{2})/g,(m,h)=>String.fromCharCode(parseInt(h,16)));const m=d.match(/(\d+)/);return m?parseInt(m[1],10).toString():null;}

function hasValidValues(pointId){for(const v in pointValues){const val=pointValues[v][pointId];if(val!==undefined&&val!==null&&!(typeof val==='string'&&val.startsWith('NO_')))return true;}return false;}

function updateColumnVisibility(){
  const cols=['Occupancy','Mode','Space-Temp','Space-Setpoint','Air-Flow','AirFlow-SP','DPR-Pos','Reheat1','DA-T'];
  cols.forEach((p,i)=>{
    const ci=i+1,hv=hasValidValues(p);
    const hc=document.querySelector(`th:nth-child(${ci+1})`);
    const dc=document.querySelectorAll(`td:nth-child(${ci+1})`);
    if(hc)hc.style.display=hv?'':'none';
    dc.forEach(c=>{c.style.display=hv?'':'none';});
  });
}

function formatPointValue(value,pointId){
  if(value===null||value===undefined||value==='N/A'||value==='Connection Error')return value==='Connection Error'?'Connection Error':'N/A';
  if(typeof value==='string'&&value.startsWith('NO_'))return value;
  if(pointId==='Reheat1')return value?'Heat ON':'Heat OFF';
  if(pointId==='Occupancy')return value?'Occupied':'Unoccupied';
  if(pointId==='Mode')return value.toString();
  if(pointId==='Air-Flow'||pointId==='AirFlow-SP')return Math.round(value)+' cfm';
  if(pointId==='DPR-Pos')return Math.round(value)+'%';
  if(typeof value==='number')return value.toFixed(1)+'°F';
  return value.toString();
}

function getValueClass(value,pointId){
  if(value===null||value===undefined||value==='N/A'||value==='Connection Error')return'value-error';
  if(typeof value==='string'&&value.startsWith('NO_'))return'value-missing';
  if(pointId==='Reheat1')return value?'value-active':'value-inactive';
  if(pointId==='Occupancy')return value?'value-active':'value-inactive';
  return'value-normal';
}

function applyTempThresholdColor(vavName){
  const st=pointValues[vavName]&&pointValues[vavName]['Space-Temp'];
  const sp=pointValues[vavName]&&pointValues[vavName]['Space-Setpoint'];
  const cell=document.getElementById(`point-${vavName}-Space-Temp`);
  if(!cell)return;
  if(!cell.classList.contains('cell-alarm')&&!cell.classList.contains('cell-override')){
    cell.classList.remove('temp-over-threshold','temp-under-threshold');
    if(typeof st!=='number'||typeof sp!=='number')return;
    if(st>sp+3)cell.classList.add('temp-over-threshold');
    else if(st<sp-3)cell.classList.add('temp-under-threshold');
  }
}

function applyPointStatusHighlight(vavName,pointId,point){
  const cell=document.getElementById(`point-${vavName}-${pointId}`);
  if(!cell)return;
  let raw='';
  try{const status=point.getOut().getStatus();raw=status?status.toString().toLowerCase():'';}catch(e){raw='';}
  cell.classList.remove('cell-alarm','cell-override','cell-fault');
  cell.removeAttribute('title');
  if(raw.includes('alarm')||raw.includes('offnormal')||raw.includes('unackedalarm')||raw.includes('unacked')){
    cell.classList.add('cell-alarm');cell.title='STATUS: '+raw.toUpperCase();
    cell.classList.remove('temp-over-threshold','temp-under-threshold');return;
  }
  if((raw.includes('fault')&&raw.includes('down'))||raw.includes('stale')||(raw.includes('fault')&&!raw.includes('override'))){
    cell.classList.add('cell-fault');cell.title='STATUS: '+raw.toUpperCase();
    cell.classList.remove('temp-over-threshold','temp-under-threshold');return;
  }
  if(raw.includes('overridden')){
    cell.classList.add('cell-override');cell.title='STATUS: OVERRIDDEN';
    cell.classList.remove('temp-over-threshold','temp-under-threshold');return;
  }
  if(pointId==='Space-Temp')applyTempThresholdColor(vavName);
}

let isInitialLoad=true,loadedPointCount=0,totalPointCount=0;

function updatePointValue(vavName,pointId,value){
  const el=document.getElementById(`point-${vavName}-${pointId}`);
  if(el){
    el.textContent=formatPointValue(value,pointId);
    el.className=getValueClass(value,pointId);
    if(resolvedPoints[vavName]&&resolvedPoints[vavName][pointId]){
      applyPointStatusHighlight(vavName,pointId,resolvedPoints[vavName][pointId]);
    }
    if(!pointValues[vavName])pointValues[vavName]={};
    pointValues[vavName][pointId]=value;
    if(pointId==='Space-Temp'||pointId==='Space-Setpoint')applyTempThresholdColor(vavName);
    if(isInitialLoad){loadedPointCount++;if(loadedPointCount>=totalPointCount){isInitialLoad=false;updateColumnVisibility();}}
    else updateColumnVisibility();
  }
}

function updateStringWritableDisplay(vavName,stringValue){
  stringWritableValues[vavName]=stringValue;
  const nc=document.getElementById(`vav-name-${vavName}`);
  if(nc){const a=nc.querySelector('a');if(a){const dn=decodeVAVName(vavName);a.textContent=stringValue?`${dn} (${stringValue})`:dn;}}
}

function subscribeToStringWritable(vavName,stringPointPath){
  try{require(['baja!'],function(baja){baja.Ord.make(stringPointPath).get().then(point=>{updateStringWritableDisplay(vavName,point.getOut().getValueDisplay());setInterval(()=>updateStringWritableDisplay(vavName,point.getOut().getValueDisplay()),1000);}).catch(e=>console.error(`StringWritable error for ${vavName}:`,e));});}
  catch(e){console.error(`Failed to subscribe to StringWritable for ${vavName}:`,e);}
}

try{require(['baja!'],function(baja){
  subscriber=new baja.Subscriber();
  subscriber.attach('changed',function(prop){
    if(prop.getName()==='out'){
      const pi=this.userData;
      if(pi){
        const out=this.getOut();
        const dv=pi.pointId==='Mode'?out.getValueDisplay():out.getValue();
        updatePointValue(pi.vavName,pi.pointId,dv);
        applyPointStatusHighlight(pi.vavName,pi.pointId,this);
      }
    }
  });
});}
catch(e){console.error('Failed to initialize subscriber:',e);}

function subscribeToPoint(vavName,pointId,pointPath){
  try{require(['baja!'],function(baja){try{
    const ord=baja.Ord.make(pointPath);
    const p=ord.get({subscriber:subscriber});
    p.catch(()=>updatePointValue(vavName,pointId,'N/A'));
    p.then(point=>{
      point.userData={vavName,pointId,pointPath};
      if(!resolvedPoints[vavName])resolvedPoints[vavName]={};
      resolvedPoints[vavName][pointId]=point;
      const out=point.getOut();
      updatePointValue(vavName,pointId,pointId==='Mode'?out.getValueDisplay():out.getValue());
      applyPointStatusHighlight(vavName,pointId,point);
    });
  }catch(ie){updatePointValue(vavName,pointId,'N/A');}});}
  catch(e){updatePointValue(vavName,pointId,'Connection Error');}
}

function decodeVAVName(n){return n.replace(/\$([0-9a-fA-F]{2})/g,(m,h)=>String.fromCharCode(parseInt(h,16)));}

function createVAVDisplay(vavData,isAdmin){
  const mc=document.getElementById('main-content');
  if(Object.keys(vavData).length===0){mc.innerHTML='<div class="error-msg">No VAV configurations found.</div>';return;}

  const legendHTML=`<div class="status-legend">
    <span style="font-family:var(--font-head);font-size:11px;font-weight:bold;letter-spacing:2px;color:#ffffff;text-transform:uppercase;margin-right:4px;">Legend:</span>
    <span class="legend-item"><span class="legend-swatch alarm"></span><span>⚠ In Alarm</span></span>
    <span class="legend-item"><span class="legend-swatch fault"></span><span>⛔ Fault / Down</span></span>
    <span class="legend-item"><span class="legend-swatch override"></span><span>↑ Overridden</span></span>
    <span class="legend-item"><span class="legend-swatch thresh-over"></span><span>Too Hot (+3°F)</span></span>
    <span class="legend-item"><span class="legend-swatch thresh-under"></span><span>Too Cold (−3°F)</span></span>
  </div>`;

  let html=`${legendHTML}<div class="table-scroll-wrap"><table class="vav-table">
    <thead><tr>
      <th id="th-name" class="sortable" onclick="sortTable(${COL_NAME})">Name</th>
      <th>Occupancy</th>
      <th>Mode</th>
      <th id="th-space-temp" class="sortable" onclick="sortTable(${COL_SPACE_TEMP})">Space Temp</th>
      <th>Space Setpoint</th>
      <th>Air Flow</th>
      <th>Air Flow SP</th>
      <th id="th-dpr-pos" class="sortable" onclick="sortTable(${COL_DPR})">Damp Pos</th>
      <th>Heat Cmd</th>
      <th id="th-da-temp" class="sortable" onclick="sortTable(${COL_DAT})">DAT</th>
    </tr></thead><tbody>`;

  const sorted=Object.keys(vavData).sort((a,b)=>extractTrailingNumber(a)-extractTrailingNumber(b));
  totalPointCount=sorted.length*9;loadedPointCount=0;isInitialLoad=true;

  sorted.forEach(vavName=>{
    const dn=decodeVAVName(vavName),vl=`${vavName}.html`;
    html+=`<tr>
      <td class="vav-name" id="vav-name-${vavName}"><a href="${vl}">${dn}</a></td>
      <td id="point-${vavName}-Occupancy" class="value-loading">Loading</td>
      <td id="point-${vavName}-Mode" class="value-loading">Loading</td>
      <td id="point-${vavName}-Space-Temp" class="value-loading">Loading</td>
      <td id="point-${vavName}-Space-Setpoint" class="value-loading">Loading</td>
      <td id="point-${vavName}-Air-Flow" class="value-loading">Loading</td>
      <td id="point-${vavName}-AirFlow-SP" class="value-loading">Loading</td>
      <td id="point-${vavName}-DPR-Pos" class="value-loading">Loading</td>
      <td id="point-${vavName}-Reheat1" class="value-loading">Loading</td>
      <td id="point-${vavName}-DA-T" class="value-loading">Loading</td>
    </tr>`;
  });
  html+=`</tbody></table></div>`;
  mc.innerHTML=html;

  sorted.forEach(vavName=>{
    const points=vavData[vavName];
    const sw=points.find(p=>p.name==='StringWritable');
    if(sw&&sw.fullPath)subscribeToStringWritable(vavName,sw.fullPath);
    const pm={'Occupancy':points.find(p=>p.id==='Occupancy'),'Mode':points.find(p=>p.id==='Mode'),'Space-Temp':points.find(p=>p.id==='Space-Temp'),'Space-Setpoint':points.find(p=>p.id==='Space-Setpoint'),'Air-Flow':points.find(p=>p.id==='Air-Flow'),'AirFlow-SP':points.find(p=>p.id==='AirFlow-SP'),'DPR-Pos':points.find(p=>p.id==='DPR-Pos'),'Reheat1':points.find(p=>p.id==='Reheat1'),'DA-T':points.find(p=>p.id==='DA-T')};
    Object.keys(pm).forEach(pid=>{
      const pt=pm[pid];
      if(pt&&pt.status==='connected'&&pt.fullPath){subscribeToPoint(vavName,pid,pt.fullPath);}
      else{const mn={Occupancy:'NO_Occupancy',Mode:'NO_Mode','Space-Temp':'NO_Space Temp','Space-Setpoint':'NO_Space Setpoint','Air-Flow':'NO_Air Flow','AirFlow-SP':'NO_Air Flow Setpoint','DPR-Pos':'NO_Damper Pos','Reheat1':'NO_Heat Command','DA-T':'NO_DA Temp'};updatePointValue(vavName,pid,mn[pid]||'N/A');}
    });
  });
  updateColumnVisibility();
}

let setpointSubscriptions={},setpointValues={};

function showSetpointsModal(){
  document.body.insertAdjacentHTML('beforeend',`<div id="setpoints-modal" class="setpoints-modal-overlay"><div class="setpoints-modal-content"><div class="setpoints-modal-header"><h2>VAV SETPOINTS OVERVIEW</h2><button class="modal-close-x" onclick="closeSetpointsModal()">✕</button></div><div class="setpoints-modal-body"><table class="setpoints-table"><thead><tr><th>VAV Name</th><th>Cooling Setpoint (°F)</th><th>Heating Setpoint (°F)</th></tr></thead><tbody id="setpoints-table-body"><tr><td colspan="3" style="text-align:center;color:var(--text-muted);padding:30px;font-family:var(--font-head);font-size:12px;letter-spacing:2px;">Loading setpoints...</td></tr></tbody></table></div></div></div>`);
  loadSetpointData();
  const esc=e=>{if(e.key==='Escape'){closeSetpointsModal();document.removeEventListener('keydown',esc);}};
  document.addEventListener('keydown',esc);
  document.getElementById('setpoints-modal').addEventListener('click',e=>{if(e.target.id==='setpoints-modal')closeSetpointsModal();});
}

function closeSetpointsModal(){
  const m=document.getElementById('setpoints-modal');
  if(m){Object.values(setpointSubscriptions).forEach(p=>{if(p&&p.unsubscribe)p.unsubscribe();});setpointSubscriptions={};setpointValues={};m.remove();}
}

function loadSetpointData(){
  const tb=document.getElementById('setpoints-table-body');if(!tb)return;
  const names=Object.keys(allVAVPoints).sort((a,b)=>extractTrailingNumber(a)-extractTrailingNumber(b));
  if(!names.length){tb.innerHTML='<tr><td colspan="3" style="text-align:center;">No VAV data available</td></tr>';return;}
  tb.innerHTML=names.map(v=>`<tr><td class="vav-name" style="text-align:left;">${decodeVAVName(v)}</td><td id="setpoint-cool-${v}" class="setpoint-loading">Loading...</td><td id="setpoint-heat-${v}" class="setpoint-loading">Loading...</td></tr>`).join('');
  names.forEach(v=>{
    const pts=allVAVPoints[v];
    const c=pts.find(p=>p.id==='OccCoolSP'||p.name==='OccCoolSP');
    const h=pts.find(p=>p.id==='OccHeatSP'||p.name==='OccHeatSP');
    if(c&&c.fullPath)subscribeToSetpoint(v,'cool',c.fullPath);else updateSetpointDisplay(v,'cool','N/A');
    if(h&&h.fullPath)subscribeToSetpoint(v,'heat',h.fullPath);else updateSetpointDisplay(v,'heat','N/A');
  });
}

function subscribeToSetpoint(vavName,type,pointPath){

<script>
// ── HISTORY EXPORT ──
let vavExportHistoryCache=new Map();
function decodeAsciiName(n){if(!n)return'';return n.replace(/\$([0-9a-fA-F]{2})/g,(m,h)=>String.fromCharCode(parseInt(h,16)));}

async function discoverVAVHistoryOrd(pointOrd){return new Promise((res,rej)=>{try{require(['baja!'],function(baja){baja.Ord.make(pointOrd).get().then(e=>e.tags()).then(tm=>{const ht=tm.get('n:history');if(ht&&ht.toString().trim()!==''){let hp=ht.toString();if(!hp.startsWith('history:'))hp='history:'+hp;res(hp);}else rej(new Error('No n:history tag'));}).catch(e=>rej(new Error('Failed to load point tags: '+e.message)));});}catch(e){rej(e);}});}

async function loadVAVHistoryData(pointPath,startTime,endTime,maxPoints=1000){return new Promise(async(res,rej)=>{try{let ho=vavExportHistoryCache.get(pointPath);if(!ho){try{ho=await discoverVAVHistoryOrd(pointPath);vavExportHistoryCache.set(pointPath,ho);}catch(e){res([]);return;}}require(['baja!'],function(baja){const tc=`timestamp >= '${startTime.toISOString()}' and timestamp <= '${endTime.toISOString()}'`;const dp=[];baja.Ord.make(ho+'|bql:select timestamp, value where '+tc+' order by timestamp').get({cursor:{limit:maxPoints,each:function(){const r=this.get(),rt=r.get("timestamp"),v=r.get("value"),d=new Date(rt.getMillis());dp.push({timestamp:d,timestampString:d.toLocaleString(),value:v});}}}).then(()=>res(dp)).catch(e=>rej(new Error('Failed to load history data: '+e.message)));});}catch(e){rej(e);}});}

function getAllVAVPointPaths(){const paths=[];Object.keys(allVAVPoints).forEach(vavName=>{const pts=allVAVPoints[vavName];const pm={'Space-Temp':pts.find(p=>p.id==='Space-Temp'),'Space-Setpoint':pts.find(p=>p.name==='Space-Setpoint'),'Air-Flow':pts.find(p=>p.id==='Air-Flow'),'Reheat1':pts.find(p=>p.id==='Reheat1'),'DA-T':pts.find(p=>p.id==='DA-T'),'DPR-Pos':pts.find(p=>p.id==='DPR-Pos')};Object.keys(pm).forEach(pid=>{const pt=pm[pid];if(pt&&pt.status==='connected')paths.push({name:`${decodeAsciiName(vavName)}_${pid}`,vavName:decodeAsciiName(vavName),pointId:pid,path:pt.fullPath});});});return paths;}

async function exportVAVHistoryToCSV(){
  const mc=document.getElementById('main-content'),oc=mc.innerHTML;mc.innerHTML='<div class="loading-msg">Loading historical data for CSV export</div>';
  try{
    const sd=new Date(document.getElementById('vav-start-datetime').value),ed=new Date(document.getElementById('vav-end-datetime').value);
    const ap=getAllVAVPointPaths();if(!ap.length){mc.innerHTML=oc;alert('No data points available');return;}
    const ahd=await Promise.all(ap.map(p=>loadVAVHistoryData(p.path,sd,ed,1000).then(d=>({pointName:p.name,data:d}))));
    const tm=new Map();ahd.forEach(ph=>ph.data.forEach(r=>{const ts=r.timestampString;if(!tm.has(ts))tm.set(ts,{timestamp:ts});tm.get(ts)[ph.pointName]=r.value;}));
    const sortedData=Array.from(tm.values()).sort((a,b)=>new Date(a.timestamp)-new Date(b.timestamp));
    if(!sortedData.length){mc.innerHTML=oc;alert('No historical data found for the selected time range');return;}
    let csv=['Timestamp',...ap.map(p=>decodeAsciiName(p.name))].join(',')+'\n';
    sortedData.forEach(row=>{const st=`"${row.timestamp.replace(/"/g,'""')}"`;csv+=[st,...ap.map(p=>{const v=row[p.name];if(v===undefined||v===null)return'';const s=String(v);return(s.includes(',')||s.includes('"'))?`"${s.replace(/"/g,'""')}"`:s;})].join(',')+'\n';});
    const blob=new Blob([csv],{type:'text/csv;charset=utf-8;'}),link=document.createElement('a'),url=URL.createObjectURL(blob);
    link.setAttribute('href',url);link.setAttribute('download',`VAV_History_${sd.toISOString().slice(0,10)}_to_${ed.toISOString().slice(0,10)}.csv`);link.style.visibility='hidden';document.body.appendChild(link);link.click();document.body.removeChild(link);URL.revokeObjectURL(url);
    mc.innerHTML=oc;alert(`CSV exported successfully: ${sortedData.length} readings`);
  }catch(e){console.error('Error exporting CSV:',e);mc.innerHTML=oc;alert('Failed to export CSV: '+e.message);}
}

// ── SVG CHART BUILDER (ported from FTU monitoring) ──
function buildVAVSVGChart(data, label, unit, width, height) {
  width = width || 860;
  height = height || 200;
  const pad = { top:32, right:24, bottom:44, left:68 };
  const gW = width  - pad.left - pad.right;
  const gH = height - pad.top  - pad.bottom;

  const rawVals = data.map(d =>
    typeof d.value === 'boolean' ? (d.value ? 1 : 0) : parseFloat(d.value)
  ).filter(v => !isNaN(v));

  if (!rawVals.length) {
    return `<svg width="${width}" height="60" xmlns="http://www.w3.org/2000/svg">
      <text x="${width/2}" y="36" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" fill="#999">No numeric data available</text>
    </svg>`;
  }

  const minV  = Math.min(...rawVals);
  const maxV  = Math.max(...rawVals);
  const rangeV = maxV - minV || 1;
  const times  = data.map(d => d.timestamp.getTime());
  const minT   = Math.min(...times);
  const maxT   = Math.max(...times);
  const rangeT = maxT - minT || 1;

  const xOf = t => pad.left + ((t - minT) / rangeT) * gW;
  const yOf = v => pad.top  + gH - ((v - minV) / rangeV) * gH;

  // Polyline points
  const pts = data.map((d, i) => {
    const v = typeof d.value === 'boolean' ? (d.value ? 1 : 0) : parseFloat(d.value);
    if (isNaN(v)) return null;
    return `${xOf(times[i]).toFixed(1)},${yOf(v).toFixed(1)}`;
  }).filter(Boolean).join(' ');

  // Y-axis ticks (5)
  let yTicks = '';
  for (let i = 0; i <= 4; i++) {
    const v = minV + (rangeV / 4) * i;
    const y = yOf(v);
    yTicks += `<line x1="${pad.left}" y1="${y.toFixed(1)}" x2="${pad.left + gW}" y2="${y.toFixed(1)}" stroke="#dde3ee" stroke-width="0.8"/>
      <text x="${(pad.left - 6).toFixed(1)}" y="${(y + 4).toFixed(1)}" text-anchor="end" font-family="Arial,sans-serif" font-size="9" fill="#556">${v.toFixed(1)}</text>`;
  }

  // X-axis ticks (5)
  let xTicks = '';
  for (let i = 0; i <= 4; i++) {
    const t   = minT + (rangeT / 4) * i;
    const x   = xOf(t);
    const lbl = new Date(t).toLocaleString([], { month: 'numeric', day: 'numeric', hour: '2-digit', minute: '2-digit' });
    xTicks += `<text x="${x.toFixed(1)}" y="${(pad.top + gH + 30).toFixed(1)}" text-anchor="middle" font-family="Arial,sans-serif" font-size="8" fill="#556">${lbl}</text>`;
  }

  const avg = (rawVals.reduce((a, b) => a + b, 0) / rawVals.length).toFixed(2);
  const u   = unit ? ` ${unit}` : '';
  const avgY = yOf(parseFloat(avg));

  return `<svg width="${width}" height="${height}" xmlns="http://www.w3.org/2000/svg" style="overflow:visible;display:block;">
    <!-- Plot background -->
    <rect x="${pad.left}" y="${pad.top}" width="${gW}" height="${gH}" fill="#f7f9ff" stroke="#c8d4ee" stroke-width="0.8" rx="2"/>
    <!-- Title -->
    <text x="${width / 2}" y="20" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" font-weight="bold" fill="#003580">${label}</text>
    <!-- Unit label -->
    <text x="${pad.left - 8}" y="${pad.top - 6}" text-anchor="middle" font-family="Arial,sans-serif" font-size="9" fill="#888">${u}</text>
    <!-- Grid + Y labels -->
    ${yTicks}
    <!-- X labels -->
    ${xTicks}
    <!-- Avg line -->
    <line x1="${pad.left}" y1="${avgY.toFixed(1)}" x2="${pad.left + gW}" y2="${avgY.toFixed(1)}" stroke="#ffab00" stroke-width="1.2" stroke-dasharray="5,3"/>
    <text x="${(pad.left + gW + 4).toFixed(1)}" y="${(avgY + 4).toFixed(1)}" font-family="Arial,sans-serif" font-size="8" fill="#c07000">avg</text>
    <!-- Data line -->
    <polyline points="${pts}" fill="none" stroke="#003580" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round"/>
    <!-- Axes -->
    <line x1="${pad.left}" y1="${pad.top}" x2="${pad.left}" y2="${pad.top + gH}" stroke="#8899cc" stroke-width="1.2"/>
    <line x1="${pad.left}" y1="${pad.top + gH}" x2="${pad.left + gW}" y2="${pad.top + gH}" stroke="#8899cc" stroke-width="1.2"/>
    <!-- Stats -->
    <text x="${pad.left + gW}" y="${pad.top - 6}" text-anchor="end" font-family="Arial,sans-serif" font-size="9" fill="#556">
      Min: ${rawVals.length ? Math.min(...rawVals).toFixed(2) : '—'}${u}  Avg: ${avg}${u}  Max: ${rawVals.length ? Math.max(...rawVals).toFixed(2) : '—'}${u}  n=${rawVals.length}
    </text>
  </svg>`;
}

// ── TIMESTAMP TABLE BUILDER ──
function buildVAVTimestampTable(data, unit) {
  if (!data.length) return `<p style="color:#999;font-size:8pt;font-family:Arial,sans-serif;padding:6px 0;">No records in this range.</p>`;
  const u = unit ? ` ${unit}` : '';
  let rows = '';
  data.forEach((d, i) => {
    const bg = i % 2 === 0 ? '#f4f6ff' : '#ffffff';
    let v;
    if (typeof d.value === 'boolean') {
      v = d.value ? 'ON' : 'OFF';
    } else {
      const f = parseFloat(d.value);
      v = isNaN(f) ? String(d.value) : f.toFixed(2) + u;
    }
    rows += `<tr style="background:${bg}">
      <td style="padding:3px 8px;border:1px solid #dde;font-size:8pt;">${d.timestampString}</td>
      <td style="padding:3px 8px;border:1px solid #dde;font-size:8pt;text-align:right;font-weight:bold;font-family:monospace;">${v}</td>
    </tr>`;
  });
  return `<table style="width:100%;border-collapse:collapse;margin-top:4px;">
    <thead>
      <tr style="background:#003580;color:#fff;">
        <th style="padding:5px 8px;text-align:left;font-size:8pt;font-weight:normal;letter-spacing:.5px;">Timestamp</th>
        <th style="padding:5px 8px;text-align:right;font-size:8pt;font-weight:normal;letter-spacing:.5px;">Value${u ? ' (' + unit + ')' : ''}</th>
      </tr>
    </thead>
    <tbody>${rows}</tbody>
  </table>`;
}

    else alert('Pop-up blocked. Please allow pop-ups for this site.');
  }catch(e){
    console.error('Error generating PDF report:',e);
    mc.innerHTML=oc;
    alert('Failed to generate report: '+e.message);
  }
}

function createVAVExportControls(){
  const mc=document.getElementById('main-content');if(!mc)return;
  const cd=document.createElement('div');cd.id='vav-export-controls';
  const now=new Date(),yd=new Date(now.getTime()-86400000);
  const si=document.createElement('input');si.type='datetime-local';si.id='vav-start-datetime';si.value=yd.toISOString().slice(0,16);
  const ei=document.createElement('input');ei.type='datetime-local';ei.id='vav-end-datetime';ei.value=now.toISOString().slice(0,16);
  const cb=document.createElement('button');cb.className='export-btn';cb.innerHTML='📊 Export CSV';cb.onclick=exportVAVHistoryToCSV;
  const pb=document.createElement('button');pb.className='export-btn';pb.innerHTML='📄 PDF Report';pb.onclick=generateVAVHistoryPDFReport;
  cd.appendChild(si);cd.appendChild(ei);cd.appendChild(cb);cd.appendChild(pb);
  mc.parentNode.insertBefore(cd,mc);
}
setTimeout(createVAVExportControls,250);
</script>
