<html lang="en" xmlns:b="http://www.tridium.com/baja/baja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Murphy Control Panel - RTU Monitoring</title>
    <script type='text/javascript' src='/requirejs/config.js'></script>

    <style>
*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
:root {
  --bg-deep:#0d1117;--bg-panel:#161b27;--bg-card:#1e2535;--bg-card-hover:#252d42;
  --accent:#00c8ff;--accent-glow:rgba(0,200,255,0.25);--accent2:#7b5ea7;
  --green:#00e676;--red:#ff4444;--amber:#ffab00;
  --text-primary:#e8ecf4;--text-muted:#7a8499;
  --border:rgba(0,200,255,0.15);--border-hover:rgba(0,200,255,0.45);
  --radius:10px;--font-head:'Courier New',Courier,monospace;--font-body:Georgia,'Times New Roman',serif;
  --transition:0.22s cubic-bezier(0.4,0,0.2,1);
  --tbl-border:#2a3550;--tbl-head-bg:#0f1825;--tbl-row-even:#141c2e;--tbl-row-odd:#1a2438;--tbl-row-hover:#1e2d45;
}
body.light-mode {
  --bg-deep:#f0f4f8;--bg-panel:#ffffff;--bg-card:#e8edf5;--bg-card-hover:#dce4f0;
  --accent:#dc143c;--accent-glow:rgba(220,20,60,0.18);--accent2:#991b1b;
  --green:#16a34a;--red:#dc2626;--amber:#d97706;
  --text-primary:#1a1e2a;--text-muted:#4b5563;
  --border:rgba(220,20,60,0.18);--border-hover:rgba(220,20,60,0.45);
  --tbl-border:#c5cedc;--tbl-head-bg:#dce4f0;--tbl-row-even:#f5f8fc;--tbl-row-odd:#eef2f8;--tbl-row-hover:#e2e9f4;
}
html{height:100%;overflow:hidden;}
body{height:100%;font-family:var(--font-body);background:var(--bg-deep);color:var(--text-primary);display:flex;flex-direction:column;overflow:hidden;opacity:0;transition:opacity 0.6s ease,background 0.3s ease,color 0.3s ease;}
body.fade-in{opacity:1;}body.fade-out{opacity:0;transition:opacity 0.3s ease;}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,0.6);backdrop-filter:blur(4px);z-index:200;opacity:0;visibility:hidden;transition:var(--transition);}
.overlay.active{opacity:1;visibility:visible;}
.side-panel{position:fixed;top:0;left:-300px;width:280px;height:100vh;background:var(--bg-panel);border-right:1px solid var(--border);z-index:300;transition:left 0.3s ease;padding:80px 0 20px;overflow-y:auto;}
.side-panel.active{left:0;}
.side-panel-header{padding:20px;border-bottom:1px solid var(--border);margin-bottom:10px;}
.side-panel-header h2{font-family:var(--font-head);font-size:14px;letter-spacing:2px;color:var(--accent);font-weight:normal;}
.side-panel-header p{font-size:12px;color:var(--text-muted);margin-top:4px;}
.nav-image-grid{padding:10px 14px;display:flex;flex-direction:column;gap:7px;}
.nav-image-btn{display:flex;align-items:center;gap:12px;padding:10px 14px;background:var(--bg-card);border:1px solid var(--border);border-radius:8px;cursor:pointer;text-decoration:none;transition:var(--transition);position:relative;overflow:hidden;color:var(--text-primary);}
.nav-image-btn::before{content:'';position:absolute;left:0;top:0;bottom:0;width:2px;background:var(--accent);opacity:0;transition:opacity 0.2s;}
.nav-image-btn:hover{border-color:var(--accent);background:var(--bg-card-hover);transform:translateX(3px);}
.nav-image-btn:hover::before{opacity:1;}
.nav-btn-icon{width:40px;height:40px;border-radius:8px;background:rgba(0,200,255,0.08);border:1px solid rgba(0,200,255,0.15);display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:18px;}
body.light-mode .nav-btn-icon{background:rgba(220,20,60,0.08);border-color:rgba(220,20,60,0.15);}
.nav-btn-text{display:flex;flex-direction:column;gap:2px;}
.nav-btn-label{font-family:var(--font-head);font-size:12px;color:var(--text-primary);letter-spacing:0.5px;}
.nav-btn-sublabel{font-family:var(--font-head);font-size:10px;color:var(--text-muted);letter-spacing:0.5px;}
.top-bar{background:rgba(13,17,23,0.97);border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;padding:0 20px;height:64px;flex-shrink:0;position:relative;z-index:100;backdrop-filter:blur(12px);transition:background 0.3s ease;}
body.light-mode .top-bar{background:rgba(255,255,255,0.97);box-shadow:0 1px 12px rgba(0,0,0,0.08);}
.top-bar::after{content:'';position:absolute;bottom:0;left:0;right:0;height:1px;background:linear-gradient(90deg,transparent,var(--accent),transparent);}
.hamburger{width:36px;height:36px;background:var(--bg-card);border:1px solid var(--border);border-radius:6px;cursor:pointer;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:5px;transition:var(--transition);flex-shrink:0;}
.hamburger:hover{border-color:var(--accent);background:var(--bg-card-hover);}
.hamburger-line{width:18px;height:2px;background:var(--text-primary);border-radius:2px;transition:var(--transition);}
.hamburger.active .hamburger-line:nth-child(1){transform:rotate(45deg) translate(5px,5px);}
.hamburger.active .hamburger-line:nth-child(2){opacity:0;}
.hamburger.active .hamburger-line:nth-child(3){transform:rotate(-45deg) translate(5px,-5px);}
.top-center{position:absolute;left:50%;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:2px;}
.site-label{font-family:var(--font-head);font-size:12px;letter-spacing:4px;color:var(--accent);text-transform:uppercase;}
.page-title{font-family:var(--font-head);font-size:18px;font-weight:normal;letter-spacing:1px;color:var(--text-primary);}
.top-right{display:flex;align-items:center;gap:12px;}
.theme-toggle-wrap{display:flex;align-items:center;gap:8px;}
.theme-label{font-family:var(--font-head);font-size:11px;letter-spacing:2px;color:var(--text-muted);text-transform:uppercase;}
.switch{position:relative;display:inline-block;width:42px;height:22px;}
.switch input{opacity:0;width:0;height:0;}
.slider{position:absolute;cursor:pointer;inset:0;background:var(--bg-card);border:1px solid var(--border);border-radius:34px;transition:0.3s;}
.slider:before{position:absolute;content:"";height:16px;width:16px;left:2px;bottom:2px;background:var(--text-muted);border-radius:50%;transition:0.3s;}
input:checked+.slider{background:var(--accent-glow);border-color:var(--accent);}
input:checked+.slider:before{transform:translateX(20px);background:var(--accent);}
.user-badge{background:var(--bg-card);border:1px solid var(--border);border-radius:20px;padding:6px 14px;font-size:13px;color:var(--text-muted);display:flex;align-items:center;gap:8px;font-family:var(--font-head);}
.user-dot{width:8px;height:8px;background:var(--green);border-radius:50%;box-shadow:0 0 6px var(--green);}
#userDisplay{color:var(--text-primary);}
.main-content{flex:1;display:flex;flex-direction:column;min-height:0;min-width:0;overflow:hidden;}

/* ── EXPORT CONTROLS ── */
#rtu-export-controls{display:flex;align-items:center;gap:12px;padding:12px 20px;background:var(--bg-panel);border-bottom:1px solid var(--border);flex-wrap:wrap;flex-shrink:0;}
#rtu-export-controls input[type="datetime-local"]{background:var(--bg-card);border:1px solid var(--border);border-radius:6px;color:var(--text-primary);padding:8px 12px;font-family:var(--font-head);font-size:12px;letter-spacing:0.5px;transition:var(--transition);outline:none;cursor:pointer;}
#rtu-export-controls input[type="datetime-local"]:focus,#rtu-export-controls input[type="datetime-local"]:hover{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-glow);}
#rtu-export-controls input::-webkit-calendar-picker-indicator{filter:invert(0.6) sepia(1) hue-rotate(160deg);cursor:pointer;}
body.light-mode #rtu-export-controls input::-webkit-calendar-picker-indicator{filter:invert(0.3) sepia(1) hue-rotate(320deg);}
.export-btn{background:var(--bg-card);border:1px solid var(--border);border-radius:6px;color:var(--text-muted);padding:8px 18px;font-family:var(--font-head);font-size:11px;letter-spacing:1.5px;text-transform:uppercase;cursor:pointer;display:flex;align-items:center;gap:8px;transition:var(--transition);white-space:nowrap;}
.export-btn:hover{border-color:var(--accent);color:var(--accent);background:var(--bg-card-hover);box-shadow:0 0 12px var(--accent-glow);}

/* ── TABLE SCROLL WRAPPER ── */
.table-scroll-wrap{flex:1;overflow-x:auto;overflow-y:auto;min-height:0;min-width:0;-webkit-overflow-scrolling:touch;padding:24px 32px;}
.table-scroll-wrap::-webkit-scrollbar{width:8px;height:8px;}
.table-scroll-wrap::-webkit-scrollbar-track{background:var(--bg-panel);}
.table-scroll-wrap::-webkit-scrollbar-thumb{background:rgba(0,200,255,0.35);border-radius:4px;}
.table-scroll-wrap::-webkit-scrollbar-thumb:hover{background:var(--accent);}
.table-scroll-wrap::-webkit-scrollbar-corner{background:var(--bg-panel);}
#main-content{flex:1;display:flex;flex-direction:column;min-height:0;min-width:0;overflow:hidden;}

/* ── GRID TABLE ── */
.rtu-table{
  width:auto;min-width:860px;max-width:100%;
  margin:0 auto;border-collapse:separate;border-spacing:0;
  font-family:var(--font-head);font-size:15px;
  border:2px solid var(--tbl-border);border-radius:12px;overflow:hidden;
  box-shadow:0 8px 32px rgba(0,0,0,0.4);
}
.rtu-table thead{position:sticky;top:0;z-index:10;}
.rtu-table thead tr{background:var(--tbl-head-bg);}
.rtu-table thead th{
  padding:13px 18px;font-family:var(--font-head);font-size:12px;letter-spacing:2px;
  text-transform:uppercase;color:var(--accent);font-weight:normal;text-align:center;
  border-bottom:2px solid var(--tbl-border);border-right:1px solid var(--tbl-border);
  white-space:nowrap;background:var(--tbl-head-bg);position:relative;
}
.rtu-table thead th:last-child{border-right:none;}
.rtu-table thead th:first-child{text-align:left;}
.rtu-table tbody tr:nth-child(even){background:var(--tbl-row-even);}
.rtu-table tbody tr:nth-child(odd){background:var(--tbl-row-odd);}
.rtu-table tbody tr:hover{background:var(--tbl-row-hover)!important;}
.rtu-table td{
  padding:11px 18px;text-align:center;
  border-bottom:1px solid var(--tbl-border);border-right:1px solid var(--tbl-border);
  color:var(--text-primary);font-size:15px;vertical-align:middle;white-space:nowrap;
}
.rtu-table td:last-child{border-right:none;}
.rtu-table tbody tr:last-child td{border-bottom:none;}
.rtu-table td:first-child{text-align:left;}

/* ── NAME LINK ── */
.rtu-name{font-family:var(--font-head);font-size:15px;font-weight:bold;letter-spacing:0.5px;}
.rtu-name a{color:var(--accent);text-decoration:none;transition:var(--transition);font-weight:bold;}
.rtu-name a:hover{color:#fff;text-shadow:0 0 10px var(--accent);}
.rtu-name a:visited{color:var(--accent);}
body.light-mode .rtu-name a,body.light-mode .rtu-name a:visited{color:var(--accent);}
body.light-mode .rtu-name a:hover{color:#1a1e2a;text-shadow:none;}

/* ── VALUE STATES ── */
.value-loading{color:var(--text-muted);font-style:italic;font-size:13px;letter-spacing:1px;}
.value-loading::after{content:'';animation:dots 1.4s infinite;}
@keyframes dots{0%{content:'';}33%{content:'.';}66%{content:'..';}100%{content:'...'}}
.value-error{color:var(--red);font-size:14px;font-weight:bold;}
.value-missing{color:var(--text-muted);font-size:13px;}
.value-normal{color:var(--text-primary);font-family:var(--font-head);font-size:15px;}
.value-active{color:var(--green);font-family:var(--font-head);font-weight:bold;font-size:15px;}
.value-inactive{color:#8a9ab5;font-family:var(--font-head);font-weight:bold;font-size:15px;}
.value-alarm{color:var(--red);font-family:var(--font-head);font-weight:bold;font-size:15px;animation:pulse-alarm 1.2s ease-in-out infinite;}
@keyframes pulse-alarm{0%,100%{opacity:1;}50%{opacity:0.5;}}

/* ── BOTTOM BAR ── */
.bottom-bar{background:rgba(13,17,23,0.97);border-top:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;padding:0 20px;height:50px;flex-shrink:0;position:relative;}
body.light-mode .bottom-bar{background:rgba(255,255,255,0.97);box-shadow:0 -1px 12px rgba(0,0,0,0.06);}
.bottom-bar::before{content:'';position:absolute;top:0;left:0;right:0;height:1px;background:linear-gradient(90deg,transparent,var(--accent),transparent);}
.back-btn{background:none;border:1px solid var(--border);border-radius:6px;color:var(--text-muted);padding:6px 16px;cursor:pointer;font-size:13px;font-family:var(--font-head);letter-spacing:1px;display:flex;align-items:center;gap:8px;transition:var(--transition);}
.back-btn:hover{border-color:var(--accent);color:var(--accent);}
.datetime-display{font-family:var(--font-head);font-size:13px;color:var(--text-muted);letter-spacing:1px;}
.logoff-btn{background:none;border:1px solid var(--border);border-radius:6px;color:var(--text-muted);padding:6px 16px;cursor:pointer;font-size:13px;font-family:var(--font-head);letter-spacing:1px;display:flex;align-items:center;gap:8px;transition:var(--transition);}
.logoff-btn:hover{border-color:var(--red);color:var(--red);}
.loading-msg{text-align:center;padding:60px 20px;color:var(--text-muted);font-family:var(--font-head);font-size:13px;letter-spacing:2px;}
.error-msg{text-align:center;padding:60px 20px;color:var(--red);font-family:var(--font-head);font-size:13px;letter-spacing:1px;}
    </style>
</head>

<script>
// ──────────────────────────────────────────────
// HELPERS
// ──────────────────────────────────────────────
function decodeAsciiName(name){
    if(!name||typeof name!=='string')return name;
    return name.replace(/\$([0-9a-fA-F]{2})/g,(m,h)=>String.fromCharCode(parseInt(h,16))).replace(/\$/g,'');
}

function stripStatusSuffix(str){
    if(typeof str!=='string')return str;
    return str.replace(/\s*\{[^}]*\}\s*$/,'').trim();
}

// ──────────────────────────────────────────────
// GLOBAL STATE
// ──────────────────────────────────────────────
let pointValues={};
let allRTUPoints={};
let subscriber;

// ──────────────────────────────────────────────
// AUTHORIZATION
// ──────────────────────────────────────────────
// function isAuthorizedUser(){
//     const username=sessionStorage.getItem('username')||'murphy';
//     const authorizedUsers=['murphy','admin'];
//     return authorizedUsers.includes(username.toLowerCase());
// }

// if(!isAuthorizedUser()){
//     document.getElementById('main-content').innerHTML='<div class="error-msg">Access Denied: You do not have permission to view point data.</div>';
//     throw new Error('Unauthorized access');
// }

// ──────────────────────────────────────────────
// EXCLUSION FILTER
// ──────────────────────────────────────────────
function shouldExcludeRTU(rtuName){
    const excludePatterns=[/SF/i,/RF/i,/EF/i,/\bFAN\b/i,/EXHAUST/i,/RETURN/i,/VFD/i];
    return excludePatterns.some(p=>p.test(rtuName));
}

// ──────────────────────────────────────────────
// FORMAT VALUES
// ──────────────────────────────────────────────
function formatPointValue(value,pointId){
    if(value===null||value===undefined||value==='N/A'||value==='Connection Error'){
        return value==='Connection Error'?'Connection Error':'N/A';
    }
    if(typeof value==='string'&&value.startsWith('NO_'))return value;
    if(typeof value==='string'){value=stripStatusSuffix(value);}
    if(pointId==='HTG-CAP'||pointId==='CLG-CAP'||pointId==='EXFan'||pointId==='Fan-Stat'){
        const n=typeof value==='number'?value:parseFloat(value);
        return isNaN(n)?value.toString():Math.round(n)+'%';
    }
    if(pointId==='Occupancy'){return value?'Occupied':'Unoccupied';}
    if(pointId==='ModeStatus'){return stripStatusSuffix(value.toString());}
    if(pointId==='RTU-ALARM'){return value?'ALARM':'Normal';}
    if(pointId==='StaticSP'||pointId==='Static'||pointId==='SpacePress'||pointId==='SpacePressSP'){
        const n=typeof value==='number'?value:parseFloat(value);
        return isNaN(n)?value.toString():n.toFixed(3)+' in/wc';
    }
    if(typeof value==='number'){return value.toFixed(1)+'°F';}
    return value.toString();
}

function getValueClass(value,pointId){
    if(value===null||value===undefined||value==='N/A'||value==='Connection Error')return'value-error';
    if(typeof value==='string'&&value.startsWith('NO_'))return'value-missing';
    if(pointId==='Occupancy')return value?'value-active':'value-inactive';
    if(pointId==='RTU-ALARM')return value?'value-alarm':'value-normal';
    return'value-normal';
}

// ──────────────────────────────────────────────
// COLUMN VISIBILITY
// ──────────────────────────────────────────────
const COLUMN_ORDER=['Occupancy','ModeStatus','RTU-ALARM','Fan-Stat','EXFan','Static','StaticSP','SpacePress','SpacePressSP','DA-T','DA-T-SP','HTG-CAP','CLG-CAP'];

function hasValidValues(pointId){
    for(const rtuName in pointValues){
        const val=pointValues[rtuName][pointId];
        if(val!==undefined&&val!==null&&!(typeof val==='string'&&val.startsWith('NO_')))return true;
    }
    return false;
}

function updateColumnVisibility(){
    COLUMN_ORDER.forEach((pointId,i)=>{
        const ci=i+2;
        const hv=hasValidValues(pointId);
        const hc=document.querySelector(`.rtu-table thead th:nth-child(${ci})`);
        const dc=document.querySelectorAll(`.rtu-table tbody td:nth-child(${ci})`);
        if(hc)hc.style.display=hv?'':'none';
        dc.forEach(c=>{c.style.display=hv?'':'none';});
    });
}

// ──────────────────────────────────────────────
// UPDATE DISPLAY
// ──────────────────────────────────────────────
function updatePointValue(rtuName,pointId,value){
    if(typeof value==='string'){value=stripStatusSuffix(value);}
    const el=document.getElementById(`point-${rtuName}-${pointId}`);
    if(el){
        el.textContent=formatPointValue(value,pointId);
        el.className=getValueClass(value,pointId);
        if(!pointValues[rtuName])pointValues[rtuName]={};
        pointValues[rtuName][pointId]=value;
        updateColumnVisibility();
    }
}

// ──────────────────────────────────────────────
// SUBSCRIBER INIT
// ──────────────────────────────────────────────
try{
    require(['baja!'],function(baja){
        subscriber=new baja.Subscriber();
        subscriber.attach('changed',function(prop){
            if(prop.getName()==='out'){
                const pi=this.userData;
                if(pi){
                    const out=this.getOut();
                    let displayValue;
                    if(pi.pointId==='ModeStatus'||pi.pointId==='EXFan'||pi.pointId==='Fan-Stat'){
                        const raw=out.getDisplay?out.getDisplay():out.getValue();
                        displayValue=typeof raw==='string'?stripStatusSuffix(raw):raw;
                    }else{
                        displayValue=out.getValue();
                    }
                    updatePointValue(pi.rtuName,pi.pointId,displayValue);
                }
            }
        });
    });
}catch(e){console.error('Failed to initialize subscriber:',e);}

// ──────────────────────────────────────────────
// SUBSCRIBE TO POINT
// ──────────────────────────────────────────────
function subscribeToPoint(rtuName,pointId,pointPath){
    try{
        require(['baja!'],function(baja){
            baja.Ord.make(pointPath).get({subscriber:subscriber})
                .then(point=>{
                    point.userData={rtuName,pointId,pointPath};
                    const out=point.getOut();
                    let displayValue;
                    if(pointId==='ModeStatus'||pointId==='EXFan'||pointId==='Fan-Stat'){
                        const raw=out.getDisplay?out.getDisplay():out.getValue();
                        displayValue=typeof raw==='string'?stripStatusSuffix(raw):raw;
                    }else{
                        displayValue=out.getValue();
                    }
                    updatePointValue(rtuName,pointId,displayValue);
                })
                .catch(()=>updatePointValue(rtuName,pointId,'Connection Error'));
        });
    }catch(e){updatePointValue(rtuName,pointId,'Connection Error');}
}

            <td id="point-${rtuName}-DA-T" class="value-loading">Loading</td>

            'RTU-ALARM':    points.find(p=>p.id==='RTU-ALARM'),
            'Fan-Stat':     points.find(p=>p.id==='Fan-Stat'),
            'EXFan':        points.find(p=>p.id==='EXFan'),
            'Static':       points.find(p=>p.id==='Static'),
            'StaticSP':     points.find(p=>p.id==='StaticSP'),
            'SpacePress':   points.find(p=>p.id==='SpacePress'),
            'SpacePressSP': points.find(p=>p.id==='SpacePressSP'),
            'DA-T':         points.find(p=>p.id==='DA-T'),
            'DA-T-SP':      points.find(p=>p.id==='DA-T-SP'),
            'HTG-CAP':      points.find(p=>p.id==='HTG-CAP'),
            'CLG-CAP':      points.find(p=>p.id==='CLG-CAP')
        };

        const missingNames={
            'Occupancy':'NO_Occupancy','ModeStatus':'NO_Mode','RTU-ALARM':'NO_Alarm',
            'Fan-Stat':'NO_Fan Stat','EXFan':'NO_EX Fan','Static':'NO_Static',
            'StaticSP':'NO_Static SP','SpacePress':'NO_Space Press','SpacePressSP':'NO_Space Press SP',
            'DA-T':'NO_DA Temp','DA-T-SP':'NO_DA Temp SP','HTG-CAP':'NO_Heating','CLG-CAP':'NO_Cooling'
        };

        Object.keys(pm).forEach(pointId=>{

                updatePointValue(rtuName,pointId,missingNames[pointId]||'N/A');
            }

// LOAD JSON + BOOTSTRAP
// ──────────────────────────────────────────────
async function loadAndDisplayRTUPoints(){
    try{
        const response=await fetch('../Global.json');
        if(!response.ok)throw new Error(`Failed to load JSON: ${response.status} ${response.statusText}`);
        const jsonData=await response.json();

        const rtuConfigs={};
        Object.keys(jsonData.globalVariables).forEach(key=>{
            if(key.toLowerCase().startsWith('rtu_')||key.toLowerCase().includes('rtu')){
                if(shouldExcludeRTU(key))return;
                const connectedPoints=jsonData.globalVariables[key].points.filter(p=>p.status==='connected');
                if(connectedPoints.length>0)rtuConfigs[key]=connectedPoints;
            }
        });

        allRTUPoints=rtuConfigs;
        createRTUDisplay(rtuConfigs);
    }catch(e){
        console.error('Error loading RTU points from JSON:',e);
        document.getElementById('main-content').innerHTML=`<div class="error-msg">Error loading RTU data: ${e.message}</div>`;
    }
}

<script>
// ──────────────────────────────────────────────
// HISTORY EXPORT
// ──────────────────────────────────────────────
let rtuHistoryCache=new Map();

async function discoverRTUHistoryOrd(pointOrd){
    return new Promise((res,rej)=>{
        try{
            require(['baja!'],function(baja){
                baja.Ord.make(pointOrd).get()
                    .then(e=>e.tags())
                    .then(tm=>{
                        const ht=tm.get('n:history');
                        if(ht&&ht.toString().trim()!==''){
                            let hp=ht.toString();
                            if(!hp.startsWith('history:'))hp='history:'+hp;
                            res(hp);
                        }else rej(new Error('No n:history tag'));
                    })
                    .catch(e=>rej(new Error('Failed to load point tags: '+e.message)));
            });
        }catch(e){rej(e);}
    });
}

async function loadRTUHistoryData(pointPath,startTime,endTime,maxPoints=1000){
    return new Promise(async(res,rej)=>{
        try{
            let ho=rtuHistoryCache.get(pointPath);
            if(!ho){
                try{ho=await discoverRTUHistoryOrd(pointPath);rtuHistoryCache.set(pointPath,ho);}
                catch(e){res([]);return;}
            }
            require(['baja!'],function(baja){
                const tc=`timestamp >= '${startTime.toISOString()}' and timestamp <= '${endTime.toISOString()}'`;
                const dp=[];
                baja.Ord.make(ho+'|bql:select timestamp, value where '+tc+' order by timestamp').get({
                    cursor:{limit:maxPoints,each:function(){
                        const r=this.get(),rt=r.get('timestamp'),v=r.get('value'),d=new Date(rt.getMillis());
                        dp.push({timestamp:d,timestampString:d.toLocaleString(),value:v});
                    }}
                }).then(()=>res(dp)).catch(e=>rej(new Error('Failed to load history: '+e.message)));
            });
        }catch(e){rej(e);}
    });
}

function getAllRTUPointPaths(){
    const paths=[];
    Object.keys(allRTUPoints).forEach(rtuName=>{
        const pts=allRTUPoints[rtuName];
        const pm={
            'Fan-Stat':     pts.find(p=>p.id==='Fan-Stat'),
            'HTG-CAP':      pts.find(p=>p.id==='HTG-CAP'),
            'CLG-CAP':      pts.find(p=>p.id==='CLG-CAP'),
            'Occupancy':    pts.find(p=>p.id==='Occupancy'),
            'ModeStatus':   pts.find(p=>p.id==='ModeStatus'),
            'RTU-ALARM':    pts.find(p=>p.id==='RTU-ALARM'),
            'EXFan':        pts.find(p=>p.id==='EXFan'),
            'Static':       pts.find(p=>p.id==='Static'),
            'StaticSP':     pts.find(p=>p.id==='StaticSP'),
            'SpacePress':   pts.find(p=>p.id==='SpacePress'),
            'SpacePressSP': pts.find(p=>p.id==='SpacePressSP'),
            'DA-T':         pts.find(p=>p.id==='DA-T'),
            'DA-T-SP':      pts.find(p=>p.id==='DA-T-SP')
        };
        Object.keys(pm).forEach(pid=>{
            const pt=pm[pid];
            if(pt&&pt.status==='connected'&&pt.fullPath){
                paths.push({name:`${rtuName}_${pid}`,rtuName,pointId:pid,path:pt.fullPath});
            }
        });
    });
    return paths;
}

// ── CSV EXPORT ──
async function exportRTUHistoryToCSV(){
    const mc=document.getElementById('main-content'),oc=mc.innerHTML;
    mc.innerHTML='<div class="loading-msg">Loading historical data for CSV export</div>';
    try{
        const sd=new Date(document.getElementById('rtu-start-datetime').value);
        const ed=new Date(document.getElementById('rtu-end-datetime').value);
        const ap=getAllRTUPointPaths();
        if(!ap.length){mc.innerHTML=oc;alert('No data points available to export');return;}

        const ahd=await Promise.all(ap.map(p=>loadRTUHistoryData(p.path,sd,ed,1000).then(d=>({pointName:p.name,data:d}))));

        const tm=new Map();
        ahd.forEach(ph=>ph.data.forEach(r=>{
            const ts=r.timestampString;
            if(!tm.has(ts))tm.set(ts,{timestamp:ts});
            tm.get(ts)[ph.pointName]=r.value;
        }));

        const sortedData=Array.from(tm.values()).sort((a,b)=>new Date(a.timestamp)-new Date(b.timestamp));
        if(!sortedData.length){mc.innerHTML=oc;alert('No historical data found for the selected time range');return;}

        let csv=['Timestamp',...ap.map(p=>p.name)].join(',')+'\n';
        sortedData.forEach(row=>{
            const st=`"${row.timestamp.replace(/"/g,'""')}"`;
            csv+=[st,...ap.map(p=>{
                const v=row[p.name];
                if(v===undefined||v===null)return'';
                const s=String(v);
                return(s.includes(',')||s.includes('"'))?`"${s.replace(/"/g,'""')}"`:s;
            })].join(',')+'\n';
        });

        const blob=new Blob([csv],{type:'text/csv;charset=utf-8;'});
        const link=document.createElement('a');
        const url=URL.createObjectURL(blob);
        link.setAttribute('href',url);
        link.setAttribute('download',`RTU_History_${sd.toISOString().slice(0,10)}_to_${ed.toISOString().slice(0,10)}.csv`);
        link.style.visibility='hidden';
        document.body.appendChild(link);link.click();document.body.removeChild(link);URL.revokeObjectURL(url);
        mc.innerHTML=oc;
        alert(`CSV exported successfully: ${sortedData.length} readings`);
    }catch(e){console.error('Error exporting CSV:',e);mc.innerHTML=oc;alert('Failed to export CSV: '+e.message);}
}

// ── SVG CHART BUILDER (ported from FTU) ──
function buildRTUSVGChart(data, label, unit, width, height) {
  width = width || 860;
  height = height || 200;
  const pad = { top:32, right:24, bottom:44, left:68 };
  const gW = width  - pad.left - pad.right;
  const gH = height - pad.top  - pad.bottom;

  const rawVals = data.map(d =>
    typeof d.value === 'boolean' ? (d.value ? 1 : 0) : parseFloat(d.value)
  ).filter(v => !isNaN(v));

  if (!rawVals.length) {
    return `<svg width="${width}" height="60" xmlns="http://www.w3.org/2000/svg">
      <text x="${width/2}" y="36" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" fill="#999">No numeric data available</text>
    </svg>`;
  }

  const minV   = Math.min(...rawVals);
  const maxV   = Math.max(...rawVals);
  const rangeV = maxV - minV || 1;
  const times  = data.map(d => d.timestamp.getTime());
  const minT   = Math.min(...times);
  const maxT   = Math.max(...times);
  const rangeT = maxT - minT || 1;

  const xOf = t => pad.left + ((t - minT) / rangeT) * gW;
  const yOf = v => pad.top  + gH - ((v - minV) / rangeV) * gH;

  const pts = data.map((d, i) => {
    const v = typeof d.value === 'boolean' ? (d.value ? 1 : 0) : parseFloat(d.value);
    if (isNaN(v)) return null;
    return `${xOf(times[i]).toFixed(1)},${yOf(v).toFixed(1)}`;
  }).filter(Boolean).join(' ');

  let yTicks = '';
  for (let i = 0; i <= 4; i++) {
    const v = minV + (rangeV / 4) * i;
    const y = yOf(v);
    yTicks += `<line x1="${pad.left}" y1="${y.toFixed(1)}" x2="${pad.left + gW}" y2="${y.toFixed(1)}" stroke="#dde3ee" stroke-width="0.8"/>
      <text x="${(pad.left - 6).toFixed(1)}" y="${(y + 4).toFixed(1)}" text-anchor="end" font-family="Arial,sans-serif" font-size="9" fill="#556">${v.toFixed(unit === 'in/wc' ? 3 : 1)}</text>`;
  }

  let xTicks = '';
  for (let i = 0; i <= 4; i++) {
    const t   = minT + (rangeT / 4) * i;
    const x   = xOf(t);
    const lbl = new Date(t).toLocaleString([], { month:'numeric', day:'numeric', hour:'2-digit', minute:'2-digit' });
    xTicks += `<text x="${x.toFixed(1)}" y="${(pad.top + gH + 30).toFixed(1)}" text-anchor="middle" font-family="Arial,sans-serif" font-size="8" fill="#556">${lbl}</text>`;
  }

  const avg  = (rawVals.reduce((a, b) => a + b, 0) / rawVals.length).toFixed(unit === 'in/wc' ? 3 : 2);
  const u    = unit ? ` ${unit}` : '';
  const avgY = yOf(parseFloat(avg));

  return `<svg width="${width}" height="${height}" xmlns="http://www.w3.org/2000/svg" style="overflow:visible;display:block;">
    <rect x="${pad.left}" y="${pad.top}" width="${gW}" height="${gH}" fill="#f7f9ff" stroke="#c8d4ee" stroke-width="0.8" rx="2"/>
    <text x="${width / 2}" y="20" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" font-weight="bold" fill="#1e3c72">${label}</text>
    <text x="${pad.left - 8}" y="${pad.top - 6}" text-anchor="middle" font-family="Arial,sans-serif" font-size="9" fill="#888">${u}</text>
    ${yTicks}
    ${xTicks}
    <line x1="${pad.left}" y1="${avgY.toFixed(1)}" x2="${pad.left + gW}" y2="${avgY.toFixed(1)}" stroke="#ffab00" stroke-width="1.2" stroke-dasharray="5,3"/>
    <text x="${(pad.left + gW + 4).toFixed(1)}" y="${(avgY + 4).toFixed(1)}" font-family="Arial,sans-serif" font-size="8" fill="#c07000">avg</text>
    <polyline points="${pts}" fill="none" stroke="#1e3c72" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round"/>
    <line x1="${pad.left}" y1="${pad.top}" x2="${pad.left}" y2="${pad.top + gH}" stroke="#8899cc" stroke-width="1.2"/>
    <line x1="${pad.left}" y1="${pad.top + gH}" x2="${pad.left + gW}" y2="${pad.top + gH}" stroke="#8899cc" stroke-width="1.2"/>
    <text x="${pad.left + gW}" y="${pad.top - 6}" text-anchor="end" font-family="Arial,sans-serif" font-size="9" fill="#556">
      Min: ${Math.min(...rawVals).toFixed(unit === 'in/wc' ? 3 : 2)}${u}  Avg: ${avg}${u}  Max: ${Math.max(...rawVals).toFixed(unit === 'in/wc' ? 3 : 2)}${u}  n=${rawVals.length}
    </text>
  </svg>`;
}

// ── TIMESTAMP TABLE BUILDER (ported from FTU) ──
function buildRTUTimestampTable(data, unit) {
  if (!data.length) return `<p style="color:#999;font-size:8pt;font-family:Arial,sans-serif;padding:6px 0;">No records in this range.</p>`;
  const u = unit ? ` ${unit}` : '';
  const decimals = unit === 'in/wc' ? 3 : 2;
  let rows = '';
  data.forEach((d, i) => {
    const bg = i % 2 === 0 ? '#f4f6ff' : '#ffffff';
    let v;
    if (typeof d.value === 'boolean') {
      v = d.value ? 'ON' : 'OFF';
    } else {
      const f = parseFloat(d.value);
      v = isNaN(f) ? String(d.value) : f.toFixed(decimals) + u;
    }
    rows += `<tr style="background:${bg}">
      <td style="padding:3px 8px;border:1px solid #dde;font-size:8pt;">${d.timestampString}</td>
      <td style="padding:3px 8px;border:1px solid #dde;font-size:8pt;text-align:right;font-weight:bold;font-family:monospace;">${v}</td>
    </tr>`;
  });
  return `<table style="width:100%;border-collapse:collapse;margin-top:4px;">
    <thead>
      <tr style="background:#1e3c72;color:#fff;">
        <th style="padding:5px 8px;text-align:left;font-size:8pt;font-weight:normal;letter-spacing:.5px;">Timestamp</th>
        <th style="padding:5px 8px;text-align:right;font-size:8pt;font-weight:normal;letter-spacing:.5px;">Value${unit ? ' (' + unit + ')' : ''}</th>
      </tr>
    </thead>
    <tbody>${rows}</tbody>
  </table>`;
}

                    }
                    summaryHTML += `<tr style="background:${bg}">
                      <td style="font-weight:500;">${meta.label}</td>
                      <td><strong>${lv}</strong></td>
                      <td>${min.toFixed(dec)}${u ? ' ' + u : ''}</td>
                      <td>${avg}${u ? ' ' + u : ''}</td>
                      <td>${max.toFixed(dec)}${u ? ' ' + u : ''}</td>
                      <td style="text-align:center;">${vals.length}</td>
                    </tr>`;
                }
            });
            summaryHTML += `</tbody></table>`;
        });
        summaryHTML += `</div>`;

        // ── Per-point charts + timestamp tables ──
        let detailHTML = `<div class="section page-break"><h2>Per-Point Charts &amp; Historical Data</h2>
          <p class="sub-note">Each point shows an inline trend chart followed by the full timestamped log for the selected range.</p>`;

        sortedRTUNames.forEach(rn => {
            const pts = rtuGroups[rn];
            detailHTML += `<div class="rtu-block"><h3>${decodeAsciiName(rn)}</h3>`;
            pts.forEach(pt => {
                const meta  = POINT_META[pt.pointId] || { label: pt.pointId, unit: '' };
                const chart = buildRTUSVGChart(pt.data, `${decodeAsciiName(rn)} — ${meta.label}`, meta.unit, 860, 200);
                const table = buildRTUTimestampTable(pt.data, meta.unit);
                detailHTML += `
                  <div class="point-block">
                    <h4>${meta.label} <span class="rec-count">(${pt.data.length} records)</span></h4>
                    <div class="chart-wrap">${chart}</div>
                    <details>
                      <summary>▶ Show all ${pt.data.length} timestamp records</summary>
                      <div class="table-scroll">${table}</div>
                    </details>
                  </div>`;
            });
            detailHTML += `</div>`;
        });
        detailHTML += `</div>`;

        // ── Assemble full PDF HTML ──
        const pdfHTML = `<!DOCTYPE html>
<html><head>

  position: fixed; top: 12px; right: 12px;
  background: #fff; border: 2px solid #1e3c72; border-radius: 8px;

        mc.innerHTML=oc;
        const pw=window.open('','_blank');
        if(pw){pw.document.write(pdfHTML);pw.document.close();}
        else alert('Pop-up blocked. Please allow pop-ups for this site.');
    }catch(e){
        console.error('Error generating PDF report:',e);
        mc.innerHTML=oc;
        alert('Failed to generate report: '+e.message);
    }
}

// ── EXPORT CONTROLS UI ──
function createRTUExportControls(){
    const mc=document.getElementById('main-content');
    if(!mc)return;
    const cd=document.createElement('div');
    cd.id='rtu-export-controls';

    const now=new Date(),yd=new Date(now.getTime()-86400000);
    const si=document.createElement('input');si.type='datetime-local';si.id='rtu-start-datetime';si.value=yd.toISOString().slice(0,16);
    const ei=document.createElement('input');ei.type='datetime-local';ei.id='rtu-end-datetime';ei.value=now.toISOString().slice(0,16);

    const cb=document.createElement('button');cb.className='export-btn';cb.innerHTML='📊 Export CSV';cb.onclick=exportRTUHistoryToCSV;
    const pb=document.createElement('button');pb.className='export-btn';pb.innerHTML='📄 PDF Report';pb.onclick=generateRTUHistoryPDFReport;

    cd.appendChild(si);cd.appendChild(ei);cd.appendChild(cb);cd.appendChild(pb);
    mc.parentNode.insertBefore(cd,mc);
}
setTimeout(createRTUExportControls,250);
