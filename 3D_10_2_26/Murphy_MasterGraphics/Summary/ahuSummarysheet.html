<!DOCTYPE html>
<!-- @noSnoop -->
<html lang="en" xmlns:b="http://www.tridium.com/baja/baja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Murphy Control Panel - AHU Monitoring</title>
    <script type='text/javascript' src='/requirejs/config.js'></script>
    <script type='text/javascript' src='/module/js/com/tridium/js/ext/require/require.min.js?'></script>
    <style>
*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
:root {
  --bg-deep:#0d1117;--bg-panel:#161b27;--bg-card:#1e2535;--bg-card-hover:#252d42;
  --accent:#00c8ff;--accent-glow:rgba(0,200,255,0.25);--accent2:#7b5ea7;
  --green:#00e676;--red:#ff4444;--amber:#ffab00;
  --text-primary:#e8ecf4;--text-muted:#7a8499;
  --border:rgba(0,200,255,0.15);--border-hover:rgba(0,200,255,0.45);
  --radius:10px;--font-head:'Courier New',Courier,monospace;--font-body:Georgia,'Times New Roman',serif;
  --transition:0.22s cubic-bezier(0.4,0,0.2,1);
  --tbl-border:#2a3550;--tbl-head-bg:#0f1825;--tbl-row-even:#141c2e;--tbl-row-odd:#1a2438;--tbl-row-hover:#1e2d45;
  --occ-active-bg:#00e676;--occ-active-shadow:rgba(0,0,0,0.18);--occ-active-text:#04210f;
  --occ-inactive-bg:#5a6478;--occ-inactive-shadow:rgba(0,0,0,0.18);--occ-inactive-text:#eef2f8;
}
body.light-mode {
  --bg-deep:#f0f4f8;--bg-panel:#ffffff;--bg-card:#e8edf5;--bg-card-hover:#dce4f0;
  --accent:#dc143c;--accent-glow:rgba(220,20,60,0.18);--accent2:#991b1b;
  --green:#16a34a;--red:#dc2626;--amber:#d97706;
  --text-primary:#1a1e2a;--text-muted:#4b5563;
  --border:rgba(220,20,60,0.18);--border-hover:rgba(220,20,60,0.45);
  --tbl-border:#c5cedc;--tbl-head-bg:#dce4f0;--tbl-row-even:#f5f8fc;--tbl-row-odd:#eef2f8;--tbl-row-hover:#e2e9f4;
  --occ-active-bg:#16a34a;--occ-active-shadow:rgba(0,0,0,0.12);--occ-active-text:#eafff0;
  --occ-inactive-bg:#94a3b8;--occ-inactive-shadow:rgba(0,0,0,0.12);--occ-inactive-text:#1a1e2a;
}
html{height:100%;overflow:hidden;}
body{height:100%;font-family:var(--font-body);background:var(--bg-deep);color:var(--text-primary);display:flex;flex-direction:column;overflow:hidden;opacity:0;transition:opacity 0.6s ease,background 0.3s ease,color 0.3s ease;}
body.fade-in{opacity:1;}body.fade-out{opacity:0;transition:opacity 0.3s ease;}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,0.6);backdrop-filter:blur(4px);z-index:200;opacity:0;visibility:hidden;transition:var(--transition);}
.overlay.active{opacity:1;visibility:visible;}
.side-panel{position:fixed;top:0;left:-300px;width:280px;height:100vh;background:var(--bg-panel);border-right:1px solid var(--border);z-index:300;transition:left 0.3s ease;padding:80px 0 20px;overflow-y:auto;}
.side-panel.active{left:0;}
.side-panel-header{padding:20px;border-bottom:1px solid var(--border);margin-bottom:10px;}
.side-panel-header h2{font-family:var(--font-head);font-size:14px;letter-spacing:2px;color:var(--accent);font-weight:normal;}
.side-panel-header p{font-size:12px;color:var(--text-muted);margin-top:4px;}
.nav-image-grid{padding:10px 14px;display:flex;flex-direction:column;gap:7px;}
.nav-image-btn{display:flex;align-items:center;gap:12px;padding:10px 14px;background:var(--bg-card);border:1px solid var(--border);border-radius:8px;cursor:pointer;text-decoration:none;transition:var(--transition);position:relative;overflow:hidden;color:var(--text-primary);}
.nav-image-btn::before{content:'';position:absolute;left:0;top:0;bottom:0;width:2px;background:var(--accent);opacity:0;transition:opacity 0.2s;}
.nav-image-btn:hover{border-color:var(--accent);background:var(--bg-card-hover);transform:translateX(3px);}
.nav-image-btn:hover::before{opacity:1;}
.nav-btn-icon{width:40px;height:40px;border-radius:8px;background:rgba(0,200,255,0.08);border:1px solid rgba(0,200,255,0.15);display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:18px;}
body.light-mode .nav-btn-icon{background:rgba(220,20,60,0.08);border-color:rgba(220,20,60,0.15);}
.nav-btn-text{display:flex;flex-direction:column;gap:2px;}
.nav-btn-label{font-family:var(--font-head);font-size:12px;color:var(--text-primary);letter-spacing:0.5px;}
.nav-btn-sublabel{font-family:var(--font-head);font-size:10px;color:var(--text-muted);letter-spacing:0.5px;}
.top-bar{background:rgba(13,17,23,0.97);border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;padding:0 20px;height:64px;flex-shrink:0;position:relative;z-index:100;backdrop-filter:blur(12px);transition:background 0.3s ease;}
body.light-mode .top-bar{background:rgba(255,255,255,0.97);box-shadow:0 1px 12px rgba(0,0,0,0.08);}
.top-bar::after{content:'';position:absolute;bottom:0;left:0;right:0;height:1px;background:linear-gradient(90deg,transparent,var(--accent),transparent);}
.hamburger{width:36px;height:36px;background:var(--bg-card);border:1px solid var(--border);border-radius:6px;cursor:pointer;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:5px;transition:var(--transition);flex-shrink:0;}
.hamburger:hover{border-color:var(--accent);background:var(--bg-card-hover);}
.hamburger-line{width:18px;height:2px;background:var(--text-primary);border-radius:2px;transition:var(--transition);}
.hamburger.active .hamburger-line:nth-child(1){transform:rotate(45deg) translate(5px,5px);}
.hamburger.active .hamburger-line:nth-child(2){opacity:0;}
.hamburger.active .hamburger-line:nth-child(3){transform:rotate(-45deg) translate(5px,-5px);}
.top-center{position:absolute;left:50%;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:2px;}
.site-label{font-family:var(--font-head);font-size:12px;letter-spacing:4px;color:var(--accent);text-transform:uppercase;}
.page-title{font-family:var(--font-head);font-size:18px;font-weight:normal;letter-spacing:1px;color:var(--text-primary);}
.top-right{display:flex;align-items:center;gap:12px;}
.theme-toggle-wrap{display:flex;align-items:center;gap:8px;}
.theme-label{font-family:var(--font-head);font-size:11px;letter-spacing:2px;color:var(--text-muted);text-transform:uppercase;}
.switch{position:relative;display:inline-block;width:42px;height:22px;}
.switch input{opacity:0;width:0;height:0;}
.slider{position:absolute;cursor:pointer;inset:0;background:var(--bg-card);border:1px solid var(--border);border-radius:34px;transition:0.3s;}
.slider:before{position:absolute;content:"";height:16px;width:16px;left:2px;bottom:2px;background:var(--text-muted);border-radius:50%;transition:0.3s;}
input:checked+.slider{background:var(--accent-glow);border-color:var(--accent);}
input:checked+.slider:before{transform:translateX(20px);background:var(--accent);}
.user-badge{background:var(--bg-card);border:1px solid var(--border);border-radius:20px;padding:6px 14px;font-size:13px;color:var(--text-muted);display:flex;align-items:center;gap:8px;font-family:var(--font-head);}
.user-dot{width:8px;height:8px;background:var(--green);border-radius:50%;box-shadow:0 0 6px var(--green);}
#userDisplay{color:var(--text-primary);}
.main-content{flex:1;display:flex;flex-direction:column;min-height:0;min-width:0;overflow:hidden;}

/* ── EXPORT CONTROLS ── */
#ahu-export-controls{display:flex;align-items:center;gap:12px;padding:12px 20px;background:var(--bg-panel);border-bottom:1px solid var(--border);flex-wrap:wrap;flex-shrink:0;}
#ahu-export-controls input[type="datetime-local"]{background:var(--bg-card);border:1px solid var(--border);border-radius:6px;color:var(--text-primary);padding:8px 12px;font-family:var(--font-head);font-size:12px;letter-spacing:0.5px;transition:var(--transition);outline:none;cursor:pointer;}
#ahu-export-controls input[type="datetime-local"]:focus,#ahu-export-controls input[type="datetime-local"]:hover{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-glow);}
#ahu-export-controls input::-webkit-calendar-picker-indicator{filter:invert(0.6) sepia(1) hue-rotate(160deg);cursor:pointer;}
body.light-mode #ahu-export-controls input::-webkit-calendar-picker-indicator{filter:invert(0.3) sepia(1) hue-rotate(320deg);}
.export-btn{background:var(--bg-card);border:1px solid var(--border);border-radius:6px;color:var(--text-muted);padding:8px 18px;font-family:var(--font-head);font-size:11px;letter-spacing:1.5px;text-transform:uppercase;cursor:pointer;display:flex;align-items:center;gap:8px;transition:var(--transition);white-space:nowrap;}
.export-btn:hover{border-color:var(--accent);color:var(--accent);background:var(--bg-card-hover);box-shadow:0 0 12px var(--accent-glow);}

/* ── TABLE SCROLL WRAPPER ── */
.table-scroll-wrap{flex:1;overflow-x:auto;overflow-y:auto;min-height:0;min-width:0;-webkit-overflow-scrolling:touch;padding:24px 32px;}
.table-scroll-wrap::-webkit-scrollbar{width:8px;height:8px;}
.table-scroll-wrap::-webkit-scrollbar-track{background:var(--bg-panel);}
.table-scroll-wrap::-webkit-scrollbar-thumb{background:rgba(0,200,255,0.35);border-radius:4px;}
.table-scroll-wrap::-webkit-scrollbar-thumb:hover{background:var(--accent);}
.table-scroll-wrap::-webkit-scrollbar-corner{background:var(--bg-panel);}

#main-content{flex:1;display:flex;flex-direction:column;min-height:0;min-width:0;overflow:hidden;}

/* ── GRID TABLE ── */
.ahu-table{width:auto;min-width:900px;max-width:100%;margin:0 auto;border-collapse:separate;border-spacing:0;font-family:var(--font-head);font-size:15px;border:2px solid var(--tbl-border);border-radius:12px;overflow:hidden;box-shadow:0 8px 32px rgba(0,0,0,0.4);}
.ahu-table thead{position:sticky;top:0;z-index:10;}
.ahu-table thead tr{background:var(--tbl-head-bg);}
.ahu-table thead th{padding:13px 18px;font-family:var(--font-head);font-size:12px;letter-spacing:2px;text-transform:uppercase;color:var(--accent);font-weight:normal;text-align:center;border-bottom:2px solid var(--tbl-border);border-right:1px solid var(--tbl-border);white-space:nowrap;background:var(--tbl-head-bg);position:relative;}
.ahu-table thead th:last-child{border-right:none;}
.ahu-table thead th:first-child{text-align:left;}
.ahu-table thead th.sortable{cursor:pointer;user-select:none;padding-right:30px;transition:background 0.15s,color 0.15s;}
.ahu-table thead th.sortable:hover{background:rgba(0,200,255,0.12);color:#fff;}
body.light-mode .ahu-table thead th.sortable:hover{background:rgba(220,20,60,0.10);}
.ahu-table thead th.sortable::after{content:'⇅';position:absolute;right:9px;top:50%;transform:translateY(-50%);font-size:12px;opacity:0.35;transition:opacity 0.15s;}
.ahu-table thead th.sortable:hover::after{opacity:0.75;}
.ahu-table thead th.sort-asc::after{content:'▲';opacity:1;color:var(--accent);}
.ahu-table thead th.sort-desc::after{content:'▼';opacity:1;color:var(--accent);}
.ahu-table tbody tr:nth-child(even){background:var(--tbl-row-even);}
.ahu-table tbody tr:nth-child(odd){background:var(--tbl-row-odd);}
.ahu-table tbody tr:hover{background:var(--tbl-row-hover)!important;}
.ahu-table td{padding:11px 18px;text-align:center;border-bottom:1px solid var(--tbl-border);border-right:1px solid var(--tbl-border);color:var(--text-primary);font-size:15px;vertical-align:middle;white-space:nowrap;transition:background-color 0.3s ease, box-shadow 0.3s ease;}
.ahu-table td:last-child{border-right:none;}
.ahu-table tbody tr:last-child td{border-bottom:none;}
.ahu-table td:first-child{text-align:left;}

/* ── ZONE TEMP STACK ── */
.zone-stack{display:flex;flex-direction:column;gap:4px;align-items:flex-start;padding:2px 0;}
.zone-item{font-family:var(--font-head);font-size:13px;white-space:nowrap;}

/* ── CELL ALARM STATE HIGHLIGHTS ── */
.cell-alarm{background-color:rgba(255,68,68,0.18)!important;color:#ff6b6b!important;font-weight:bold;box-shadow:inset 0 0 0 2px rgba(255,68,68,0.7);animation:cellAlarmPulse 1.8s ease-in-out infinite;position:relative;}
.cell-alarm::after{content:'⚠';position:absolute;top:3px;right:5px;font-size:9px;color:#ff4444;opacity:0.85;line-height:1;}
@keyframes cellAlarmPulse{0%,100%{box-shadow:inset 0 0 0 2px rgba(255,68,68,0.7),0 0 0 0 rgba(255,68,68,0);}50%{box-shadow:inset 0 0 0 2px rgba(255,68,68,1),0 0 8px 2px rgba(255,68,68,0.3);}}
.cell-override{background-color:rgba(147,51,234,0.18)!important;color:#c084fc!important;font-weight:bold;box-shadow:inset 0 0 0 2px rgba(147,51,234,0.6);position:relative;}
.cell-override::after{content:'↑';position:absolute;top:3px;right:5px;font-size:9px;color:#a855f7;opacity:0.85;font-weight:bold;line-height:1;}
.cell-fault{background-color:rgba(255,171,0,0.18)!important;color:#ffcf40!important;font-weight:bold;box-shadow:inset 0 0 0 2px rgba(255,171,0,0.65);animation:cellFaultPulse 2.4s ease-in-out infinite;position:relative;}
.cell-fault::after{content:'⛔';position:absolute;top:3px;right:5px;font-size:9px;opacity:0.85;line-height:1;}
@keyframes cellFaultPulse{0%,100%{box-shadow:inset 0 0 0 2px rgba(255,171,0,0.65),0 0 0 0 rgba(255,171,0,0);}50%{box-shadow:inset 0 0 0 2px rgba(255,171,0,1),0 0 8px 2px rgba(255,171,0,0.28);}}
body.light-mode .cell-alarm{background-color:rgba(220,38,38,0.12)!important;color:#b91c1c!important;box-shadow:inset 0 0 0 2px rgba(220,38,38,0.5);}
body.light-mode .cell-override{background-color:rgba(126,34,206,0.10)!important;color:#7e22ce!important;box-shadow:inset 0 0 0 2px rgba(126,34,206,0.4);}
body.light-mode .cell-fault{background-color:rgba(217,119,6,0.12)!important;color:#92400e!important;box-shadow:inset 0 0 0 2px rgba(217,119,6,0.5);}

/* ── OCCUPANCY (OCC_S) NAME HIGHLIGHT ── */
.ahu-name{position:relative;transition:background-color 0.3s ease, box-shadow 0.3s ease;}
.ahu-name.occ-active{background-color:var(--occ-active-bg)!important;box-shadow:inset 0 0 0 2px var(--occ-active-shadow);}
.ahu-name.occ-active a,.ahu-name.occ-active a:visited{color:var(--occ-active-text);text-shadow:none;}
.ahu-name.occ-active a:hover{color:#000;}
.ahu-name.occ-inactive{background-color:var(--occ-inactive-bg)!important;box-shadow:inset 0 0 0 2px var(--occ-inactive-shadow);}
.ahu-name.occ-inactive a,.ahu-name.occ-inactive a:visited{color:var(--occ-inactive-text);text-shadow:none;}
.ahu-name.occ-inactive a:hover{color:#fff;}
.occ-badge{display:block;font-size:9px;letter-spacing:1px;margin-top:2px;font-weight:bold;opacity:0.9;}

/* ── STATUS LEGEND ── */
.status-legend{display:flex;align-items:center;gap:20px;padding:9px 20px;background:var(--bg-panel);border-bottom:1px solid var(--border);flex-shrink:0;flex-wrap:wrap;}
.legend-item{display:flex;align-items:center;gap:7px;font-family:var(--font-head);font-size:12px;font-weight:bold;letter-spacing:1px;color:#ffffff;text-transform:uppercase;}
.legend-swatch{width:16px;height:16px;border-radius:3px;flex-shrink:0;}
.legend-swatch.alarm{background:rgba(255,68,68,0.25);box-shadow:inset 0 0 0 1.5px rgba(255,68,68,0.8);}
.legend-swatch.override{background:rgba(147,51,234,0.25);box-shadow:inset 0 0 0 1.5px rgba(147,51,234,0.8);}
.legend-swatch.fault{background:rgba(255,171,0,0.25);box-shadow:inset 0 0 0 1.5px rgba(255,171,0,0.8);}
.legend-swatch.occ-on{background:var(--occ-active-bg);box-shadow:inset 0 0 0 1.5px rgba(0,0,0,0.35);}
.legend-swatch.occ-off{background:var(--occ-inactive-bg);box-shadow:inset 0 0 0 1.5px rgba(0,0,0,0.35);}

/* ── NAME LINK ── */
.ahu-name{font-family:var(--font-head);font-size:15px;font-weight:bold;letter-spacing:0.5px;}
.ahu-name a{color:var(--accent);text-decoration:none;transition:var(--transition);font-weight:bold;}
.ahu-name a:hover{color:#fff;text-shadow:0 0 10px var(--accent);}
.ahu-name a:visited{color:var(--accent);}
body.light-mode .ahu-name a,body.light-mode .ahu-name a:visited{color:var(--accent);}
body.light-mode .ahu-name a:hover{color:#1a1e2a;text-shadow:none;}

/* ── VALUE STATES ── */
.value-loading{color:var(--text-muted);font-style:italic;font-size:13px;letter-spacing:1px;}
.value-error{color:var(--red);font-size:14px;font-weight:bold;}
.value-missing{color:var(--text-muted);font-size:13px;}
.value-normal{color:var(--text-primary);font-family:var(--font-head);font-size:15px;}
.value-active{color:var(--green);font-family:var(--font-head);font-weight:bold;font-size:15px;}
.value-inactive{color:#8a9ab5;font-family:var(--font-head);font-weight:bold;font-size:15px;}

/* ── BOTTOM BAR ── */
.bottom-bar{background:rgba(13,17,23,0.97);border-top:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;padding:0 20px;height:50px;flex-shrink:0;position:relative;}
body.light-mode .bottom-bar{background:rgba(255,255,255,0.97);box-shadow:0 -1px 12px rgba(0,0,0,0.06);}
.bottom-bar::before{content:'';position:absolute;top:0;left:0;right:0;height:1px;background:linear-gradient(90deg,transparent,var(--accent),transparent);}
.back-btn{background:none;border:1px solid var(--border);border-radius:6px;color:var(--text-muted);padding:6px 16px;cursor:pointer;font-size:13px;font-family:var(--font-head);letter-spacing:1px;display:flex;align-items:center;gap:8px;transition:var(--transition);}
.back-btn:hover{border-color:var(--accent);color:var(--accent);}
.datetime-display{font-family:var(--font-head);font-size:13px;color:var(--text-muted);letter-spacing:1px;}
.logoff-btn{background:none;border:1px solid var(--border);border-radius:6px;color:var(--text-muted);padding:6px 16px;cursor:pointer;font-size:13px;font-family:var(--font-head);letter-spacing:1px;display:flex;align-items:center;gap:8px;transition:var(--transition);}
.logoff-btn:hover{border-color:var(--red);color:var(--red);}
.loading-msg{text-align:center;padding:60px 20px;color:var(--text-muted);font-family:var(--font-head);font-size:13px;letter-spacing:2px;}
.error-msg{text-align:center;padding:60px 20px;color:var(--red);font-family:var(--font-head);font-size:13px;letter-spacing:1px;}
    </style>
</head>
<body>

<div class="overlay" id="overlay"></div>

<div class="side-panel" id="sidePanel">
  <div class="side-panel-header"><h2>NAV Sheet</h2><p>System Selection</p></div>
  <div class="nav-image-grid">
    <a href="../Home.html" class="nav-image-btn">
      <div class="nav-btn-icon"><svg viewBox="0 0 40 40" width="26" height="26"><polygon points="20,4 4,18 7,18 7,36 16,36 16,26 24,26 24,36 33,36 33,18 36,18" fill="none" stroke="var(--accent)" stroke-width="2.2" stroke-linejoin="round"/><rect x="16" y="26" width="8" height="10" fill="none" stroke="var(--accent)" stroke-width="2" rx="1"/></svg></div>
      <div class="nav-btn-text"><span class="nav-btn-label">Home</span><span class="nav-btn-sublabel">Main dashboard</span></div>
    </a>
    <a href="../FloorPlan.html" class="nav-image-btn">
      <div class="nav-btn-icon"><svg viewBox="0 0 40 40" width="26" height="26"><rect x="4" y="4" width="32" height="32" fill="none" stroke="var(--accent)" stroke-width="2" rx="1"/><line x1="4" y1="20" x2="22" y2="20" stroke="var(--accent)" stroke-width="1.8"/><line x1="22" y1="4" x2="22" y2="36" stroke="var(--accent)" stroke-width="1.8"/></svg></div>
      <div class="nav-btn-text"><span class="nav-btn-label">Floor Plan</span><span class="nav-btn-sublabel">Building layout</span></div>
    </a>
    <a href="../Alarms.html" class="nav-image-btn">
      <div class="nav-btn-icon"><svg viewBox="0 0 40 40" width="26" height="26"><polygon points="20,5 37,34 3,34" fill="rgba(255,171,0,0.12)" stroke="var(--amber)" stroke-width="2.2" stroke-linejoin="round"/><line x1="20" y1="15" x2="20" y2="25" stroke="var(--amber)" stroke-width="3" stroke-linecap="round"/><circle cx="20" cy="30" r="1.8" fill="var(--amber)"/></svg></div>
      <div class="nav-btn-text"><span class="nav-btn-label">Alarming</span><span class="nav-btn-sublabel">System alerts</span></div>
    </a>
    <a href="../Users.html" class="nav-image-btn">
      <div class="nav-btn-icon"><svg viewBox="0 0 40 40" width="26" height="26"><circle cx="15" cy="13" r="6" fill="none" stroke="var(--accent)" stroke-width="2"/><path d="M4,36 C4,26 26,26 26,36" fill="none" stroke="var(--accent)" stroke-width="2" stroke-linecap="round"/><line x1="28" y1="16" x2="38" y2="16" stroke="var(--accent)" stroke-width="2" stroke-linecap="round"/><line x1="28" y1="21" x2="36" y2="21" stroke="var(--accent)" stroke-width="2" stroke-linecap="round"/></svg></div>

<script>
// ── SORT ENGINE ──
const COL_NAME=0,COL_FAN=1,COL_DA_T=2,COL_MA_T=3,COL_RA_T=4,COL_ZONE=5,COL_CLG=6,COL_HTG=7;
let currentSortCol=null,currentSortDir=null;
const SORTABLE_COLS={[COL_NAME]:'th-name',[COL_DA_T]:'th-da-temp',[COL_CLG]:'th-clg',[COL_HTG]:'th-htg'};

function getNumericFromCell(td){const n=parseFloat(td.textContent.trim());return isNaN(n)?null:n;}

function sortTable(colIndex){
  const table=document.querySelector('.ahu-table');
  if(!table)return;
  const tbody=table.querySelector('tbody');
  const rows=Array.from(tbody.querySelectorAll('tr'));
  if(currentSortCol===colIndex){currentSortDir=currentSortDir==='desc'?'asc':'desc';}
  else{currentSortCol=colIndex;currentSortDir='desc';}
  rows.sort((a,b)=>{
    const ca=a.querySelectorAll('td')[colIndex],cb=b.querySelectorAll('td')[colIndex];
    if(!ca||!cb)return 0;
    if(colIndex===COL_NAME){const ta=ca.textContent.trim().toLowerCase(),tb=cb.textContent.trim().toLowerCase();return currentSortDir==='desc'?-ta.localeCompare(tb):ta.localeCompare(tb);}
    const na=getNumericFromCell(ca),nb=getNumericFromCell(cb);
    if(na===null&&nb===null)return 0;if(na===null)return 1;if(nb===null)return -1;
    return currentSortDir==='desc'?nb-na:na-nb;
  });
  rows.forEach(r=>tbody.appendChild(r));
  document.querySelectorAll('.ahu-table thead th.sortable').forEach(th=>th.classList.remove('sort-asc','sort-desc'));
  const id=SORTABLE_COLS[colIndex];
  if(id){const th=document.getElementById(id);if(th)th.classList.add(currentSortDir==='desc'?'sort-desc':'sort-asc');}
}
</script>

<script>
// ── AHU CORE ──
let pointValues={},allAHUPoints={},subscriber;
const resolvedPoints={};

// Exact point names to pull directly (single-value columns)
const DIRECT_POINT_NAMES=['DA_T','CLG_O','HTG_O','MA_T','RA_T','SF_S'];
// Occupancy point: not rendered as its own column, instead drives the
// AHU "Name" cell background color (bright green = occupied, gray = unoccupied).
const OCC_POINT_NAME='OCC_S';
// Any point matching ZN...(letter/number)..._T is a zone temp, stacked in one cell
const ZONE_TEMP_REGEX=/^ZN[A-Za-z0-9]*_T$/i;
// Trailing "_N" folder-suffix stripped from AHU names so folders that represent
// the same physical unit (e.g. AHU_10A_1, AHU_10A_2) are grouped together.
const AHU_FOLDER_SUFFIX_REGEX=/_(\d+)$/;

function shouldExcludeAHU(ahuName){
  const excludePatterns=[/SF/i,/RF/i,/EF/i,/\bFAN\b/i,/EXHAUST/i,/RETURN/i,/VFD/i];
  const isExcluded=excludePatterns.some(p=>p.test(ahuName));
  if(isExcluded)console.log(`Excluding ${ahuName} - matches fan/exhaust/return pattern`);
  return isExcluded;
}

function getAHUBaseName(rawName){
  const match = rawName.match(/^(AHU_\d+[A-Za-z]?)_(\d+)$/i);
  return match ? match[1] : rawName;
}
function getZoneLabel(pointName){const m=pointName.match(/^ZN(.*)_T$/i);return m&&m[1]?m[1].toUpperCase():pointName;}

function getDesiredAHUPoints(connectedPoints){
  const desired={};
  const znPoints=[];
  connectedPoints.forEach(p=>{
    if(!p.name)return;
    if(DIRECT_POINT_NAMES.includes(p.name)){
      desired[p.name]=p;
    }else if(p.name===OCC_POINT_NAME){
      desired[p.name]=p;
    }else if(ZONE_TEMP_REGEX.test(p.name)){
      znPoints.push(p);
    }
  });
  znPoints.sort((a,b)=>a.name.localeCompare(b.name));
  return{desired,znPoints};
}

function mergeAHUEntry(target,source){
  Object.keys(source.desired).forEach(pid=>{
    if(!target.desired[pid])target.desired[pid]=source.desired[pid];
  });
  source.znPoints.forEach(p=>{
    const dup=target.znPoints.some(tp=>tp.name===p.name&&tp.fullPath===p.fullPath);
    if(!dup)target.znPoints.push(p);
  });
}

function formatPointValue(value,pointId){
  if(value===null||value===undefined||value==='N/A'||value==='Connection Error')return value==='Connection Error'?'Connection Error':'N/A';
  if(typeof value==='string'&&value.startsWith('NO_'))return value;
  if(pointId==='SF_S')return value?'Fan ON':'Fan OFF';
  if(pointId==='CLG_O'||pointId==='HTG_O')return Math.round(value)+'%';
  if(typeof value==='number')return value.toFixed(1)+'°F';
  return value.toString();
}

function getValueClass(value,pointId){
  if(value===null||value===undefined||value==='N/A'||value==='Connection Error')return'value-error';
  if(typeof value==='string'&&value.startsWith('NO_'))return'value-missing';
  if(pointId==='SF_S')return value?'value-active':'value-inactive';
  return'value-normal';
}

function applyPointStatusHighlight(ahuName,pointId,point){
  const cell=document.getElementById(`point-${ahuName}-${pointId}`);
  if(!cell)return;
  let raw='';
  try{const status=point.getOut().getStatus();raw=status?status.toString().toLowerCase():'';}catch(e){raw='';}
  cell.classList.remove('cell-alarm','cell-override','cell-fault');
  cell.removeAttribute('title');
  if(raw.includes('alarm')||raw.includes('offnormal')||raw.includes('unackedalarm')||raw.includes('unacked')){
    cell.classList.add('cell-alarm');cell.title='STATUS: '+raw.toUpperCase();return;
  }
  if((raw.includes('fault')&&raw.includes('down'))||raw.includes('stale')||raw.includes('fault')||raw.includes('down')){
    cell.classList.add('cell-fault');cell.title='STATUS: '+raw.toUpperCase();return;
  }
  if(raw.includes('overridden')){
    cell.classList.add('cell-override');cell.title='STATUS: OVERRIDDEN';return;
  }
}

// ── OCCUPANCY NAME-CELL HIGHLIGHT ──
// Reads the OCC_S boolean point's live value AND its configured Facets
// (trueText / falseText, e.g. "Occupied" / "Unoccupied") so the badge text
// always matches whatever labels are configured on the point in Niagara.
function applyOccupancyState(ahuName,point){
  const cell=document.getElementById(`ahu-name-${ahuName}`);
  const badge=document.getElementById(`occ-badge-${ahuName}`);
  if(!cell)return;
  let val=null,trueText='OCCUPIED',falseText='UNOCCUPIED';
  try{
    const out=point.getOut();
    val=out.getValue();
    const facets=(out.getFacets&&out.getFacets())||(point.getFacets&&point.getFacets());
    if(facets&&facets.get){
      const tt=facets.get('trueText');
      const ft=facets.get('falseText');
      if(tt)trueText=tt.toString().toUpperCase();
      if(ft)falseText=ft.toString().toUpperCase();
    }
  }catch(e){/* keep defaults */}
  cell.classList.remove('occ-active','occ-inactive');
  if(val===true){
    cell.classList.add('occ-active');
    cell.title='OCC_S: '+trueText;
    if(badge)badge.textContent='● '+trueText;
  }else if(val===false){
    cell.classList.add('occ-inactive');
    cell.title='OCC_S: '+falseText;
    if(badge)badge.textContent='● '+falseText;
  }else{
    cell.removeAttribute('title');
    if(badge)badge.textContent='';
  }
  if(!pointValues[ahuName])pointValues[ahuName]={};
  pointValues[ahuName][OCC_POINT_NAME]=val;
}

function clearOccupancyState(ahuName){
  const cell=document.getElementById(`ahu-name-${ahuName}`);
  const badge=document.getElementById(`occ-badge-${ahuName}`);
  if(cell){cell.classList.remove('occ-active','occ-inactive');cell.removeAttribute('title');}
  if(badge)badge.textContent='';
}

function updatePointValue(ahuName,pointId,value){
  const el=document.getElementById(`point-${ahuName}-${pointId}`);
  if(el){
    const formatted=formatPointValue(value,pointId);
    const cls=getValueClass(value,pointId);
    if(ZONE_TEMP_REGEX.test(pointId)){
      el.textContent=`${getZoneLabel(pointId)}: ${formatted}`;
      el.className='zone-item '+cls;
    }else{
      el.textContent=formatted;
      el.className=cls;
    }
    if(resolvedPoints[ahuName]&&resolvedPoints[ahuName][pointId]){
      applyPointStatusHighlight(ahuName,pointId,resolvedPoints[ahuName][pointId]);
    }
    if(!pointValues[ahuName])pointValues[ahuName]={};
    pointValues[ahuName][pointId]=value;
  }
}

try{require(['baja!'],function(baja){
  subscriber=new baja.Subscriber();
  subscriber.attach('changed',function(prop){
    if(prop.getName()==='out'){
      const pi=this.userData;
      if(pi){
        if(pi.pointId===OCC_POINT_NAME){
          applyOccupancyState(pi.ahuName,this);
        }else{
          const out=this.getOut();
          updatePointValue(pi.ahuName,pi.pointId,out.getValue());
          applyPointStatusHighlight(pi.ahuName,pi.pointId,this);
        }
      }
    }
  });
});}
catch(e){console.error('Failed to initialize subscriber:',e);}

function subscribeToPoint(ahuName,pointId,pointPath){
  console.log(`Subscribing to: ${pointPath}`);
  try{require(['baja!'],function(baja){try{
    const p=baja.Ord.make(pointPath).get({subscriber:subscriber});
    p.catch(err=>{
      console.error(`❌ Failed to connect to ${pointId} (${pointPath}):`,err);
      if(pointId===OCC_POINT_NAME){clearOccupancyState(ahuName);}
      else{updatePointValue(ahuName,pointId,'Connection Error');}
    });
    p.then(point=>{
      console.log(`✅ Successfully connected to ${pointId}: ${pointPath}`);
      point.userData={ahuName,pointId,pointPath};
      if(!resolvedPoints[ahuName])resolvedPoints[ahuName]={};
      resolvedPoints[ahuName][pointId]=point;
      if(pointId===OCC_POINT_NAME){
        applyOccupancyState(ahuName,point);
      }else{
        const out=point.getOut();
        updatePointValue(ahuName,pointId,out.getValue());
        applyPointStatusHighlight(ahuName,pointId,point);
      }
    });
  }catch(ie){
    if(pointId===OCC_POINT_NAME){clearOccupancyState(ahuName);}
    else{updatePointValue(ahuName,pointId,'N/A');}
  }});}
  catch(e){
    console.error(`Failed to subscribe to ${pointPath}:`,e);
    if(pointId===OCC_POINT_NAME){clearOccupancyState(ahuName);}
    else{updatePointValue(ahuName,pointId,'Connection Error');}
  }
}

function createAHUDisplay(ahuData){
  const mc=document.getElementById('main-content');
  if(Object.keys(ahuData).length===0){mc.innerHTML='<div class="error-msg">No AHU configurations found in JSON file.</div>';return;}

  const legendHTML=`<div class="status-legend">
    <span style="font-family:var(--font-head);font-size:11px;font-weight:bold;letter-spacing:2px;color:#ffffff;text-transform:uppercase;margin-right:4px;">Legend:</span>
    <span class="legend-item"><span class="legend-swatch alarm"></span><span>⚠ In Alarm</span></span>
    <span class="legend-item"><span class="legend-swatch fault"></span><span>⛔ Fault / Down</span></span>
    <span class="legend-item"><span class="legend-swatch override"></span><span>↑ Overridden</span></span>
    <span class="legend-item"><span class="legend-swatch occ-on"></span><span>● Occupied (Name)</span></span>
    <span class="legend-item"><span class="legend-swatch occ-off"></span><span>● Unoccupied (Name)</span></span>
  </div>`;

  let html=`${legendHTML}<div class="table-scroll-wrap"><table class="ahu-table">
    <thead><tr>
      <th id="th-name" class="sortable" onclick="sortTable(${COL_NAME})">Name</th>
      <th>Fan Status</th>
      <th id="th-da-temp" class="sortable" onclick="sortTable(${COL_DA_T})">DA Temp</th>
      <th>MA Temp</th>
      <th>RA Temp</th>
      <th>Zone Temp(s)</th>
      <th id="th-clg" class="sortable" onclick="sortTable(${COL_CLG})">Cooling Valve</th>
      <th id="th-htg" class="sortable" onclick="sortTable(${COL_HTG})">Heating Valve</th>
    </tr></thead><tbody>`;

  const sortedAHUNames=Object.keys(ahuData).sort((a,b)=>{
    const numA=parseInt((a.match(/\d+/)||[])[0]);
    const numB=parseInt((b.match(/\d+/)||[])[0]);
    if(!isNaN(numA)&&!isNaN(numB))return numA-numB;
    if(!isNaN(numA)&&isNaN(numB))return 1;
    if(isNaN(numA)&&!isNaN(numB))return -1;
    return a.localeCompare(b);
  });

  sortedAHUNames.forEach(ahuName=>{
    const ahuLink=`../AHUs/AHU.html?unit=${encodeURIComponent(ahuName)}`;
    const{znPoints}=ahuData[ahuName];
    let zoneHtml;
    if(znPoints.length>0){
      zoneHtml='<div class="zone-stack">'+znPoints.map(p=>`<div class="zone-item value-loading" id="point-${ahuName}-${p.name}">${getZoneLabel(p.name)}: Loading...</div>`).join('')+'</div>';
    }else{
      zoneHtml='<span class="value-missing">NO_Zone</span>';
    }
    html+=`<tr>
      <td class="ahu-name" id="ahu-name-${ahuName}"><a href="${ahuLink}">${ahuName}</a><span class="occ-badge" id="occ-badge-${ahuName}"></span></td>
      <td id="point-${ahuName}-SF_S" class="value-loading">Loading...</td>
      <td id="point-${ahuName}-DA_T" class="value-loading">Loading...</td>
      <td id="point-${ahuName}-MA_T" class="value-loading">Loading...</td>
      <td id="point-${ahuName}-RA_T" class="value-loading">Loading...</td>
      <td id="zone-cell-${ahuName}">${zoneHtml}</td>
      <td id="point-${ahuName}-CLG_O" class="value-loading">Loading...</td>
      <td id="point-${ahuName}-HTG_O" class="value-loading">Loading...</td>
    </tr>`;
  });
  html+=`</tbody></table></div>`;
  mc.innerHTML=html;

  sortedAHUNames.forEach(ahuName=>{
    const{desired,znPoints}=ahuData[ahuName];
    const missingNames={SF_S:'NO_Fan',DA_T:'NO_DA_Temp',MA_T:'NO_MA_Temp',RA_T:'NO_RA_Temp',CLG_O:'NO_Cooling',HTG_O:'NO_Heating'};
    DIRECT_POINT_NAMES.forEach(pid=>{
      const pt=desired[pid];
      if(pt&&pt.status==='connected'&&pt.fullPath){
        subscribeToPoint(ahuName,pid,pt.fullPath);
      }else{
        console.warn(`Point ${pid} not found or not connected for AHU ${ahuName}`);
        updatePointValue(ahuName,pid,missingNames[pid]||'N/A');
      }
    });
    const occPt=desired[OCC_POINT_NAME];
    if(occPt&&occPt.status==='connected'&&occPt.fullPath){
      subscribeToPoint(ahuName,OCC_POINT_NAME,occPt.fullPath);
    }else{
      console.warn(`Point ${OCC_POINT_NAME} not found or not connected for AHU ${ahuName}`);
      clearOccupancyState(ahuName);
    }
    znPoints.forEach(p=>{
      if(p.fullPath)subscribeToPoint(ahuName,p.name,p.fullPath);
    });
  });
}

async function loadAndDisplayAHUPoints(){
  try{
    console.log('=== LOADING AHU POINTS FROM JSON (name-based scan) ===');
    const response=await fetch('../Global.json');
    if(!response.ok)throw new Error(`Failed to load JSON: ${response.status} ${response.statusText}`);
    const jsonData=await response.json();
    console.log('JSON data loaded:',jsonData);

    const ahuConfigs={};
    Object.keys(jsonData.globalVariables).forEach(key=>{
      if(key.toLowerCase().startsWith('ahu_')||key.toLowerCase().includes('ahu')){
        if(shouldExcludeAHU(key)){console.log(`Skipping ${key} - fan/exhaust/return equipment`);return;}
        const baseName=getAHUBaseName(key);
        console.log(`Found AHU configuration: ${key} -> grouped as ${baseName}`);
        const allPoints=jsonData.globalVariables[key].points||[];
        const connectedPoints=allPoints.filter(p=>p.status==='connected');
        const{desired,znPoints}=getDesiredAHUPoints(connectedPoints);
        if(Object.keys(desired).length>0||znPoints.length>0){
          if(!ahuConfigs[baseName])ahuConfigs[baseName]={desired:{},znPoints:[]};
          mergeAHUEntry(ahuConfigs[baseName],{desired,znPoints});
        }
      }
    });
    Object.values(ahuConfigs).forEach(cfg=>cfg.znPoints.sort((a,b)=>a.name.localeCompare(b.name)));

    allAHUPoints=ahuConfigs;
    console.log('Filtered AHU configurations:',ahuConfigs);
    console.log('=== AHU POINT LOADING COMPLETE ===');
    createAHUDisplay(ahuConfigs);
  }catch(error){
    console.error('Error loading AHU points from JSON:',error);
    document.getElementById('main-content').innerHTML=`<div class="error-msg">Error loading AHU data: ${error.message}</div>`;
  }
}

function cleanup(){if(subscriber){subscriber.unsubscribeAll();console.log('🧹 Cleaned up all subscriptions');}}
window.addEventListener('beforeunload',cleanup);
loadAndDisplayAHUPoints();
</script>

<script>
// ── HISTORY EXPORT ──
let ahuExportHistoryCache=new Map();

async function discoverAHUHistoryOrd(pointOrd){
  return new Promise((resolve,reject)=>{
    try{require(['baja!'],function(baja){
      baja.Ord.make(pointOrd).get()
        .then(entity=>entity.tags())
        .then(tagMap=>{
          const historyTag=tagMap.get('n:history');
          if(historyTag&&historyTag.toString().trim()!==''){
            let historyPath=historyTag.toString();
            if(!historyPath.startsWith('history:'))historyPath='history:'+historyPath;
            resolve(historyPath);
          }else{reject(new Error('No n:history tag found on point: '+pointOrd));}
        })
        .catch(err=>reject(new Error('Failed to load point tags: '+err.message)));
    });}catch(error){reject(error);}
  });
}

async function loadAHUHistoryData(pointPath,startTime,endTime,maxPoints=1000){
  return new Promise(async(resolve,reject)=>{
    try{
      let historyOrd=ahuExportHistoryCache.get(pointPath);
      if(!historyOrd){
        try{historyOrd=await discoverAHUHistoryOrd(pointPath);ahuExportHistoryCache.set(pointPath,historyOrd);}
        catch(error){console.warn(`No history found for point ${pointPath}:`,error.message);resolve([]);return;}
      }
      require(['baja!'],function(baja){
        const timeCondition=`timestamp >= '${startTime.toISOString()}' and timestamp <= '${endTime.toISOString()}'`;
        const bqlQuery=historyOrd+'|bql:select timestamp, value where '+timeCondition+' order by timestamp';
        const dataPoints=[];
        baja.Ord.make(bqlQuery).get({cursor:{limit:maxPoints,each:function(){
          const row=this.get();
          const rawTimestamp=row.get("timestamp");
          const value=row.get("value");
          const date=new Date(rawTimestamp.getMillis());
          dataPoints.push({timestamp:date,timestampString:date.toLocaleString(),value:value});
        }}}).then(()=>resolve(dataPoints)).catch(err=>reject(new Error('Failed to load history data: '+err.message)));
      });
    }catch(error){reject(error);}
  });
}

function getAllAHUPointPaths(){
  const paths=[];
  Object.keys(allAHUPoints).forEach(ahuName=>{
    const{desired,znPoints}=allAHUPoints[ahuName];
    DIRECT_POINT_NAMES.forEach(pid=>{
      const pt=desired[pid];
      if(pt&&pt.status==='connected'&&pt.fullPath){
        paths.push({name:`${ahuName}_${pid}`,ahuName,pointId:pid,path:pt.fullPath});
      }
    });
    const occPt=desired[OCC_POINT_NAME];
    if(occPt&&occPt.status==='connected'&&occPt.fullPath){
      paths.push({name:`${ahuName}_${OCC_POINT_NAME}`,ahuName,pointId:OCC_POINT_NAME,path:occPt.fullPath});
    }
    znPoints.forEach(p=>{
      if(p.fullPath)paths.push({name:`${ahuName}_${p.name}`,ahuName,pointId:p.name,path:p.fullPath});
    });
  });
  return paths;
}

const AHU_POINT_META={
  'DA_T':{label:'Discharge Air Temp',unit:'°F'},
  'MA_T':{label:'Mixed Air Temp',unit:'°F'},
  'RA_T':{label:'Return Air Temp',unit:'°F'},
  'CLG_O':{label:'Cooling Valve',unit:'%'},
  'HTG_O':{label:'Heating Valve',unit:'%'},
  'SF_S':{label:'Supply Fan Status',unit:''},
  'OCC_S':{label:'Occupancy Status',unit:''},
};
function getAHUPointMeta(pointId){
  if(AHU_POINT_META[pointId])return AHU_POINT_META[pointId];
  if(ZONE_TEMP_REGEX.test(pointId))return{label:`Zone Temp (${getZoneLabel(pointId)})`,unit:'°F'};
  return{label:pointId,unit:''};
}

async function exportAHUHistoryToCSV(){
  const mc=document.getElementById('main-content'),oc=mc.innerHTML;
  mc.innerHTML='<div class="loading-msg">Loading historical data for CSV export</div>';
  try{
    const sd=new Date(document.getElementById('ahu-start-datetime').value);
    const ed=new Date(document.getElementById('ahu-end-datetime').value);
    const ap=getAllAHUPointPaths();
    if(!ap.length){mc.innerHTML=oc;alert('No data points available to export');return;}
    const ahd=await Promise.all(ap.map(p=>loadAHUHistoryData(p.path,sd,ed,1000).then(data=>({pointName:p.name,data}))));
    const tm=new Map();
    ahd.forEach(ph=>ph.data.forEach(r=>{const ts=r.timestampString;if(!tm.has(ts))tm.set(ts,{timestamp:ts});tm.get(ts)[ph.pointName]=r.value;}));
    const sortedData=Array.from(tm.values()).sort((a,b)=>new Date(a.timestamp)-new Date(b.timestamp));
    if(!sortedData.length){mc.innerHTML=oc;alert('No historical data found for the selected time range');return;}
    let csv=['Timestamp',...ap.map(p=>p.name)].join(',')+'\n';
    sortedData.forEach(row=>{
      const st=`"${row.timestamp.replace(/"/g,'""')}"`;
      csv+=[st,...ap.map(p=>{const v=row[p.name];if(v===undefined||v===null)return'';const s=String(v);return(s.includes(',')||s.includes('"'))?`"${s.replace(/"/g,'""')}"`:s;})].join(',')+'\n';
    });
    const blob=new Blob([csv],{type:'text/csv;charset=utf-8;'}),link=document.createElement('a'),url=URL.createObjectURL(blob);
    link.setAttribute('href',url);
    link.setAttribute('download',`AHU_History_${sd.toISOString().slice(0,10)}_to_${ed.toISOString().slice(0,10)}.csv`);
    link.style.visibility='hidden';document.body.appendChild(link);link.click();document.body.removeChild(link);URL.revokeObjectURL(url);
    mc.innerHTML=oc;
    alert(`CSV exported successfully: ${sortedData.length} readings`);
  }catch(error){console.error('Error exporting CSV:',error);mc.innerHTML=oc;alert('Failed to export CSV: '+error.message);}
}

function buildAHUSVGChart(data,label,unit,width,height){
  width=width||860;height=height||200;
  const pad={top:32,right:24,bottom:44,left:68};
  const gW=width-pad.left-pad.right;
  const gH=height-pad.top-pad.bottom;
  const rawVals=data.map(d=>typeof d.value==='boolean'?(d.value?1:0):parseFloat(d.value)).filter(v=>!isNaN(v));
  if(!rawVals.length){
    return `<svg width="${width}" height="60" xmlns="http://www.w3.org/2000/svg"><text x="${width/2}" y="36" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" fill="#999">No numeric data available</text></svg>`;
  }
  const minV=Math.min(...rawVals),maxV=Math.max(...rawVals),rangeV=maxV-minV||1;
  const times=data.map(d=>d.timestamp.getTime());
  const minT=Math.min(...times),maxT=Math.max(...times),rangeT=maxT-minT||1;
  const xOf=t=>pad.left+((t-minT)/rangeT)*gW;
  const yOf=v=>pad.top+gH-((v-minV)/rangeV)*gH;
  const pts=data.map((d,i)=>{const v=typeof d.value==='boolean'?(d.value?1:0):parseFloat(d.value);if(isNaN(v))return null;return `${xOf(times[i]).toFixed(1)},${yOf(v).toFixed(1)}`;}).filter(Boolean).join(' ');
  let yTicks='';
  for(let i=0;i<=4;i++){const v=minV+(rangeV/4)*i;const y=yOf(v);yTicks+=`<line x1="${pad.left}" y1="${y.toFixed(1)}" x2="${pad.left+gW}" y2="${y.toFixed(1)}" stroke="#dde3ee" stroke-width="0.8"/><text x="${(pad.left-6).toFixed(1)}" y="${(y+4).toFixed(1)}" text-anchor="end" font-family="Arial,sans-serif" font-size="9" fill="#556">${v.toFixed(1)}</text>`;}
  let xTicks='';
  for(let i=0;i<=4;i++){const t=minT+(rangeT/4)*i;const x=xOf(t);const lbl=new Date(t).toLocaleString([],{month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit'});xTicks+=`<text x="${x.toFixed(1)}" y="${(pad.top+gH+30).toFixed(1)}" text-anchor="middle" font-family="Arial,sans-serif" font-size="8" fill="#556">${lbl}</text>`;}
  const avg=(rawVals.reduce((a,b)=>a+b,0)/rawVals.length).toFixed(2);
  const u=unit?` ${unit}`:'';
  const avgY=yOf(parseFloat(avg));
  return `<svg width="${width}" height="${height}" xmlns="http://www.w3.org/2000/svg" style="overflow:visible;display:block;">
    <rect x="${pad.left}" y="${pad.top}" width="${gW}" height="${gH}" fill="#f7f9ff" stroke="#c8d4ee" stroke-width="0.8" rx="2"/>
    <text x="${width/2}" y="20" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" font-weight="bold" fill="#003580">${label}</text>
    <text x="${pad.left-8}" y="${pad.top-6}" text-anchor="middle" font-family="Arial,sans-serif" font-size="9" fill="#888">${u}</text>
    ${yTicks}
    ${xTicks}
    <line x1="${pad.left}" y1="${avgY.toFixed(1)}" x2="${pad.left+gW}" y2="${avgY.toFixed(1)}" stroke="#ffab00" stroke-width="1.2" stroke-dasharray="5,3"/>
    <text x="${(pad.left+gW+4).toFixed(1)}" y="${(avgY+4).toFixed(1)}" font-family="Arial,sans-serif" font-size="8" fill="#c07000">avg</text>
    <polyline points="${pts}" fill="none" stroke="#003580" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round"/>
    <line x1="${pad.left}" y1="${pad.top}" x2="${pad.left}" y2="${pad.top+gH}" stroke="#8899cc" stroke-width="1.2"/>
    <line x1="${pad.left}" y1="${pad.top+gH}" x2="${pad.left+gW}" y2="${pad.top+gH}" stroke="#8899cc" stroke-width="1.2"/>
    <text x="${pad.left+gW}" y="${pad.top-6}" text-anchor="end" font-family="Arial,sans-serif" font-size="9" fill="#556">
      Min: ${rawVals.length?Math.min(...rawVals).toFixed(2):'—'}${u}  Avg: ${avg}${u}  Max: ${rawVals.length?Math.max(...rawVals).toFixed(2):'—'}${u}  n=${rawVals.length}
    </text>
  </svg>`;
}

function buildAHUTimestampTable(data,unit){
  if(!data.length)return `<p style="color:#999;font-size:8pt;font-family:Arial,sans-serif;padding:6px 0;">No records in this range.</p>`;
  const u=unit?` ${unit}`:'';
  let rows='';
  data.forEach((d,i)=>{
    const bg=i%2===0?'#f4f6ff':'#ffffff';
    let v;
    if(typeof d.value==='boolean'){v=d.value?'ON':'OFF';}
    else{const f=parseFloat(d.value);v=isNaN(f)?String(d.value):f.toFixed(2)+u;}
    rows+=`<tr style="background:${bg}"><td style="padding:3px 8px;border:1px solid #dde;font-size:8pt;">${d.timestampString}</td><td style="padding:3px 8px;border:1px solid #dde;font-size:8pt;text-align:right;font-weight:bold;font-family:monospace;">${v}</td></tr>`;
  });
  return `<table style="width:100%;border-collapse:collapse;margin-top:4px;">
    <thead><tr style="background:#003580;color:#fff;"><th style="padding:5px 8px;text-align:left;font-size:8pt;font-weight:normal;letter-spacing:.5px;">Timestamp</th><th style="padding:5px 8px;text-align:right;font-size:8pt;font-weight:normal;letter-spacing:.5px;">Value${u?' ('+unit+')':''}</th></tr></thead>
    <tbody>${rows}</tbody>
  </table>`;
}

async function generateAHUHistoryPDFReport(){
  const mc=document.getElementById('main-content'),oc=mc.innerHTML;
  mc.innerHTML='<div class="loading-msg">Loading historical data for PDF report</div>';
  try{
    const sd=new Date(document.getElementById('ahu-start-datetime').value);
    const ed=new Date(document.getElementById('ahu-end-datetime').value);
    const ap=getAllAHUPointPaths();
    if(!ap.length){mc.innerHTML=oc;alert('No data points available to export');return;}

    const ahd=await Promise.all(ap.map(p=>loadAHUHistoryData(p.path,sd,ed,2000).then(data=>({...p,data})).catch(()=>({...p,data:[]}))));

    const ahuGroups={};
    ahd.forEach(ph=>{if(!ahuGroups[ph.ahuName])ahuGroups[ph.ahuName]=[];ahuGroups[ph.ahuName].push(ph);});

    const sortedAHUs=Object.keys(ahuGroups).sort((a,b)=>{
      const na=parseInt((a.match(/(\d+)/)||[0,0])[1],10);

    const reportDate=new Date().toLocaleString();

    sortedAHUs.forEach(an=>{

      pts.forEach((pt,i)=>{
        const meta=getAHUPointMeta(pt.pointId);
        const u=meta.unit;
        const bg=i%2===0?'#f5f7ff':'#ffffff';
        const vals=pt.data.map(d=>typeof d.value==='boolean'?(d.value?1:0):parseFloat(d.value)).filter(v=>!isNaN(v));
        if(!vals.length){
          summaryHTML+=`<tr style="background:${bg}"><td>${meta.label}</td><td colspan="5" style="text-align:center;color:#999;">No numeric data (${pt.data.length} records)</td></tr>`;

          const latest=pt.data.length?pt.data[pt.data.length-1].value:null;
          let lv='N/A';
          if(latest!==null){
            if(typeof latest==='boolean')lv=latest?'ON':'OFF';
            else{const f=parseFloat(latest);lv=isNaN(f)?String(latest):f.toFixed(2)+(u?' '+u:'');}
          }
          summaryHTML+=`<tr style="background:${bg}"><td style="font-weight:500;">${meta.label}</td><td><strong>${lv}</strong></td><td>${min.toFixed(2)}${u?' '+u:''}</td><td>${avg}${u?' '+u:''}</td><td>${max.toFixed(2)}${u?' '+u:''}</td><td style="text-align:center;">${vals.length}</td></tr>`;
        }
      });
      summaryHTML+=`</tbody></table>`;
    });
    summaryHTML+=`</div>`;

    let detailHTML=`<div class="section page-break"><h2>Per-Point Charts &amp; Historical Data</h2><p class="sub-note">Each point shows an inline trend chart followed by the full timestamped log for the selected range.</p>`;
    sortedAHUs.forEach(an=>{
      const pts=ahuGroups[an];
      detailHTML+=`<div class="ahu-block"><h3>${an}</h3>`;
      pts.forEach(pt=>{
        const meta=getAHUPointMeta(pt.pointId);
        const chart=buildAHUSVGChart(pt.data,`${an} — ${meta.label}`,meta.unit,860,200);
        const table=buildAHUTimestampTable(pt.data,meta.unit);
        detailHTML+=`<div class="point-block"><h4>${meta.label} <span class="rec-count">(${pt.data.length} records)</span></h4><div class="chart-wrap">${chart}</div><details><summary>▶ Show all ${pt.data.length} timestamp records</summary><div class="table-scroll">${table}</div></details></div>`;
      });
      detailHTML+=`</div>`;
    });
    detailHTML+=`</div>`;

    const pdfHTML=`<!DOCTYPE html>
<html><head>
<meta charset="UTF-8">

<style>

</style>
</head>
<body>

</div>

function createAHUExportControls(){
  const mc=document.getElementById('main-content');if(!mc)return;
  const cd=document.createElement('div');cd.id='ahu-export-controls';
  const now=new Date(),yd=new Date(now.getTime()-86400000);
  const si=document.createElement('input');si.type='datetime-local';si.id='ahu-start-datetime';si.value=yd.toISOString().slice(0,16);
  const ei=document.createElement('input');ei.type='datetime-local';ei.id='ahu-end-datetime';ei.value=now.toISOString().slice(0,16);
  const cb=document.createElement('button');cb.className='export-btn';cb.innerHTML='📊 Export CSV';cb.onclick=exportAHUHistoryToCSV;

}
