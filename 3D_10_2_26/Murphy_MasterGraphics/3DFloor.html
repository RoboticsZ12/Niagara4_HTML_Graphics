<!DOCTYPE html>
<!-- @noSnoop -->
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Murphy Control — 3D Building</title>
<!-- Niagara/Baja loader (needed for live point values; harmless if absent) -->
<script src="/requirejs/config.js"></script>
<script src="/module/js/com/tridium/js/ext/require/require.min.js?"></script>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --bg:#080d14; --surface:#0d1520; --surface-2:#111c2b; --border:rgba(0,180,255,.12); --border-hover:rgba(0,180,255,.45);
  --accent:#04d9ff; --accent-dim:rgba(0,180,255,.18); --amber:#ffae00; --red:#ff4444; --green:#66ff00;
  --text:#c8d8ea; --text-dim:#5a7080; --font-ui:'Rajdhani','Segoe UI',sans-serif; --font-mono:'Share Tech Mono',Consolas,monospace;
  --top-h:54px; --bot-h:44px;
}
body.light-mode {
  --bg:#eef2f7; --surface:#fff; --surface-2:#f4f7fc; --border:rgba(0,100,180,.18); --border-hover:rgba(0,100,180,.5);
  --text:#1a2535; --text-dim:#4a6070; --accent:#0060c0; --accent-dim:rgba(0,112,204,.12); --amber:#ff8800;
}
html, body { height:100%; }
body { font-family:var(--font-ui); background:var(--bg); color:var(--text); overflow:hidden; }
.top-bar, .bottom-bar { position:fixed; left:0; right:0; z-index:50; background:rgba(8,13,20,.92); border:0 solid var(--border); display:flex; align-items:center; justify-content:space-between; padding:0 20px; }
body.light-mode .top-bar, body.light-mode .bottom-bar { background:rgba(238,242,247,.95); }
.top-bar { top:0; height:var(--top-h); border-bottom-width:1px; }
.bottom-bar { bottom:0; height:var(--bot-h); border-top-width:1px; }
.top-center { position:absolute; left:50%; transform:translateX(-50%); text-align:center; pointer-events:none; }
.site-label { display:block; font-size:.72rem; font-weight:600; letter-spacing:.28em; text-transform:uppercase; color:var(--accent); }
.page-title { display:block; font-size:.82rem; font-weight:500; letter-spacing:.18em; text-transform:uppercase; color:var(--text-dim); }
.btn { background:none; border:1px solid var(--border); color:var(--text-dim); font-family:var(--font-ui); font-size:.78rem; font-weight:600; letter-spacing:.1em; text-transform:uppercase; padding:5px 14px; border-radius:5px; cursor:pointer; transition:border-color .2s,color .2s,background .2s; }
.btn:hover, .btn:focus-visible { border-color:var(--accent); color:var(--accent); background:var(--accent-dim); outline:none; }
.btn.on { border-color:var(--amber); color:var(--amber); background:rgba(255,171,0,.08); }
.tools { display:flex; gap:8px; }
.datetime { font-family:var(--font-mono); font-size:.68rem; color:var(--text-dim); letter-spacing:.08em; }
#stage { position:fixed; top:var(--top-h); bottom:var(--bot-h); left:0; right:0;
  background: radial-gradient(ellipse at 50% 45%, rgba(0,180,255,.09) 0%, transparent 60%),
    linear-gradient(rgba(0,180,255,.035) 1px, transparent 1px) 0 0/40px 40px,
    linear-gradient(90deg, rgba(0,180,255,.035) 1px, transparent 1px) 0 0/40px 40px,
    linear-gradient(135deg,#060d1a 0%,#0a1628 50%,#06111e 100%); cursor:grab; }
body.light-mode #stage { background: radial-gradient(ellipse at 50% 45%, rgba(0,100,180,.08) 0%, transparent 60%),
    linear-gradient(rgba(0,100,180,.06) 1px, transparent 1px) 0 0/40px 40px,
    linear-gradient(90deg, rgba(0,100,180,.06) 1px, transparent 1px) 0 0/40px 40px,
    linear-gradient(135deg,#dce6f0 0%,#e8eff8 50%,#d8e4f0 100%); }
#stage:active { cursor:grabbing; }
#stage canvas { display:block; width:100%; height:100%; touch-action:none; }
#status { position:absolute; top:12px; left:12px; z-index:5; font-family:var(--font-mono); font-size:.65rem; letter-spacing:.08em; padding:5px 12px; border-radius:4px; max-width:min(560px,90%); background:rgba(0,180,255,.12); border:1px solid var(--border); color:var(--accent); transition:opacity .5s; }
#status.error { background:rgba(255,68,68,.1); border-color:rgba(255,68,68,.3); color:var(--red); line-height:1.5; }
#status.ok { color:var(--green); border-color:rgba(102,255,0,.3); background:rgba(102,255,0,.08); }
#progress { position:absolute; left:0; top:0; height:3px; width:0; background:var(--accent); z-index:6; transition:width .2s,opacity .4s; }
#help, #info { position:absolute; bottom:12px; z-index:5; font-family:var(--font-mono); font-size:.62rem; letter-spacing:.06em; line-height:1.6; color:var(--text-dim); pointer-events:none; }
#help { right:14px; text-align:right; } #info { left:12px; }
@media (max-width:760px){ .top-center{display:none} .btn{padding:5px 9px;font-size:.7rem} .datetime,#help{display:none} }

/* ── added: edit panel, banner, tooltip, highlights, rails, modal ── */
#edit { position:absolute; top:12px; right:12px; width:210px; z-index:8; display:none; flex-direction:column; gap:7px; padding:10px; background:var(--surface); border:1px solid var(--amber); border-radius:8px; font-family:var(--font-mono); font-size:.66rem; max-height:calc(100% - 24px); overflow-y:auto; }
body.edit-mode #edit { display:flex; }
#edit h3 { font-family:var(--font-ui); font-size:.8rem; letter-spacing:.14em; text-transform:uppercase; color:var(--amber); }
#edit select, #edit input[type=number] { background:var(--surface-2); color:var(--text); border:1px solid var(--border); border-radius:4px; padding:4px; font-family:inherit; font-size:.7rem; width:100%; }
#edit .row { display:flex; gap:5px; align-items:center; } #edit .btn { padding:4px 8px; font-size:.68rem; flex:1; }
#assets { display:grid; grid-template-columns:1fr 1fr; gap:6px; }
.asset { border:1px solid var(--border); border-radius:5px; padding:4px; text-align:center; cursor:pointer; color:var(--text-dim); }
.asset:hover, .asset.on { border-color:var(--amber); color:var(--amber); }
.asset img { width:100%; height:44px; object-fit:contain; display:block; pointer-events:none; }
#banner { position:absolute; top:12px; left:50%; transform:translateX(-50%); z-index:9; display:none; background:rgba(0,180,255,.18); border:1px solid var(--accent); color:var(--accent); font-family:var(--font-mono); font-size:.68rem; letter-spacing:.08em; padding:6px 16px; border-radius:6px; pointer-events:none; text-align:center; }
#tip { position:fixed; z-index:9000; pointer-events:none; display:none; background:rgba(8,13,20,.95); border:1px solid var(--border-hover); border-radius:6px; padding:7px 12px; font-family:var(--font-mono); font-size:.72rem; color:#c8d8ea; white-space:nowrap; }
#tip b { font-family:var(--font-ui); font-size:.95rem; }
#hlList { position:absolute; left:12px; bottom:44px; z-index:6; display:flex; flex-direction:column; gap:5px; }
.rail { position:absolute; top:48px; left:12px; width:225px; z-index:6; background:rgba(8,13,20,.75); border:1px solid var(--border); border-radius:10px; padding:10px 12px; font-family:var(--font-mono); font-size:.68rem; max-height:calc(100% - 130px); overflow-y:auto; }
#railR { left:auto; right:12px; top:12px; }
body.light-mode .rail { background:rgba(255,255,255,.85); } body.edit-mode .rail { display:none; }
.rail h4 { font-family:var(--font-ui); font-size:.78rem; letter-spacing:.18em; text-transform:uppercase; color:var(--accent); display:flex; justify-content:space-between; gap:8px; cursor:pointer; user-select:none; }
.rail.collapsed .body { display:none; } .rail .body { margin-top:8px; }
.stat { display:flex; justify-content:space-between; margin:6px 0; color:var(--text-dim); } .stat b { font-size:1rem; color:var(--text); }
.row2 { display:flex; justify-content:space-between; gap:8px; padding:5px 8px; margin:3px 0; border:1px solid var(--border); border-left-width:3px; border-radius:5px; cursor:pointer; }
.row2:hover { background:var(--accent-dim); }
@media (max-width:1100px){ .rail{display:none} }

.hl { background:rgba(180,80,255,.14); border:1.5px solid rgba(180,80,255,.55); color:rgba(220,170,255,.95); font-family:var(--font-mono); font-size:.68rem; padding:4px 12px; border-radius:6px; cursor:pointer; }
.hl:hover { filter:brightness(1.35); box-shadow:0 0 10px currentColor; }

#exportModal, #hlModal, #eqModal { display:none; position:fixed; inset:0; background:rgba(0,0,0,.7); z-index:3000; align-items:center; justify-content:center; }
#exportModal.open, #hlModal.open, #eqModal.open { display:flex; }
.modal-box input[type=text] { width:100%; background:var(--bg); color:var(--text); border:1px solid var(--border); border-radius:6px; padding:8px; font-family:var(--font-mono); font-size:.72rem; }
.modal-box { background:var(--surface); border:1px solid var(--border); border-radius:10px; padding:22px; width:min(580px,90%); }
.modal-box h3 { font-size:1.05rem; letter-spacing:.1em; text-transform:uppercase; color:var(--accent); margin-bottom:10px; }
.modal-box textarea { width:100%; height:260px; background:var(--bg); color:var(--text); border:1px solid var(--border); border-radius:6px; padding:8px; font-family:var(--font-mono); font-size:.7rem; }
.modal-box .row { display:flex; gap:10px; margin-top:10px; }
.modal-box label { display:block;font-family:var(--font-mono); font-size:.62rem; letter-spacing:.1em; text-transform:uppercase; color:var(--text-dim); margin:10px 0 4px; }
.modal-box select { width:100%; background:var(--bg); color:var(--text); border:1px solid var(--border); border-radius:6px; padding:8px; font-family:var(--font-mono); font-size:.72rem; }
.modal-box select option { background:var(--surface); color:var(--text); }
.modal-box input[type=color] { width:52px; height:32px; background:none; border:1px solid var(--border); border-radius:6px; cursor:pointer; }
.modal-box .row .btn { flex:1; }


#eqSlider { display:flex; width:200%; transition:transform .3s ease; }
#eqSlider.other { transform:translateX(-50%); }
.eqPane { width:50%; padding-right:1px; }
#eqOtherList { max-height:260px; overflow-y:auto; }
.eqRow { display:flex; gap:6px; margin-bottom:6px; }
.eqRow input { min-width:0; }
.eqRow .eqN { flex:1; } .eqRow .eqO { flex:2; }
.eqRow .btn { flex:0 0 auto; border-color:var(--red); color:var(--red); }

#eqInfo { position:fixed; z-index:9100; display:none; min-width:240px; max-width:420px; background:var(--surface); border:1px solid var(--accent); border-radius:8px; padding:12px 14px; font-family:var(--font-mono); font-size:.72rem; box-shadow:0 8px 30px rgba(0,0,0,.5); }
#eqInfo h4 { font-family:var(--font-ui); font-size:.9rem; letter-spacing:.14em; text-transform:uppercase; color:var(--accent); display:flex; justify-content:space-between; gap:12px; margin-bottom:8px; }
#eqInfo h4 span { cursor:pointer; color:var(--text-dim); }
#eqInfo .ir { display:flex; justify-content:space-between; gap:16px; padding:4px 0; border-bottom:1px solid var(--border); }
#eqInfo .ir b { color:var(--text); }

#floorPrev { position:fixed; right:14px; bottom:60px; z-index:9; display:none; width:340px; max-width:40vw; background:var(--surface); border:1px solid var(--accent); border-radius:8px; padding:8px; box-shadow:0 8px 30px rgba(0,0,0,.5); pointer-events:none; }
#floorPrev .t { font-family:var(--font-ui); font-size:.85rem; letter-spacing:.14em; text-transform:uppercase; color:var(--accent); margin-bottom:6px; }
#floorPrev img { display:block; width:100%; max-height:260px; object-fit:contain; border-radius:4px; background:rgba(0,0,0,.25); }

#cuModal { display:none; position:fixed; inset:0; background:rgba(0,0,0,.7); z-index:3000; align-items:center; justify-content:center; }
#cuModal.open { display:flex; }

</style>
</head>
<body>

<div class="top-bar">
  <button class="btn" onclick="history.back()">← Back</button>
  <div class="top-center"><span class="site-label">Murphy Control</span><span class="page-title">3D Building</span></div>
  <div class="tools">
    <button class="btn" id="btnEdit" title="Place zones, trace areas, add images and highlights">Edit Mode</button>
    <button class="btn" id="btnReset" title="Return to the starting view">Reset View</button>
    <button class="btn" id="btnRotate" title="Slowly orbit the building">Auto-Rotate</button>
    <button class="btn" id="btnWire" title="Show model edges only">Wireframe</button>
    <button class="btn" id="btnGrid" title="Show or hide the ground grid">Grid</button>
    <button class="btn" id="btnTheme" title="Switch light / dark">Light</button>
  </div>
</div>

<div id="stage">
  <div id="progress"></div>
  <div id="status">Loading model…</div>
  <div id="banner"></div>
  <div id="info"></div>
  <div id="help">Left-drag: orbit &nbsp;|&nbsp; Right-drag / two fingers: pan &nbsp;|&nbsp; Wheel / pinch: zoom</div>
  <div id="hlList"></div>
  <div class="rail collapsed" id="railL"></div>
  <div class="rail collapsed" id="railR"></div>
  <div id="edit">

    <div class="row"><button class="btn" id="bPlace">Place tag</button><button class="btn" id="bTrace">Trace area</button></div>
    <div class="row"><button class="btn" id="bClr">Remove zone</button></div>
    <h3>⬡ RTUs / AHUs</h3>
    <select id="eSel"></select>
    <div class="row"><button class="btn" id="eTrace">Trace area</button><button class="btn" id="eClr">Remove</button></div>
    
    <h3>⬡ Custom tags</h3>
<select id="cSel"></select>
<div class="row"><button class="btn" id="cNew">+ New</button><button class="btn" id="cEdit">Edit</button></div>
<div class="row"><button class="btn" id="cMove">Move</button><button class="btn" id="cDel">Remove</button></div>

    <h3>⬡ Image assets</h3>
    <div id="assets"></div>
    <h3>⬡ Highlights</h3>

</div>
<div id="tip"></div>
<div id="eqInfo"></div>
<div id="floorPrev"><div class="t" id="floorPrevTitle"></div><img id="floorPrevImg" alt=""></div>

<div class="bottom-bar"><span></span><div class="datetime" id="clock">—</div><span></span></div>

<div id="hlModal"><div class="modal-box" style="max-width:460px;">
  <h3 id="hlTitle">New Highlight</h3>
  <label>Floor</label>
  <select id="hlFloor"></select>
  <label>Color</label>
  <input type="color" id="hlColor" value="#c878ff">

<option value="rect">Floor box (2 clicks)</option>

    <!-- Pane 1: main point -->

      <input type="text" id="eqName" placeholder="e.g. RTU3 Surgery Supply Fan">
      <label>ORD</label>
      <input type="text" id="eqOrd" placeholder="station:|slot:/Drivers/NiagaraNetwork/CityPlace5RTU/points/RTU3_Surgery/SupplyFan_OutputStatus">
             <div id="eqLinkWrap">
        <label>Hyperlink ORD (optional, the page without ?unit=)</label>
        <input type="text" id="eqLink" placeholder="https://10.10.10.10/file/Murphy_MasterGraphics/RTUs/RTU_3/RTU3.html">
        <div id="eqLinkPreview" style="margin-top:5px;font-family:var(--font-mono);font-size:.62rem;color:var(--text-dim);word-break:break-all"></div>
      </div>
      <div class="row" style="flex-wrap:wrap">
        <button class="btn" id="eqOtherBtn">Other data →</button>
        <button class="btn" id="eqSaveOnly" style="display:none">Save</button>
        <button class="btn" id="eqSave">Save &amp; Trace</button>
        <button class="btn" id="eqDelete" style="display:none;border-color:var(--red);color:var(--red)">Delete</button>
        <button class="btn" id="eqCancel">Cancel</button>
      </div>

    <!-- Pane 2: other data -->
    <div class="eqPane">
      <h3>Other Data</h3>
      <label>Shown when you click the area</label>

      <div class="row"><button class="btn" id="eqAddRow" style="flex:none;width:100%">+ Add point</button></div>

<script>
// Same login gate as the other Murphy pages
(function () { if (!sessionStorage.getItem('username')) window.location.href = '../LOGIN/Login.html'; })();
(function tick() {
  const o = { day:'2-digit', month:'short', year:'numeric', hour:'numeric', minute:'2-digit', hour12:true };
  document.getElementById('clock').textContent = new Date().toLocaleString('en-US', o).replace(',', '');
  setTimeout(tick, 1000);
})();
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { GLTFLoader }    from 'three/addons/loaders/GLTFLoader.js';

const MODEL_FILE = 'testGLB.gltf';   // same folder as this page
const HOME_CFG = '../HomeConfig.json', GLOBAL_CFG = '../Global.json', SAVED_JSON = '../3D.json';
const DEF_DB = 3, POLL_MS = 20000;

const DB_LS_KEY = 'Murphy_3DDeadband';
const readDbStore = () => { try { return JSON.parse(localStorage.getItem(DB_LS_KEY)) || {}; } catch { return {}; } };
const readDb = n => { const v = parseFloat(readDbStore()[n]); return !isNaN(v) && v > 0 ? v : DEF_DB; };
function saveDb(n, v) {
  const s = readDbStore();
  if (v === DEF_DB) delete s[n]; else s[n] = v;          // default → don't store it
  try { Object.keys(s).length ? localStorage.setItem(DB_LS_KEY, JSON.stringify(s)) : localStorage.removeItem(DB_LS_KEY); } catch {}
}
try { localStorage.removeItem('Murphy_Building3D'); } catch {}   // clear the old copy once
const IMAGE_ASSETS = [
  { src:'../RTUs/RTU_IMAGES/Intellipak/Ipak3_ElectricHeat_Static.png', label:'Intellipak' },
  { src:'../RTUs/RTU_IMAGES/Voyager/Voyager.png', label:'Voyager' },
  { src:'../RTUs/RTU_IMAGES/Precedent/Precedent.png', label:'Precedent' },
  { src:'../IMAGES/Chiller/animation.gif', label:'Animation' },
  { src:'../IMAGES/Chiller/Trane Centrifugal Chiller CVGF - CLOSED.png', label:'Trane CVGF' },
];

const $ = id => document.getElementById(id);
const stage = $('stage'), statusEl = $('status'), progress = $('progress'), infoEl = $('info');
function setStatus(msg, type) {
  statusEl.className = type || ''; statusEl.textContent = msg; statusEl.style.opacity = '1';
  if (type === 'ok') setTimeout(() => { statusEl.style.opacity = '0'; }, 3000);
}

/* ── renderer / scene / camera ─────────────────────────────── */
const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
stage.appendChild(renderer.domElement);

const scene  = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(50, 1, 0.1, 1000);
camera.position.set(30, 20, 30);

scene.add(new THREE.HemisphereLight(0xdfeaff, 0x1a2535, 1.1));
const sun = new THREE.DirectionalLight(0xffffff, 2.0);
sun.position.set(60, 100, 40); sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048); sun.shadow.bias = -0.0005;
scene.add(sun);

let grid = new THREE.GridHelper(100, 50, 0x04d9ff, 0x1d3a55);
grid.material.transparent = true; grid.material.opacity = 0.35;
scene.add(grid);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true; controls.dampingFactor = 0.08;
controls.screenSpacePanning = true; controls.maxPolarAngle = Math.PI * 0.499; controls.autoRotateSpeed = 0.8;

/* ── load the model ────────────────────────────────────────── */
let model = null, R = 10;
let home = { pos: new THREE.Vector3(), target: new THREE.Vector3() };

new GLTFLoader().load(
  MODEL_FILE,
  gltf => {
    model = gltf.scene;
    let tris = 0, meshes = 0;
    model.traverse(o => {
      if (o.isMesh) {
        meshes++; o.castShadow = true; o.receiveShadow = true;
        const g = o.geometry; tris += (g.index ? g.index.count : g.attributes.position.count) / 3;
      }
    });
    scene.add(model);
    frameModel();
    progress.style.opacity = '0';
    setStatus(`Loaded ${MODEL_FILE}`, 'ok');

  sun.position.set(center.x + radius * 2, radius * 4, center.z + radius * 1.5);

    try {

      baja.Ord.make(path).get().then(p => p?.getOut ? cb(null, decodeBaja(p.getOut().getValueDisplay())) : cb(new Error('no getOut'))).catch(cb);
    } catch (e) { cb(e); }

/* deadband colour: green in band → yellow → orange → red */
const C = [[122,100,44],[48,100,50],[25,100,50],[4,100,52]];
const mix = (a, b, t) => a.map((v, i) => v + (b[i] - v) * t);
function zColor(z) {
  if (z.t == null || z.sp == null) return 'hsl(195,80%,50%)';
  const ex = Math.abs(z.t - z.sp) - z.db; let c;
  if (ex <= 0) c = C[0]; else { const r = ex / z.db; c = r <= 1 ? mix(C[0], C[1], r) : r <= 2 ? mix(C[1], C[2], r - 1) : mix(C[2], C[3], Math.min(1, (r - 2) / 2)); }
  return `hsl(${c[0].toFixed(1)},${c[1]}%,${c[2].toFixed(1)}%)`;
}

/* tag sprite (name + temp) */
function makeTag(z) {

  return s;
}

/* polygon from 3D points: outline + fill triangulated on the dominant plane */
function makePoly(arr, color, opacity) {
  const pts = arr.map(a => new THREE.Vector3(...a)), g = new THREE.Group();
  const line = new THREE.LineLoop(new THREE.BufferGeometry().setFromPoints(pts),
    new THREE.LineBasicMaterial({ color, depthTest: false, transparent: true }));
  line.renderOrder = 8;
  const n = new THREE.Vector3();
  pts.forEach((p, i) => { const q = pts[(i + 1) % pts.length]; n.x += (p.y - q.y) * (p.z + q.z); n.y += (p.z - q.z) * (p.x + q.x); n.z += (p.x - q.x) * (p.y + q.y); });
  const ax = [Math.abs(n.x), Math.abs(n.y), Math.abs(n.z)], d = ax.indexOf(Math.max(...ax));
  const flat = pts.map(p => d === 0 ? new THREE.Vector2(p.y, p.z) : d === 1 ? new THREE.Vector2(p.x, p.z) : new THREE.Vector2(p.x, p.y));
  const geo = new THREE.BufferGeometry().setFromPoints(pts);
  geo.setIndex(THREE.ShapeUtils.triangulateShape(flat, []).flat());
  const fill = new THREE.Mesh(geo, new THREE.MeshBasicMaterial({ color, transparent: true, opacity, side: THREE.DoubleSide, depthWrite: false, polygonOffset: true, polygonOffsetFactor: -2, polygonOffsetUnits: -2 }));
  fill.renderOrder = 7;
  g.add(fill, line); g.userData = { line, fill };
  return g;
}
const setPolyColor = (g, col) => { g.userData.line.material.color.set(col); g.userData.fill.material.color.set(col); };

function boxGeo(b) {
  const s = b.max.clone().sub(b.min), g = new THREE.BoxGeometry(s.x, s.y, s.z);
  g.translate((b.min.x + b.max.x) / 2, (b.min.y + b.max.y) / 2, (b.min.z + b.max.z) / 2);
  return g;
}
function makeBox(b, color, opacity) {
  const geo = boxGeo({ min: new THREE.Vector3(...b.min), max: new THREE.Vector3(...b.max) });
  const fill = new THREE.Mesh(geo, new THREE.MeshBasicMaterial({ color, transparent: true, opacity, side: THREE.DoubleSide, depthWrite: false, polygonOffset: true, polygonOffsetFactor: -2, polygonOffsetUnits: -2 }));
  const line = new THREE.LineSegments(new THREE.EdgesGeometry(geo), new THREE.LineBasicMaterial({ color, depthTest: false, transparent: true }));
  fill.renderOrder = 7; line.renderOrder = 8;
  const g = new THREE.Group(); g.add(fill, line); g.userData = { line, fill };
  return g;
}

function planeBasis(n) {
  if (Math.abs(n.y) > 0.9) return { u: new THREE.Vector3(1, 0, 0), v: new THREE.Vector3(0, 0, 1) };
  const u = new THREE.Vector3().crossVectors(UP, n).normalize();
  const v = UP.clone().sub(n.clone().multiplyScalar(UP.dot(n))).normalize();

function hitDraw(e) {
  if (!model) return null; setRay(e);
  const h = ray.intersectObject(model, true)[0]; if (!h) return null;
  let wp = h.point.clone();

    const prev = overlay.localToWorld(draw.pts[draw.pts.length - 1].clone());
    const d = wp.clone().sub(prev), ax = [Math.abs(d.x), Math.abs(d.y), Math.abs(d.z)], k = ax.indexOf(Math.max(...ax));

/* 3D box from two clicks. If the clicks are on one wall (almost no span on X or Z),

function boxFrom(a, b) {
  const A = overlay.localToWorld(a.clone()), B = overlay.localToWorld(b.clone());
  const mb = new THREE.Box3().setFromObject(model), pad = R * 0.004;
  const min = new THREE.Vector3(), max = new THREE.Vector3();

    let lo = Math.min(A[k], B[k]), hi = Math.max(A[k], B[k]);
    if (k !== 'y' && hi - lo < R * 0.05) { lo = mb.min[k]; hi = mb.max[k]; }
    min[k] = lo - pad; max[k] = hi + pad;

/* ── Floor Health / Needs Attention rails ──────────────────── */
const collapsed = { L: true, R: true };
['railL', 'railR'].forEach(id => { $(id).addEventListener('wheel', e => e.stopPropagation(), { passive: true }); });

function flyTo(z) {
const p = z.sprite ? z.sprite.getWorldPosition(new THREE.Vector3()) : z.poly ? new THREE.Box3().setFromObject(z.poly).getCenter(new THREE.Vector3()) : null; if (!p) return;
const off = camera.position.clone().sub(controls.target).setLength(R * 0.8);
  controls.target.copy(p); camera.position.copy(p).add(off); controls.update();
}
function renderRails() {
  const list = Object.values(zones).filter(z => (z.sprite || z.poly) && z.t != null && z.sp != null);
  const bad = list.filter(z => Math.abs(z.t - z.sp) - z.db > 0).sort((a, b) => (Math.abs(b.t - b.sp) - b.db) - (Math.abs(a.t - a.sp) - a.db));
  const good = list.length - bad.length;
  const valid = list.filter(z => z.t > 0 && z.t <= 99), avg = valid.length ? valid.reduce((s, z) => s + z.t, 0) / valid.length : null;
  const hot = bad.filter(z => z.t > z.sp).length;
  const L = $('railL'), Rr = $('railR');
  const head = (key, rail, title, sum) => `<h4 data-k="${key}"><span>${title}</span><span>${sum}</span></h4>`;
  L.classList.toggle('collapsed', collapsed.L); Rr.classList.toggle('collapsed', collapsed.R);
  L.innerHTML = head('L', L, 'Building Health', `${good}/${list.length}`) +
    `<div class="body"><div class="stat">ZONES REPORTING<b>${list.length}</b></div><div class="stat">IN BAND<b style="color:hsl(122,100%,44%)">${good}</b></div>` +
    `<div class="stat">OUT OF BAND<b>${bad.length}</b></div><div class="stat">AVG TEMP<b>${avg === null ? '—' : avg.toFixed(1) + '°F'}</b></div>` +
    `<div class="stat">TOO HOT / COLD<b>${hot} / ${bad.length - hot}</b></div></div>`;
  Rr.innerHTML = head('R', Rr, 'Needs Attention', bad.length || '✓') + '<div class="body"></div>';
  const body = Rr.querySelector('.body');
  if (!bad.length) body.innerHTML = '<div style="color:var(--green);text-align:center">✓ All zones in band</div>';
  bad.forEach(z => {
    const row = document.createElement('div'), badS = z.t <= 0 || z.t > 99, col = badS ? '#ff4444' : zColor(z);
    row.className = 'row2'; row.style.borderLeftColor = col;
    row.innerHTML = `<span>${z.name}</span><b style="color:${col}">${badS ? 'Bad Sensor' : (z.t >= z.sp ? '+' : '−') + Math.abs(z.t - z.sp).toFixed(1) + '°F'}</b>`;
    row.onclick = () => flyTo(z); body.appendChild(row);
  });
  document.querySelectorAll('.rail h4').forEach(h => h.onclick = () => { collapsed[h.dataset.k] = !collapsed[h.dataset.k]; localStorage.setItem('Murphy_BasRailCollapsed', JSON.stringify(collapsed)); renderRails(); });
}

/* ── init once the model is in ─────────────────────────────── */
async function initBAS() {
  try {
    const r = await fetch(SAVED_JSON, { cache: 'no-store' });
    if (r.ok) {
      const j = await r.json();
data.zones = j.zones || {}; data.images = j.images || []; data.highlights = j.highlights || []; data.equip = j.equip || {}; data.custom = j.custom || {};
Object.values(data.zones).forEach(d => { delete d.db; });
    }
  } catch (e) { console.warn('3D.json not available:', e.message); }
  let cfg = null;
  try { cfg = await (await fetch(HOME_CFG)).json(); } catch (e) { console.warn('HomeConfig not available:', e.message); }
  try { GLOBAL = await (await fetch(GLOBAL_CFG)).json(); } catch (e) { console.warn('Global.json not available:', e.message); }
  hlFloors = buildFloorOptions(cfg);
  const add = (arr, mk) => (arr || []).forEach(u => {
    const raw = u.name, name = decodeBaja(raw), fl = String(u.FLNUM ?? u.floornumber ?? '').split('_')[0];
    zones[name] = { name, raw, href: mk(raw, fl), db: DEF_DB, t: null, sp: null };
  });
  if (cfg) {
    add(cfg.VAVs, (r, f) => `../VAVs/VAV_${f}/VAV${f}.html?unit=${encodeURIComponent(r)}`);
    add(cfg.FTU,  (r, f) => `../FTUs/FTU_${f}/FTU${f}.html?unit=${encodeURIComponent(r)}`);
    add(cfg.FCUs, (r)    => `../FCUs/${r}.html`);
  }
  Object.keys(data.zones).forEach(n => { if (!zones[n]) zones[n] = { name: n, raw: n, href: null, db: DEF_DB, t: null, sp: null }; });
  Object.values(zones).forEach(z => { z.db = readDb(z.name); });
  [...(cfg?.RTUs || cfg?.RTU || []), ...(cfg?.AHUs || cfg?.AHU || [])].forEach(u => {
    const n = decodeBaja(u.name); equip[n] = equip[n] || { name: n, raw: u.name, v: null, poly: null };
  });
  Object.keys(data.equip).forEach(n => { equip[n] = equip[n] || { name: n, v: null, poly: null }; });
  refreshEquipList();
  Object.keys(data.equip).forEach(applyEquip);
  Object.keys(data.custom).forEach(id => { cust[id] = { id, v: null, sprite: null }; applyCust(id); });
refreshCustList();
   refreshZoneList();
   Object.keys(data.zones).forEach(n => applyZone(zones[n]));
  data.images.forEach(placeImage);
  data.highlights.forEach(renderHl);
  syncDb(); renderRails();
setInterval(() => { Object.values(zones).forEach(poll); Object.keys(data.equip).forEach(pollEquip); Object.keys(data.custom).forEach(pollCust); }, POLL_MS);
  
}
</script>
</body>
