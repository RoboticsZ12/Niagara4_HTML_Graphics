<body>
  
    <div class="header">
        <h1>RTU's Point Summary & History Sheets</h1>
        <p>RTU Summary Sheets</p>
        <div class="control-panel">
            <div class="control-group">
                <label for="unit-dropdown">Select Unit:</label>
                <select id="unit-dropdown" class="unit-dropdown">
                    <option value="">Loading units...</option>
                </select>
            </div>
            <div class="control-group">
                <label for="start-date">Start Date:</label>
                <input type="date" id="start-date" class="date-picker">
            </div>
            <div class="control-group">
                <label for="end-date">End Date:</label>
                <input type="date" id="end-date" class="date-picker">
            </div>
        </div>
    </div>
    
    <div class="main-layout">
        <div class="points-panel">
            <div class="panel-header">Current Points</div>
            <div id="points-content" class="points-grid">
                <div class="loading">Loading points...</div>
            </div>
        </div>
    </div>

    <!-- History Modal -->
    <div id="historyModal" class="modal">
        <div class="modal-content">
          <button id="toggle-history-view-btn" onclick="toggleHistoryView()" 
        style="margin: 10px 0; padding: 10px 20px; background: #26c6da; color: white; 
               border: none; border-radius: 4px; cursor: pointer; font-size: 14px;">
    📊 Graph View
</button>
            <span class="close-btn" onclick="closeHistoryModal()">&times;</span>
            <div id="history-content" class="history-content">
                <div class="history-placeholder">
                    Click on a point to view its historical data
                </div>
            </div>
        </div>
    </div>
    
    
    <script>
 // Global variables
let globalConfig = null;
let monitoredPoints = [];
let subscriber;
let pointValues = {};
let selectedPoint = null;
let historyCache = new Map();
let currentHistoryData = null;
let currentHistoryStats = null;
let historyViewMode = 'table'; // 'table' | 'graph'
let currentHistoryTableHTML = '';


// Decode Niagara-style ASCII ($20, $2d, etc.) for display
function decodeNiagaraName(str) {
    if (!str || typeof str !== 'string') return str;

    return str.replace(/\$([0-9a-fA-F]{2})/g, (match, hex) => {
        return String.fromCharCode(parseInt(hex, 16));
    });
}


// User authorization check
function isAuthorizedUser() {
    const username = 'murphy'; // Simulated user
    console.log('Current user:', username);
    
    if (!username) {
        console.log('No user found');
        return false;
    }
    
    const authorizedUsers = ['murphy', 'admin'];
    const isAuthorized = authorizedUsers.includes(username.toLowerCase());
    
    console.log('User authorized:', isAuthorized);
    return isAuthorized;
}

// Check authorization
if (!isAuthorizedUser()) {
    document.getElementById('points-content').innerHTML = 
        '<div class="error">Access Denied: You do not have permission to view point data.</div>';
    throw new Error('Unauthorized access');
}

// Initialize date inputs to last 24 hours
function initializeDateInputs() {
    const endDate = new Date();
    const startDate = new Date();
    startDate.setDate(startDate.getDate() - 1); // 24 hours ago
    
    document.getElementById('start-date').value = startDate.toISOString().split('T')[0];
    document.getElementById('end-date').value = endDate.toISOString().split('T')[0];
}

// Toggle between table and graph view
function toggleHistoryView() {
    if (!currentHistoryData) return;

    historyViewMode = historyViewMode === 'table' ? 'graph' : 'table';

    const btn = document.getElementById('toggle-history-view-btn');
    if (btn) {
        btn.textContent = historyViewMode === 'table' ? '📊 Graph View' : '📋 Table View';
    }

    renderHistoryView();
}

// Render the appropriate view
function renderHistoryView() {
    if (!currentHistoryData || !selectedPoint) return;

    if (historyViewMode === 'table') {
        document.getElementById('history-content').innerHTML = currentHistoryTableHTML;
    } else {
        renderHistoryGraphView();
    }
}

// Render graph view
function renderHistoryGraphView() {
    const container = document.getElementById('history-content');

    const unit = selectedPoint.type === 'numeric' ? extractDataUnit(selectedPoint.name) : '';

    container.innerHTML = `
        <div class="history-header-info">
     <div class="history-point-name">${decodeNiagaraName(selectedPoint.name)}</div>
<div class="history-point-path">${decodeNiagaraName(selectedPoint.path)}</div>

        </div>
        <div class="history-graph-wrapper" style="margin-top: 20px;">
            <canvas id="history-graph-canvas"></canvas>
        </div>
    `;

    const canvas = document.getElementById('history-graph-canvas');
drawHistoryGraph(
    canvas,
    currentHistoryData,
    decodeNiagaraName(selectedPoint.name),
    unit
);
}

// Draw the history graph with hover functionality
function drawHistoryGraph(canvas, data, label, unit) {
    const ctx = canvas.getContext('2d');
    const dpr = window.devicePixelRatio || 1;

    const parent = canvas.parentElement;
    const width = parent.clientWidth;
    const height = 360;

    canvas.width = width * dpr;
    canvas.height = height * dpr;
    canvas.style.width = width + 'px';
    canvas.style.height = height + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

    const padding = { top: 40, right: 30, bottom: 60, left: 70 };
    const gw = width - padding.left - padding.right;
    const gh = height - padding.top - padding.bottom;

    ctx.clearRect(0, 0, width, height);
    ctx.fillStyle = '#ffffff';
    ctx.fillRect(0, 0, width, height);

    if (!data.length) {
        ctx.fillStyle = '#888';
        ctx.font = '16px Arial';
        ctx.textAlign = 'center';
        ctx.fillText('No data', width / 2, height / 2);
        return;
    }

    // Store points for hover detection
    const plottedPoints = [];

    const values = data.map(d =>
        typeof d.value === 'boolean' ? (d.value ? 1 : 0) : d.value
    );

    const min = Math.min(...values);
    const max = Math.max(...values);
    const range = max - min || 1;

    const xScale = i => padding.left + (i / (data.length - 1)) * gw;
    const yScale = v => padding.top + gh - ((v - min) / range) * gh;

    // Draw grid
    ctx.strokeStyle = '#e0e0e0';
    ctx.lineWidth = 1;

    for (let i = 0; i <= 5; i++) {
        const y = padding.top + (gh / 5) * i;
        ctx.beginPath();
        ctx.moveTo(padding.left, y);
        ctx.lineTo(padding.left + gw, y);
        ctx.stroke();

        const val = max - (range / 5) * i;
        ctx.fillStyle = '#666';
        ctx.font = '12px Arial';
        ctx.textAlign = 'right';
        ctx.fillText(
            val.toFixed(1) + (unit ? ' ' + unit : ''),
            padding.left - 8,
            y + 4
        );
    }

    // X-axis labels
    const startTime = data[0].timestamp.getTime();
    const endTime = data[data.length - 1].timestamp.getTime();
    const rangeHours = (endTime - startTime) / (1000 * 60 * 60);

    ctx.textAlign = 'center';
    ctx.fillStyle = '#666';
    ctx.font = '11px Arial';

    for (let i = 0; i < 6; i++) {
        const idx = Math.floor((i / 5) * (data.length - 1));
        const x = xScale(idx);
        const ts = data[idx].timestamp;

        let label;
        if (rangeHours <= 24) {
            label = ts.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
        } else if (rangeHours <= 168) {
            label = ts.toLocaleString([], { month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit' });
        } else {
            label = ts.toLocaleDateString([], { month: '2-digit', day: '2-digit' });
        }

        ctx.fillText(label, x, height - 25);
    }

    // Draw line
    ctx.strokeStyle = '#26c6da';
    ctx.lineWidth = 2.5;
    ctx.beginPath();

    data.forEach((p, i) => {
        const v = typeof p.value === 'boolean' ? (p.value ? 1 : 0) : p.value;
        const x = xScale(i);
        const y = yScale(v);

        if (i === 0) ctx.moveTo(x, y);
        else ctx.lineTo(x, y);

        plottedPoints.push({ x, y, value: p.value, timestamp: p.timestamp });
    });

    ctx.stroke();

    // Draw axes
    ctx.strokeStyle = '#333';
    ctx.lineWidth = 2;

    ctx.beginPath();
    ctx.moveTo(padding.left, padding.top);
    ctx.lineTo(padding.left, padding.top + gh);
    ctx.stroke();

    ctx.beginPath();
    ctx.moveTo(padding.left, padding.top + gh);
    ctx.lineTo(padding.left + gw, padding.top + gh);
    ctx.stroke();

    // Title
    ctx.fillStyle = '#1e3c72';
    ctx.font = 'bold 16px Arial';
    ctx.textAlign = 'center';
    ctx.fillText(label, width / 2, 24);

    // Hover tooltip
    canvas.onmousemove = e => {
        const rect = canvas.getBoundingClientRect();
        const mx = e.clientX - rect.left;
        const my = e.clientY - rect.top;

        let closest = null;
        let minDist = 8;

        plottedPoints.forEach(p => {
            const d = Math.hypot(mx - p.x, my - p.y);
            if (d < minDist) {
                minDist = d;
                closest = p;
            }
        });

        if (!closest) {
            drawHistoryGraph(canvas, data, label, unit);
            canvas.style.cursor = 'default';
            return;
        }

        canvas.style.cursor = 'pointer';
        drawHistoryGraph(canvas, data, label, unit);

        // Guide line
        ctx.strokeStyle = 'rgba(0,0,0,0.25)';
        ctx.beginPath();
        ctx.moveTo(closest.x, padding.top);
        ctx.lineTo(closest.x, padding.top + gh);
        ctx.stroke();

        // Highlight point
        ctx.fillStyle = '#ff7043';
        ctx.beginPath();
        ctx.arc(closest.x, closest.y, 6, 0, Math.PI * 2);
        ctx.fill();

        // Tooltip
        const valueText =
            typeof closest.value === 'boolean'
                ? (closest.value ? 'TRUE' : 'FALSE')
                : closest.value.toFixed(2) + (unit ? ' ' + unit : '');

        drawTooltip(
            ctx,
            closest.x + 10,
            closest.y - 10,
            `${closest.timestamp.toLocaleString()}\nValue: ${valueText}`
        );
    };
}

// Draw tooltip
function drawTooltip(ctx, x, y, text) {
    const padding = 8;
    const lineHeight = 14;
    const maxWidth = 200;

    const words = text.split(' ');
    const lines = [];
    let currentLine = '';

    words.forEach(word => {
        const testLine = currentLine ? currentLine + ' ' + word : word;
        const testWidth = ctx.measureText(testLine).width;
        if (testWidth + padding * 2 > maxWidth) {
            if (currentLine) lines.push(currentLine);
            currentLine = word;
        } else {
            currentLine = testLine;
        }
    });
    if (currentLine) lines.push(currentLine);

    const width = Math.min(maxWidth, Math.max(...lines.map(l => ctx.measureText(l).width)) + padding * 2);
    const height = lines.length * lineHeight + padding * 2;

    if (x + width > ctx.canvas.width) {
        x = ctx.canvas.width - width - 5;
    }
    if (y - height < 0) {
        y = height + 5;
    }

    ctx.fillStyle = 'rgba(50,50,50,0.9)';
    ctx.fillRect(x, y - height, width, height);

    ctx.fillStyle = '#fff';
    lines.forEach((line, i) => {
        ctx.fillText(line, x + padding, y - height + padding + (i + 1) * lineHeight - 4);
    });
}

// Load global configuration
async function loadGlobalConfig() {
    try {
        const response = await fetch('../../Global.json');
        if (!response.ok) {
            throw new Error(`HTTP error! status: ${response.status}`);
        }
        
        globalConfig = await response.json();
        parseMonitoredPoints();
        populateUnitDropdown();
        
        console.log('Global.json loaded successfully');
        console.log('Monitored points found:', monitoredPoints.length);
        
    } catch (error) {
        console.error('Error loading Global.json:', error);
        document.getElementById('points-content').innerHTML = 
            `<div class="error">Error loading configuration: ${error.message}</div>`;
    }
}

function parseMonitoredPoints() {
    monitoredPoints = [];

    if (!globalConfig || !globalConfig.globalVariables) {
        console.warn('No globalVariables found in config');
        return;
    }

    for (const [unitName, unitData] of Object.entries(globalConfig.globalVariables)) {
        const unitNameUpper = unitName.toUpperCase();
        if (!unitNameUpper.includes('RTU') && !unitNameUpper.includes('ROOFTOP')) {
            continue;
        }

        if (!unitData.points || !Array.isArray(unitData.points)) continue;

        unitData.points.forEach(point => {
            if ((point.logNumeric === "yes_Numeric") && point.status === "connected") {
                monitoredPoints.push({
                    unit: unitName,
                    pointName: point.name,
                    fullPath: point.fullPath,
                    basePath: unitData.basePath,
                    id: point.id,
                    dateAdded: point.dateAdded,
                    displayName: `${unitName} - ${point.name}`,
                    pointType: "numeric"
                });
            }
            else if ((point.logBoolean === "yes_Boolean" || point.log === "yes") && point.status === "connected") {
                monitoredPoints.push({
                    unit: unitName,
                    pointName: point.name,
                    fullPath: point.fullPath,
                    basePath: unitData.basePath,
                    id: point.id,
                    dateAdded: point.dateAdded,
                    displayName: `${unitName} - ${point.name}`,
                    pointType: "boolean"
                });
            }
        });
    }

    console.log('Parsed monitored RTU/Rooftop points:', monitoredPoints);
}

// Populate unit dropdown
function populateUnitDropdown() {
    const dropdown = document.getElementById('unit-dropdown');
    dropdown.innerHTML = '';
    
    const allOption = document.createElement('option');
    allOption.value = 'all';
    allOption.textContent = 'All Units';
    dropdown.appendChild(allOption);
    
    const units = [...new Set(monitoredPoints.map(p => p.unit))].sort();
    units.forEach(unit => {
        const option = document.createElement('option');
        option.value = unit;
        option.textContent = unit.replace(/_/g, ' ');
        dropdown.appendChild(option);
    });
    
    dropdown.value = 'all';
    dropdown.addEventListener('change', displayPoints);
    
    displayPoints();
}

// Display points
function displayPoints() {
    const selectedUnit = document.getElementById('unit-dropdown').value;
    let pointsToShow = monitoredPoints;
    
    if (selectedUnit && selectedUnit !== 'all') {
        pointsToShow = monitoredPoints.filter(p => p.unit === selectedUnit);
    }
    
    const pointsContent = document.getElementById('points-content');
    
    if (pointsToShow.length === 0) {
        pointsContent.innerHTML = '<div class="no-data">No points found for selected unit.</div>';
        return;
    }
    
    let html = '';
    pointsToShow.forEach(point => {
        const pointTypeClass = point.pointType === 'numeric' ? 'type-numeric' : 'type-boolean';
        const pointTypeText = point.pointType === 'numeric' ? 'NUMERIC' : 'BOOLEAN';
        
       const decodedUnit = decodeNiagaraName(point.unit).replace(/_/g, ' ');
const decodedPoint = decodeNiagaraName(point.pointName).replace(/_/g, ' ');

const displayName = selectedUnit === 'all'
    ? `[${decodedUnit}] ${decodedPoint}`
    : decodedPoint;

        
        html += `
            <div class="point-item" onclick="selectPoint('${point.fullPath}', '${point.displayName}', '${point.pointType}')" 
                 data-point-path="${point.fullPath}">
                <div class="point-type ${pointTypeClass}">${pointTypeText}</div>
                <div class="point-name">${displayName}</div>
                <div class="point-value" id="value-${point.fullPath}">Loading...</div>
                <div class="point-path">${point.fullPath}</div>
            </div>
        `;
    });
    
    pointsContent.innerHTML = html;
    
    pointsToShow.forEach(point => {
        subscribeToPoint(point.fullPath, point.displayName, point.pointType);
    });
}

// Subscribe to point
function subscribeToPoint(pointPath, displayName, pointType) {
    try {
        require(['baja!'], function(baja) {
            if (!subscriber) {
                subscriber = new baja.Subscriber();
                
                subscriber.attach('changed', function(prop) {
                    if (prop.getName() === 'out') {
                        const pointInfo = this.userData;
                        if (pointInfo) {
                            const out = this.getOut();
                            const displayValue = out.getValueDisplay();
                            
                            const valueElement = document.getElementById(`value-${pointInfo.pointPath}`);
                            if (valueElement) {
                                if (pointInfo.pointType === 'boolean') {
                                    const boolValue = out.getValue();
                                    valueElement.textContent = boolValue ? 'TRUE' : 'FALSE';
                                    valueElement.style.color = boolValue ? '#2ecc71' : '#e74c3c';
                                } else {
                                    valueElement.textContent = displayValue;
                                    valueElement.style.color = '#26c6da';
                                }
                            }
                        }
                    }
                });
            }
            
            baja.Ord.make(pointPath).get({ subscriber: subscriber })
                .then(point => {
                    console.log(`✅ Connected to ${displayName}`);
                    
                    point.userData = { 
                        pointPath: pointPath,
                        displayName: displayName,
                        pointType: pointType
                    };
                    
                    const out = point.getOut();
                    const displayValue = out.getValueDisplay();
                    
                    const valueElement = document.getElementById(`value-${pointPath}`);
                    if (valueElement) {
                        if (pointType === 'boolean') {
                            const boolValue = out.getValue();
                            valueElement.textContent = boolValue ? 'TRUE' : 'FALSE';
                            valueElement.style.color = boolValue ? '#2ecc71' : '#e74c3c';
                        } else {
                            valueElement.textContent = displayValue;
                            valueElement.style.color = '#26c6da';
                        }
                    }
                })
                .catch(error => {
                    console.error(`❌ Failed to connect to ${displayName}:`, error);
                    const valueElement = document.getElementById(`value-${pointPath}`);
                    if (valueElement) {
                        valueElement.textContent = 'Connection Error';
                    }
                });
        });
    } catch (error) {
        console.error(`Failed to subscribe to ${pointPath}:`, error);
    }
}

// Select point
function selectPoint(pointPath, displayName, pointType) {
    document.querySelectorAll('.point-item').forEach(item => {
        item.classList.remove('selected');
    });
    
    const clickedItem = document.querySelector(`[data-point-path="${pointPath}"]`);
    if (clickedItem) {
        clickedItem.classList.add('selected');
    }
    
    selectedPoint = { path: pointPath, name: displayName, type: pointType };
    
    openHistoryModal();
    loadHistoryData(pointPath, displayName, pointType);
}

// Discover history ORD
async function discoverHistoryOrd(pointOrd) {
    return new Promise((resolve, reject) => {
        try {
            require(['baja!'], function (baja) {
                console.log('Auto-discovering history from point:', pointOrd);
                
                baja.Ord.make(pointOrd).get()
                    .then(function(entity) {
                        return entity.tags();
                    })
                    .then(function(tagMap) {
                        var historyTag = tagMap.get('n:history');
                        console.log('Found history tag:', historyTag);
                        
                        if (historyTag && historyTag.toString().trim() !== '') {
                            var historyPath = historyTag.toString();
                            
                            if (!historyPath.startsWith('history:')) {
                                historyPath = 'history:' + historyPath;
                            }
                            
                            console.log('Discovered history ORD:', historyPath);
                            resolve(historyPath);
                        } else {
                            reject(new Error('No n:history tag found on point: ' + pointOrd));
                        }
                    })
                    .catch(function(err) {
                        console.error('Could not load tags:', err);
                        reject(new Error('Failed to load point tags: ' + err.message));
                    });
            });
        } catch (error) {
            console.error('Baja require error:', error);
            reject(error);
        }
    });
}

// Load historical data
async function loadHistoryDataForPoint(pointPath, startTime, endTime, pointType, maxPoints = 1000) {
    return new Promise(async (resolve, reject) => {
        try {
            const cacheKey = pointPath;
            let historyOrd = historyCache.get(cacheKey);

            if (!historyOrd) {
                try {
                    historyOrd = await discoverHistoryOrd(pointPath);
                    historyCache.set(cacheKey, historyOrd);
                } catch (error) {
                    console.warn(`No history found for point ${pointPath}:`, error.message);
                    resolve([]);
                    return;
                }
            }

            require(['baja!'], function (baja) {
                const timeCondition = `timestamp >= '${startTime.toISOString()}' and timestamp <= '${endTime.toISOString()}'`;
                const bqlQuery = historyOrd + '|bql:select timestamp, value where ' + timeCondition + ' order by timestamp';

                const dataPoints = [];

                baja.Ord.make(bqlQuery).get({
                    cursor: {
                        limit: maxPoints,
                        each: function () {
                            const row = this.get();
                            const rawTimestamp = row.get("timestamp");
                            const value = row.get("value");
                            const date = new Date(rawTimestamp.getMillis());

                            let processedValue;

                            if (pointType === 'boolean') {
                                processedValue = value === true || value === 'true' || value === 1 || value === '1';
                            } else {
                                processedValue = parseFloat(value);
                                if (isNaN(processedValue)) return;
                            }

                            dataPoints.push({
                                timestamp: date,
                                timestampString: date.toLocaleString(),
                                value: processedValue
                            });
                        }
                    }
                })
                .then(() => resolve(dataPoints))
                .catch(err => reject(new Error('Failed to load history data: ' + err.message)));
            });

        } catch (error) {
            reject(error);
        }
    });
}

// Load and display history
async function loadHistoryData(pointPath, displayName, pointType) {
    const historyContent = document.getElementById('history-content');
    
    historyContent.innerHTML = `
        <div class="history-header-info">
        <div class="history-point-name">${decodeNiagaraName(displayName)}</div>
<div class="history-point-path">${decodeNiagaraName(pointPath)}</div>

        </div>
        <div class="loading">Loading historical data...</div>
    `;
    
    try {
        const startDateStr = document.getElementById('start-date').value;
        const endDateStr = document.getElementById('end-date').value;
        
        if (!startDateStr || !endDateStr) {
            throw new Error('Please select both start and end dates');
        }
        
        const startDate = new Date(startDateStr);
        const endDate = new Date(endDateStr + 'T23:59:59');
        
        const historyData = await loadHistoryDataForPoint(pointPath, startDate, endDate, pointType, 10000);
        
        if (historyData.length === 0) {
            historyContent.innerHTML = `
                <div class="history-header-info">
                  <div class="history-point-name">${decodeNiagaraName(displayName)}</div>
<div class="history-point-path">${decodeNiagaraName(pointPath)}</div>

                </div>
                <div class="no-data">No historical data found for the selected date range.</div>
            `;
            return;
        }
        
        currentHistoryData = historyData;
        
        // Calculate statistics
        let stats;
        if (pointType === 'boolean') {
            const trueCount = historyData.filter(d => d.value === true).length;
            const falseCount = historyData.length - trueCount;
            stats = {
                count: historyData.length,
                trueCount: trueCount,
                falseCount: falseCount,
                truePercent: ((trueCount / historyData.length) * 100).toFixed(1)
            };
        } else {
            const values = historyData.map(d => d.value);
            stats = {
                count: values.length,
                min: Math.min(...values),
                max: Math.max(...values),
                avg: values.reduce((a, b) => a + b, 0) / values.length
            };
        }
        
        currentHistoryStats = stats;
        
        const unit = pointType === 'numeric' ? extractDataUnit(displayName) : '';
        
        // Build table HTML
        let html = `
            <div class="history-header-info">
                <div class="history-point-name">${displayName}</div>
                <div class="history-point-path">${pointPath}</div>
            </div>
            
            <div class="history-stats">
                <div class="stat-box">
                    <div class="stat-label">Count</div>
                    <div class="stat-value">${stats.count}</div>
                </div>
        `;
        
        if (pointType === 'boolean') {
            html += `
                <div class="stat-box">
                    <div class="stat-label">TRUE Count</div>
                    <div class="stat-value">${stats.trueCount}</div>
                </div>
                <div class="stat-box">
                    <div class="stat-label">FALSE Count</div>
                    <div class="stat-value">${stats.falseCount}</div>
                </div>
                <div class="stat-box">
                    <div class="stat-label">TRUE %</div>
                    <div class="stat-value">${stats.truePercent}%</div>
                </div>
            `;
        } else {
            html += `
                <div class="stat-box">
                    <div class="stat-label">Minimum</div>
                    <div class="stat-value">${stats.min.toFixed(2)} ${unit}</div>
                </div>
                <div class="stat-box">
                    <div class="stat-label">Maximum</div>
                    <div class="stat-value">${stats.max.toFixed(2)} ${unit}</div>
                </div>
                <div class="stat-box">
                    <div class="stat-label">Average</div>
                    <div class="stat-value">${stats.avg.toFixed(2)} ${unit}</div>
                </div>
            `;
        }
        
        html += `</div>`;
        
        html += `
            <table class="history-data-table">
                <thead>
                    <tr>
                        <th>Timestamp</th>
                        <th>Value</th>
                    </tr>
                </thead>
                <tbody>
        `;
        
        const displayData = historyData.slice(-100).reverse();
        
        displayData.forEach(point => {
            let displayValue;
            if (pointType === 'boolean') {
                const boolVal = point.value === true;
                displayValue = `<span style="color: ${boolVal ? '#2ecc71' : '#e74c3c'}; font-weight: bold;">${boolVal ? 'TRUE' : 'FALSE'}</span>`;
            } else {
                displayValue = `${point.value.toFixed(2)} ${unit}`;
            }
            
            html += `
                <tr>
                    <td>${point.timestampString}</td>
                    <td>${displayValue}</td>
                </tr>
            `;
        });
        
        html += `</tbody></table>`;
        
        if (historyData.length > 100) {
            html += `
                <div style="text-align: center; margin-top: 15px; color: #90a4ae; font-size: 0.9em;">
                    Showing most recent 100 of ${historyData.length} records
                </div>
            `;
        }
        
        currentHistoryTableHTML = html;
        historyViewMode = 'table';
        
        const btn = document.getElementById('toggle-history-view-btn');
        if (btn) {
            btn.textContent = '📊 Graph View';
        }
        
        renderHistoryView();
        
    } catch (error) {
        console.error('Error loading history data:', error);
        historyContent.innerHTML = `
            <div class="history-header-info">
                <div class="history-point-name">${displayName}</div>
                <div class="history-point-path">${pointPath}</div>
            </div>
            <div class="error">Error loading history: ${error.message}</div>
        `;
    }
}

// Extract data unit
function extractDataUnit(pointNameOrOrd) {
    if (!pointNameOrOrd) return '';
    
    const name = pointNameOrOrd.toLowerCase();
    
    if (name.includes('temp') || name.includes('temperature') || name.includes('dischargeairtemp')) return '°F';
    if (name.includes('flow') || name.includes('airflow') || name.includes('air-flow')) return 'CFM';
    if (name.includes('pressure')) return 'PSI';
    if (name.includes('humidity')) return '%';
    if (name.includes('percent') || name.includes('pct')) return '%';
    if (name.includes('speed')) return '%';
    if (name.includes('power')) return 'kW';
    if (name.includes('current')) return 'A';
    if (name.includes('voltage')) return 'V';
    if (name.includes('frequency') || name.includes('freq')) return 'Hz';
    if (name.includes('static')) return 'in/wc';
    
    return '';
}

// Modal functions
function openHistoryModal() {
    document.getElementById("historyModal").style.display = "flex";
}

function closeHistoryModal() {
    document.getElementById("historyModal").style.display = "none";
    currentHistoryData = null;
    currentHistoryStats = null;
    historyViewMode = 'table';
}

// Add event listener for date changes
function setupDateChangeListeners() {
    document.getElementById('start-date').addEventListener('change', function() {
        if (selectedPoint) {
            loadHistoryData(selectedPoint.path, selectedPoint.name, selectedPoint.type);
        }
    });
    
    document.getElementById('end-date').addEventListener('change', function() {
        if (selectedPoint) {
            loadHistoryData(selectedPoint.path, selectedPoint.name, selectedPoint.type);
        }
    });
}

// Cleanup function
function cleanup() {
    if (subscriber) {
        subscriber.unsubscribeAll();
        console.log('🧹 Cleaned up all subscriptions');
    }
}

// Initialize the system
function initializeSystem() {
    initializeDateInputs();
    setupDateChangeListeners();
    loadGlobalConfig();
    
    console.log('RTU Point Summary & History Viewer initialized');
}

// Handle page unload
window.addEventListener('beforeunload', cleanup);

// Initialize when page loads
initializeSystem();
