    <script type='text/javascript' src='/requirejs/config.js'></script>
    <script type='text/javascript' src='/module/js/com/tridium/js/ext/require/require.min.js?'></script>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #0a0e1a 0%, #1a1f3a 50%, #0f1419 100%);
            min-height: 100vh;
            padding: 20px;
            color: #e0e7ff;
        }

        .dashboard-header {
            text-align: center;
            padding: 30px 20px;
            background: linear-gradient(135deg, #1e3a8a, #7c3aed, #1e40af);
            border-radius: 16px;
            margin-bottom: 30px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4), 0 0 40px rgba(124, 58, 237, 0.2);
            position: relative;
            overflow: hidden;
        }

        .dashboard-header::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: linear-gradient(45deg, transparent, rgba(255, 255, 255, 0.05), transparent);
            animation: rotate 8s linear infinite;
        }

        @keyframes rotate {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .dashboard-header h1 {
            font-size: 32px;
            font-weight: 700;
            position: relative;
            z-index: 1;
            text-shadow: 0 0 20px rgba(124, 58, 237, 0.5);
            margin-bottom: 10px;
        }

        .dashboard-header .subtitle {
            font-size: 14px;
            opacity: 0.9;
            position: relative;
            z-index: 1;
        }

        .stats-bar {
            display: flex;
            justify-content: center;
            gap: 30px;
            flex-wrap: wrap;
            margin-bottom: 30px;
            padding: 20px;
        }

        .stat-card {
            background: linear-gradient(145deg, rgba(30, 58, 138, 0.3), rgba(49, 46, 129, 0.2));
            padding: 20px 30px;
            border-radius: 12px;
            border: 1px solid rgba(124, 58, 237, 0.3);
            backdrop-filter: blur(10px);
            transition: all 0.3s ease;
            min-width: 150px;
            text-align: center;
        }

        .stat-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 25px rgba(124, 58, 237, 0.3);
            border-color: rgba(124, 58, 237, 0.6);
        }

        .stat-number {
            font-size: 32px;
            font-weight: bold;
            color: #a78bfa;
            text-shadow: 0 0 15px rgba(167, 139, 250, 0.5);
        }

        .stat-label {
            font-size: 12px;
            color: #c7d2fe;
            margin-top: 5px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .equipment-section {
            margin-bottom: 40px;
            animation: fadeIn 0.6s ease-in;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .section-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 15px 25px;
            background: linear-gradient(135deg, #1e3a8a, #312e81);
            border-radius: 12px 12px 0 0;
            border: 1px solid rgba(124, 58, 237, 0.3);
            border-bottom: none;
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .section-header::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(167, 139, 250, 0.1), transparent);
            transition: left 0.5s ease;
        }

        .section-header:hover::before {
            left: 100%;
        }

        .section-header:hover {
            background: linear-gradient(135deg, #2563eb, #4338ca);
            box-shadow: 0 4px 20px rgba(124, 58, 237, 0.3);
        }

        .section-title {
            display: flex;
            align-items: center;
            gap: 15px;
            font-size: 20px;
            font-weight: 600;
            color: #e0e7ff;
            text-shadow: 0 0 10px rgba(124, 58, 237, 0.3);
        }

        .section-icon {
            width: 30px;
            height: 30px;
            background: rgba(167, 139, 250, 0.2);
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
        }

        .section-count {
            background: rgba(167, 139, 250, 0.2);
            padding: 5px 15px;
            border-radius: 20px;
            font-size: 14px;
            color: #a78bfa;
            font-weight: 600;
        }

        .collapse-icon {
            transition: transform 0.3s ease;
            font-size: 20px;
            color: #a78bfa;
        }

        .collapsed .collapse-icon {
            transform: rotate(-90deg);
        }

        .table-container {
            background: linear-gradient(145deg, rgba(13, 20, 33, 0.95), rgba(26, 31, 58, 0.9));
            border: 1px solid rgba(124, 58, 237, 0.3);
            border-top: none;
            border-radius: 0 0 12px 12px;
            overflow: hidden;
            backdrop-filter: blur(10px);
            max-height: 600px;
            overflow-y: auto;
            transition: max-height 0.3s ease, opacity 0.3s ease;
        }

        .collapsed .table-container {
            max-height: 0;
            opacity: 0;
            overflow: hidden;
        }

        .equipment-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 13px;
        }

        .equipment-table thead {
            position: sticky;
            top: 0;
            z-index: 10;
        }

        .equipment-table th {
            background: linear-gradient(135deg, #1e3a8a, #312e81);
            color: #e0e7ff;
            padding: 12px 10px;
            text-align: center;
            font-weight: 600;
            border-right: 1px solid rgba(124, 58, 237, 0.2);
            text-shadow: 0 0 8px rgba(124, 58, 237, 0.3);
            text-transform: uppercase;
            font-size: 11px;
            letter-spacing: 0.5px;
        }

        .equipment-table th:last-child {
            border-right: none;
        }

        .equipment-table td {
            padding: 12px 10px;
            text-align: center;
            border-bottom: 1px solid rgba(124, 58, 237, 0.1);
            border-right: 1px solid rgba(124, 58, 237, 0.1);
            background: rgba(13, 20, 33, 0.6);
            color: #b0bec5;
            transition: all 0.2s ease;
        }

        .equipment-table td:last-child {
            border-right: none;
        }

        .equipment-table tbody tr:nth-child(even) td {
            background: rgba(26, 31, 58, 0.4);
        }

        .equipment-table tbody tr:hover td {
            background: linear-gradient(90deg, rgba(124, 58, 237, 0.2), rgba(79, 70, 229, 0.2));
            transform: scale(1.005);
            box-shadow: 0 2px 10px rgba(124, 58, 237, 0.2);
        }

        .equipment-name {
            font-weight: 600;
            color: #a78bfa;
            text-shadow: 0 0 8px rgba(167, 139, 250, 0.3);
        }

        .equipment-name a {
            color: #a78bfa;
            text-decoration: none;
            transition: all 0.2s ease;
        }

        .equipment-name a:hover {
            color: #c4b5fd;
            text-shadow: 0 0 12px rgba(196, 181, 253, 0.5);
        }

        .equipment-name a:visited {
            color: #9ca3af;
        }

        .value-loading {
            color: #7c3aed;
            font-style: italic;
            animation: pulse 2s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 0.5; }
            50% { opacity: 1; }
        }

        .value-error {
            color: #f87171;
            font-style: italic;
            text-shadow: 0 0 5px rgba(248, 113, 113, 0.3);
        }

        .value-normal {
            color: #67e8f9;
            font-weight: 500;
        }

        .value-active {
            color: #34d399;
            font-weight: bold;
            text-shadow: 0 0 10px rgba(52, 211, 153, 0.4);
        }

        .value-inactive {
            color: #64748b;
        }

        .value-missing {
            color: #94a3b8;
            font-style: italic;
        }

        .loading-screen {
            text-align: center;
            padding: 60px;
            color: #a78bfa;
            font-size: 18px;
        }

        .loading-spinner {
            width: 50px;
            height: 50px;
            border: 4px solid rgba(167, 139, 250, 0.2);
            border-top: 4px solid #a78bfa;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .error-message {
            background: linear-gradient(135deg, rgba(30, 58, 138, 0.3), rgba(49, 46, 129, 0.2));
            color: #f87171;
            padding: 30px;
            text-align: center;
            border-radius: 12px;
            margin: 20px;
            border: 1px solid rgba(248, 113, 113, 0.3);
        }

        .table-container::-webkit-scrollbar {
            width: 8px;
        }

        .table-container::-webkit-scrollbar-track {
            background: rgba(13, 20, 33, 0.5);
        }

        .table-container::-webkit-scrollbar-thumb {
            background: rgba(167, 139, 250, 0.3);
            border-radius: 4px;
        }

        .table-container::-webkit-scrollbar-thumb:hover {
            background: rgba(167, 139, 250, 0.5);
        }

        .no-data {
            text-align: center;
            padding: 40px;
            color: #94a3b8;
            font-style: italic;
        }
    </style>
</head>
<body>
    <div class="dashboard-header">
        <h1>🏢 Master Equipment Summary Dashboard</h1>
        <div class="subtitle">Real-Time Building Management System</div>
    </div>

    <div class="stats-bar" id="stats-bar">
        <div class="stat-card">

    <div id="main-content">
        <div class="loading-screen">
            <div class="loading-spinner"></div>
            <div>Loading equipment data...</div>
        </div>
    </div>

    <script>
        let subscriber;
        let pointValues = {};
        let equipmentStats = {};

        // Equipment type configuration with icons and point mappings
        const equipmentConfig = {

},

VAV: {

    prefix: 'VAV_',

},

'Cooling Tower': {
    icon: '🗼',
prefix: ['CT', 'Tower_', 'CoolingTower'],
    points: [

        { id: 'FAN-EN_1', label: 'Fan Enable 1' },

        { id: 'Tower1-ST', label: 'Tower 1 Status' },
        { id: 'Tower2-ST', label: 'Tower 2 Status' },
        { id: 'Tower3-ST', label: 'Tower 3 Status' },

        { id: 'Tower1-Makeup', label: 'Tower 1 Makeup' },

    ],

},

            VFD: {
                icon: '⚡',

                points: [
                    { id: 'Status', label: 'Status' },

                    { id: 'Frequency', label: 'Frequency' }
                ],
                folder: 'VFDs'
            },
RTU: {
    icon: '🏠',
prefix: ['RTU_', 'RTU-', 'RoofTop_'],
    points: [
        { id: 'DA-T', label: 'Discharge Air Temp' },
        { id: 'Static', label: 'Discharge Static' },
        { id: 'DPR-cmd-OA', label: 'OA Damper Pos' },
        { id: 'DPR-cmd-RET', label: 'RET Damper Pos' },
        { id: 'Fan-Stat', label: 'Fan Status' },
        { id: 'COND-FAN-STAT1', label: 'Cond Fan 1' },
        { id: 'COND-FAN-STAT2', label: 'Cond Fan 2' },
        { id: 'Space-TMP', label: 'Space Temp' },
        { id: 'HTG-CAP', label: 'Heating Cap' },
        { id: 'CLG-CAP', label: 'Cooling Cap' },
        { id: 'ModeStatus', label: 'Mode Status' },
        { id: 'Occupancy', label: 'Occupancy' }
    ],
    folder: 'RTUs'
},

        };

        function formatPointValue(value, pointId) {
            if (value === null || value === undefined || value === 'N/A' || value === 'Connection Error') {
                return value === 'Connection Error' ? 'Connection Error' : 'N/A';
            }
            
            if (typeof value === 'string' && value.startsWith('NO_')) {
                return value.replace('NO_', 'No ');
            }
            
            if (pointId.includes('Stat') || pointId === 'Status') {
                return value ? 'ON' : 'OFF';
            }
            if (pointId === 'Occupancy') {
                return value ? 'Occupied' : 'Unoccupied';
            }
            if (pointId.includes('cmd') || pointId.includes('VLV') || pointId === 'Load' || pointId === 'Speed') {
                return Math.round(value) + '%';
            }
            if (typeof value === 'number' && pointId.includes('-T')) {
                return value.toFixed(1) + '°F';
            }
            if (typeof value === 'number' && pointId === 'Frequency') {
                return value.toFixed(1) + ' Hz';
            }
            
            return value.toString();
        }

        function getValueClass(value, pointId) {
            if (value === null || value === undefined || value === 'N/A' || value === 'Connection Error') {
                return 'value-error';
            }
            
            if (typeof value === 'string' && value.startsWith('NO_')) {
                return 'value-missing';
            }
            
            if (pointId.includes('Stat') || pointId === 'Status') {
                return value ? 'value-active' : 'value-inactive';
            }
            if (pointId === 'Occupancy') {
                return value ? 'value-active' : 'value-inactive';
            }
            
            return 'value-normal';
        }

        function updatePointValue(equipmentName, pointId, value) {
            const elementId = `point-${equipmentName}-${pointId}`;
            const valueElement = document.getElementById(elementId);
            if (valueElement) {
                const formattedValue = formatPointValue(value, pointId);
                const valueClass = getValueClass(value, pointId);
                
                valueElement.textContent = formattedValue;
                valueElement.className = valueClass;
                
                if (!pointValues[equipmentName]) pointValues[equipmentName] = {};
                pointValues[equipmentName][pointId] = value;
            }
        }

        function subscribeToPoint(equipmentName, pointId, pointPath) {
            try {
                require(['baja!'], function(baja) {
                    baja.Ord.make(pointPath).get({ subscriber: subscriber })
                        .then(point => {
                            point.userData = { 
                                equipmentName: equipmentName,
                                pointId: pointId, 
                                pointPath: pointPath
                            };
                            
                            const out = point.getOut();
                            const displayValue = out.getValue();
                            
                            updatePointValue(equipmentName, pointId, displayValue);
                        })
                        .catch(error => {
                            console.error(`Failed to connect to ${pointId} (${pointPath}):`, error);
                            updatePointValue(equipmentName, pointId, 'Connection Error');
                        });
                });
            } catch (error) {
                console.error(`Failed to subscribe to ${pointPath}:`, error);
                updatePointValue(equipmentName, pointId, 'Connection Error');
            }
        }

        function shouldExclude(name, excludePatterns) {
            if (!excludePatterns) return false;
            return excludePatterns.some(pattern => pattern.test(name));
        }

        function createEquipmentTable(type, config, equipmentData) {
            if (Object.keys(equipmentData).length === 0) {
                return `
                    <div class="equipment-section">
                        <div class="section-header">
                            <div class="section-title">
                                <span class="section-icon">${config.icon}</span>
                                <span>${type}s</span>
                            </div>
                            <span class="section-count">0 units</span>
                        </div>
                        <div class="table-container">
                            <div class="no-data">No ${type} equipment found</div>
                        </div>
                    </div>
                `;
            }

            const sortedNames = Object.keys(equipmentData).sort();
            
            let tableHTML = `
                <div class="equipment-section">
                    <div class="section-header" onclick="toggleSection(this)">
                        <div class="section-title">
                            <span class="section-icon">${config.icon}</span>
                            <span>${type}s</span>
                        </div>
                        <div style="display: flex; align-items: center; gap: 20px;">
                            <span class="section-count">${sortedNames.length} units</span>
                            <span class="collapse-icon">▼</span>
                        </div>
                    </div>
                    <div class="table-container">
                        <table class="equipment-table">
                            <thead>
                                <tr>
                                    <th>Name</th>
            `;
            
            config.points.forEach(point => {
                tableHTML += `<th>${point.label}</th>`;
            });
            
            tableHTML += `
                                </tr>
                            </thead>
                            <tbody>
            `;
            
            sortedNames.forEach(name => {
                const link = `../${config.folder}/${name}.html`;
                tableHTML += `
                    <tr>
                        <td class="equipment-name"><a href="${link}">${name}</a></td>
                `;
                
                const points = equipmentData[name];
                config.points.forEach(pointConfig => {
                    const point = points.find(p => p.id === pointConfig.id);
                    tableHTML += `<td id="point-${name}-${pointConfig.id}" class="value-loading">Loading...</td>`;
                });
                
                tableHTML += `</tr>`;
            });
            
            tableHTML += `
                            </tbody>
                        </table>
                    </div>
                </div>
            `;
            
            return tableHTML;
        }

        function toggleSection(header) {
            header.parentElement.classList.toggle('collapsed');
        }

        function updateStats() {
            let total = 0;
            let statsHTML = '';
            
            const statOrder = ['AHU', 'VAV', 'FTU', 'RTU', 'Chiller', 'Chiller Plant', 'Cooling Tower', 'VFD'];
            
            statOrder.forEach(type => {
                if (equipmentStats[type] && equipmentStats[type] > 0) {
                    total += equipmentStats[type];
                    const config = equipmentConfig[type];
                    statsHTML += `
                        <div class="stat-card">
                            <div class="stat-number">${equipmentStats[type]}</div>
                            <div class="stat-label">${config.icon} ${type}s</div>
                        </div>
                    `;
                }
            });
            
            document.getElementById('stat-total').textContent = total;
            
            const existingStats = document.querySelectorAll('.stat-card');
            existingStats.forEach((stat, index) => {
                if (index > 0) stat.remove();
            });
            
            document.getElementById('stats-bar').insertAdjacentHTML('beforeend', statsHTML);
        }

        async function loadAndDisplayAllEquipment() {
            try {
                const response = await fetch('../Global.json');
                
                if (!response.ok) {
                    throw new Error(`Failed to load JSON: ${response.status}`);
                }
                
                const jsonData = await response.json();
                const allEquipment = {};
                
                Object.keys(equipmentConfig).forEach(type => {
                    allEquipment[type] = {};
                });
                
                Object.keys(jsonData.globalVariables).forEach(key => {
                    for (const [type, config] of Object.entries(equipmentConfig)) {
                        if (key.startsWith(config.prefix)) {
                            if (!shouldExclude(key, config.exclude)) {
                                const connectedPoints = jsonData.globalVariables[key].points.filter(
                                    point => point.status === "connected"
                                );
                                if (connectedPoints.length > 0) {
                                    allEquipment[type][key] = connectedPoints;
                                }
                            }
                        }
                    }
                });
                
                Object.keys(allEquipment).forEach(type => {
                    equipmentStats[type] = Object.keys(allEquipment[type]).length;
                });
                
                updateStats();
                
                let mainHTML = '';
                Object.keys(equipmentConfig).forEach(type => {
                    const config = equipmentConfig[type];
                    mainHTML += createEquipmentTable(type, config, allEquipment[type]);
                });
                
                document.getElementById('main-content').innerHTML = mainHTML;
                
                Object.keys(allEquipment).forEach(type => {
                    const config = equipmentConfig[type];
                    Object.keys(allEquipment[type]).forEach(name => {
                        const points = allEquipment[type][name];
                        
                        config.points.forEach(pointConfig => {
                            const point = points.find(p => p.id === pointConfig.id);
                            if (point && point.status === 'connected') {
                                subscribeToPoint(name, pointConfig.id, point.fullPath);
                            } else {
                                updatePointValue(name, pointConfig.id, `NO_${pointConfig.label}`);
                            }
                        });
                    });
                });
                
            } catch (error) {
                console.error('Error loading equipment data:', error);
                document.getElementById('main-content').innerHTML = 
                    `<div class="error-message">Error loading equipment data: ${error.message}</div>`;
            }
        }

        try {
            require(['baja!'], function(baja) {
                subscriber = new baja.Subscriber();
                
                subscriber.attach('changed', function(prop) {
                    if (prop.getName() === 'out') {
                        const pointInfo = this.userData;
                        if (pointInfo) {
                            const out = this.getOut();
                            const displayValue = out.getValue();
                            
                            updatePointValue(pointInfo.equipmentName, pointInfo.pointId, displayValue);
                        }
                    }
                });
                
                loadAndDisplayAllEquipment();
            });
        } catch (error) {
            console.error('Failed to initialize subscriber:', error);
        }

        window.addEventListener('beforeunload', () => {
            if (subscriber) {
                subscriber.unsubscribeAll();
            }
        });
    </script>
</body>
</html>
