<script>
        class CustomGauge {
            constructor(svgId, config) {
                this.svg = document.getElementById(svgId);
                this.config = config;
                this.value = 0;
                this.init();
            }

            init() {
                const cx = 125;
                const cy = 125;
                const radius = 90;
                const strokeWidth = 18;

                this.svg.innerHTML = '';
                this.createGradients();

                const bgArc = this.createArc(cx, cy, radius, strokeWidth, 0, 270, 'url(#bgGradient)');
                this.svg.appendChild(bgArc);

                this.valueArc = this.createArc(cx, cy, radius, strokeWidth, 0, 0, `url(#gradient-${this.config.id})`);
                this.valueArc.style.filter = 'drop-shadow(0 0 8px ' + this.config.glowColor + ')';
                this.svg.appendChild(this.valueArc);

                this.addCenterGlow(cx, cy);
                this.addTickMarks(cx, cy, radius);
                this.addLabels(cx, cy, radius);
            }

            createGradients() {
                const defs = document.createElementNS('http://www.w3.org/2000/svg', 'defs');
                
                const bgGradient = document.createElementNS('http://www.w3.org/2000/svg', 'linearGradient');
                bgGradient.setAttribute('id', 'bgGradient');
                bgGradient.innerHTML = `
                    <stop offset="0%" style="stop-color:rgba(30,35,60,0.4);stop-opacity:1" />
                    <stop offset="100%" style="stop-color:rgba(40,45,75,0.4);stop-opacity:1" />
                `;
                defs.appendChild(bgGradient);

                const valueGradient = document.createElementNS('http://www.w3.org/2000/svg', 'linearGradient');
                valueGradient.setAttribute('id', `gradient-${this.config.id}`);
                valueGradient.setAttribute('x1', '0%');
                valueGradient.setAttribute('y1', '0%');
                valueGradient.setAttribute('x2', '100%');
                valueGradient.setAttribute('y2', '100%');
                
                valueGradient.innerHTML = `
                    <stop offset="0%" style="stop-color:${this.config.color1};stop-opacity:1" />
                    <stop offset="50%" style="stop-color:${this.config.color2};stop-opacity:1" />
                    <stop offset="100%" style="stop-color:${this.config.color3};stop-opacity:1" />
                `;
                defs.appendChild(valueGradient);

                this.svg.appendChild(defs);
            }

            addCenterGlow(cx, cy) {
                const circle = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
                circle.setAttribute('cx', cx);
                circle.setAttribute('cy', cy);
                circle.setAttribute('r', '50');
                circle.setAttribute('fill', `url(#gradient-${this.config.id})`);
                circle.setAttribute('opacity', '0.08');
                circle.style.filter = 'blur(15px)';
                this.svg.appendChild(circle);
            }

            createArc(cx, cy, radius, strokeWidth, startAngle, endAngle, color) {
                const start = this.polarToCartesian(cx, cy, radius, startAngle - 135);
                const end = this.polarToCartesian(cx, cy, radius, endAngle - 135);
                const largeArc = endAngle - startAngle > 180 ? 1 : 0;

                const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
                const d = `M ${start.x} ${start.y} A ${radius} ${radius} 0 ${largeArc} 1 ${end.x} ${end.y}`;
                
                path.setAttribute('d', d);
                path.setAttribute('stroke', color);
                path.setAttribute('stroke-width', strokeWidth);
                path.setAttribute('fill', 'none');
                path.setAttribute('stroke-linecap', 'round');

                return path;
            }

            polarToCartesian(cx, cy, radius, angle) {
                const radians = (angle * Math.PI) / 180;
                return {
                    x: cx + radius * Math.cos(radians),
                    y: cy + radius * Math.sin(radians)
                };
            }

            addTickMarks(cx, cy, radius) {
                const tickCount = 27;
                const innerRadius = radius - 12;
                const outerRadius = radius - 4;

                for (let i = 0; i <= tickCount; i++) {
                    const angle = (i / tickCount) * 270 - 135;
                    const inner = this.polarToCartesian(cx, cy, innerRadius, angle);
                    const outer = this.polarToCartesian(cx, cy, outerRadius, angle);

                    const line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
                    line.setAttribute('x1', inner.x);
                    line.setAttribute('y1', inner.y);
                    line.setAttribute('x2', outer.x);
                    line.setAttribute('y2', outer.y);
                    
                    const isMajor = i % 3 === 0;
                    line.setAttribute('stroke', isMajor ? 'rgba(0, 242, 255, 0.4)' : 'rgba(100, 150, 200, 0.2)');
                    line.setAttribute('stroke-width', isMajor ? '2' : '1');

                    this.svg.appendChild(line);
                }
            }

            addLabels(cx, cy, radius) {
                const labelRadius = radius - 30;
                const labels = ['0', '', '', this.config.max / 2, '', '', this.config.max];

                for (let i = 0; i < 7; i++) {
                    if (labels[i] === '') continue;
                    
                    const angle = (i / 6) * 270 - 135;
                    const pos = this.polarToCartesian(cx, cy, labelRadius, angle);

                    const text = document.createElementNS('http://www.w3.org/2000/svg', 'text');
                    text.setAttribute('x', pos.x);
                    text.setAttribute('y', pos.y);
                    text.setAttribute('text-anchor', 'middle');
                    text.setAttribute('dominant-baseline', 'middle');
                    text.setAttribute('font-size', '13');
                    text.setAttribute('fill', 'rgba(0, 242, 255, 0.7)');
                    text.setAttribute('font-weight', '600');
                    text.textContent = labels[i];

                    this.svg.appendChild(text);
                }
            }

            update(value) {
                this.value = Math.min(Math.max(value, 0), this.config.max);
                const angle = (this.value / this.config.max) * 270;

                this.svg.removeChild(this.valueArc);

                const cx = 125;
                const cy = 125;
                const radius = 90;
                const strokeWidth = 18;
                this.valueArc = this.createArc(cx, cy, radius, strokeWidth, 0, angle, `url(#gradient-${this.config.id})`);
                this.valueArc.style.filter = 'drop-shadow(0 0 8px ' + this.config.glowColor + ')';
                
                this.svg.insertBefore(this.valueArc, this.svg.children[2]);
            }
        }

async function loadGlobalConfiguration() {
    try {
        console.log('🔍 Loading Global.json configuration...');
        const response = await fetch('../Global.json');
        if (!response.ok) throw new Error(`HTTP error! status: ${response.status}`);

        console.log('✅ Successfully loaded Global.json:', globalConfig);
        return globalConfig;
    } catch (error) {
        console.error('❌ Failed to load Global.json:', error);
        const alternativePaths = ['/Global.json', '../Global.json', '/file/Global.json', '/files/Global.json'];
        for (const altPath of alternativePaths) {
            try {
                console.log(`🔄 Trying alternative path: ${altPath}`);
                const response = await fetch(altPath);
                if (response.ok) {
                    const globalConfig = await response.json();
                    console.log(`✅ Found Global.json at ${altPath}:`, globalConfig);
                    return globalConfig;
                }
            } catch (altError) {

            }
        }
        return null;
    }
}

function extractDevicePoints(globalConfig, deviceName) {
    console.log(`🎯 Searching for device: "${deviceName}"`);
    if (!globalConfig || !globalConfig.globalVariables) {
        console.error('❌ Invalid Global.json structure');
        return [];
    }
    if (globalConfig.globalVariables[deviceName]) {
        console.log(`✅ Found exact match for "${deviceName}"`);
        return globalConfig.globalVariables[deviceName].points || [];
    }
    const deviceKeys = Object.keys(globalConfig.globalVariables);
    const caseInsensitiveMatch = deviceKeys.find(key => key.toLowerCase() === deviceName.toLowerCase());
    if (caseInsensitiveMatch) {
        console.log(`✅ Found case-insensitive match: "${caseInsensitiveMatch}"`);
        return globalConfig.globalVariables[caseInsensitiveMatch].points || [];
    }
    const normalizedDeviceName = deviceName.replace(/[_-]/g, '').toLowerCase();
    const partialMatch = deviceKeys.find(key => {
        const normalizedKey = key.replace(/[_-]/g, '').toLowerCase();
        return normalizedKey === normalizedDeviceName || normalizedKey.includes(normalizedDeviceName) || normalizedDeviceName.includes(normalizedKey);
    });
    if (partialMatch) {
        console.log(`✅ Found partial match: "${partialMatch}"`);
        return globalConfig.globalVariables[partialMatch].points || [];
    }
    console.error(`❌ No device found matching "${deviceName}"`);
    console.log('Available devices:', deviceKeys);
    return [];
}

const subscriber = new baja.Subscriber();

subscriber.attach('changed', function(prop) {
    if (prop.getName() === 'out') {
        const pointInfo = this.userData;
        const pointName = pointInfo.pointName;
        const elementId = pointToElementMap[pointName];
        
        if (elementId && elements[pointName]) {
            const out = this.getOut();
            const displayValue = out.getValueDisplay();
            const value = out.getValue();
            const isOverridden = this.getStatus().isOverridden();
            const statusElement = elements[pointName];
            const gaugeIds = ['speed-value', 'freq-value', 'torque-value', 'power-value', 'current-value', 'voltage-value'];
            const isGauge = gaugeIds.includes(elementId);

            if (isGauge) {
                const gaugeType = elementId.replace('-value', '');
                const numericValue = parseFloat(value) || 0;
                if (gauges[gaugeType]) {
                    gauges[gaugeType].update(numericValue);
                }
                statusElement.textContent = displayValue.replace(/\s*(RPM|Hz|%|kW|A|V)\s*$/i, '');
                statusElement.style.color = isOverridden ? '#8B5CF6' : '';
            } else {
                if (isOverridden) {
                    statusElement.className = 'data-value override-on';
                    statusElement.style.color = '#8B5CF6';
                    statusElement.textContent = `${displayValue} (Override)`;
                } else if (elementId === 'AHUAlarm' || elementId.includes('Alarm')) {
                    if (value && (value.toString().toLowerCase().includes('on') || value > 0)) {
                        statusElement.className = 'data-value status-off';
                        statusElement.textContent = displayValue;
                    } else {
                        statusElement.className = 'data-value status-on';
                        statusElement.textContent = displayValue;
                    }
                    statusElement.style.color = '';
                } else if (value && (value.toString().toLowerCase().includes('on') || value > 0)) {
                    statusElement.className = 'data-value status-on';
                    statusElement.style.color = '';
                    statusElement.textContent = displayValue;
                } else {
                    statusElement.className = 'data-value status-off';
                    statusElement.style.color = '';
                    statusElement.textContent = displayValue;
                }
            }

            if (elementId === 'DischargeAirStaticSPOutput' || elementId === 'DamperPosition') {
                if (typeof updateDamperGraphic === 'function') updateDamperGraphic(value);
                if (typeof updateDamperReturnGraphic === 'function') updateDamperReturnGraphic(value);
            }
            if (elementId === 'DischargeAirSPOutput' || elementId === 'SupplyFanStatus') {
                if (typeof updateFanGraphic === 'function') updateFanGraphic(value);
            }
            if (elementId === 'CoolingCoilOutput') {
                if (typeof updateCoolingGraphic === 'function') updateCoolingGraphic(value);
            }
        }
    }
});

function subscribeToPoint(pointOrd, pointName) {
    baja.Ord.make(pointOrd).get({ subscriber: subscriber })
        .then(point => {
            const elementId = pointToElementMap[pointName];
            console.log(`✅ Successfully connected to ${pointName} -> ${elementId}: ${pointOrd}`);
            point.userData = { pointName: pointName };

            const out = point.getOut();
            const displayValue = out.getValueDisplay();
            const value = out.getValue();
            const isOverridden = point.getStatus().isOverridden();
            const gaugeIds = ['speed-value', 'freq-value', 'torque-value', 'power-value', 'current-value', 'voltage-value'];
            const isGauge = gaugeIds.includes(elementId);

            if (isGauge) {
                const gaugeType = elementId.replace('-value', '');
                const numericValue = parseFloat(value) || 0;
                if (gauges[gaugeType]) {
                    gauges[gaugeType].update(numericValue);
                    console.log(`📊 Initial update ${gaugeType} gauge to ${numericValue}`);
                }
                if (elements[pointName]) {
                    elements[pointName].textContent = displayValue.replace(/\s*(RPM|Hz|%|kW|A|V)\s*$/i, '');
                    if (isOverridden) elements[pointName].style.color = '#8B5CF6';
                }
            } else {
                if (elementId === 'DischargeAirStaticSPOutput' || elementId === 'DamperPosition') {
                    if (typeof updateDamperGraphic === 'function') updateDamperGraphic(value);
                    if (typeof updateDamperReturnGraphic === 'function') updateDamperReturnGraphic(value);
                }
                if (elementId === 'DischargeAirSPOutput' || elementId === 'SupplyFanStatus') {
                    if (typeof updateFanGraphic === 'function') updateFanGraphic(value);
                }
                if (elementId === 'CoolingCoilOutput') {
                    if (typeof updateCoolingGraphic === 'function') updateCoolingGraphic(value);
                }
                if (elements[pointName] && elements[pointName].tagName !== 'IMG') {
                    const statusElement = elements[pointName];
                    if (isOverridden) {
                        statusElement.className = 'data-value override-on';
                        statusElement.style.color = '#8B5CF6';
                        statusElement.textContent = `${displayValue} (Override)`;
                    } else if (elementId === 'AHUAlarm' || elementId.includes('Alarm')) {
                        if (value && (value.toString().toLowerCase().includes('on') || value > 0)) {
                            statusElement.className = 'data-value status-off';
                            statusElement.textContent = displayValue;
                        } else {
                            statusElement.className = 'data-value status-on';
                            statusElement.textContent = displayValue;
                        }
                        statusElement.style.color = '';
                    } else if (value && (value.toString().toLowerCase().includes('on') || value > 0)) {
                        statusElement.className = 'data-value status-on';
                        statusElement.style.color = '';
                        statusElement.textContent = displayValue;
                    } else {
                        statusElement.className = 'data-value status-off';
                        statusElement.style.color = '';
                        statusElement.textContent = displayValue;
                    }
                }
            }
        })
        .catch(error => {
            console.error(`❌ Failed to connect to ${pointName} (${pointOrd}):`, error);
            if (elements[pointName] && elements[pointName].tagName !== 'IMG') {
                elements[pointName].textContent = 'Connection Error';
                elements[pointName].style.color = '#ff6b6b';
                elements[pointName].className = 'data-value error';
            }
        });
}

// History cache for discovered history ORDs
let exportHistoryCache = new Map();

// BQL History Discovery
async function discoverExportHistoryOrd(pointOrd) {
    return new Promise((resolve, reject) => {
        try {
            require(['baja!'], function (baja) {
                console.log('Auto-discovering history from point:', pointOrd);
                
                baja.Ord.make(pointOrd).get()
                    .then(function(entity) {
                        return entity.tags();
                    })
                    .then(function(tagMap) {
                        var historyTag = tagMap.get('n:history');
                        console.log('Found history tag:', historyTag);
                        
                        if (historyTag && historyTag.toString().trim() !== '') {
                            var historyPath = historyTag.toString();
                            
                            if (!historyPath.startsWith('history:')) {
                                historyPath = 'history:' + historyPath;
                            }
                            
                            console.log('Discovered history ORD:', historyPath);
                            resolve(historyPath);
                        } else {
                            reject(new Error('No n:history tag found on point: ' + pointOrd));
                        }
                    })
                    .catch(function(err) {
                        console.error('Could not load tags:', err);
                        reject(new Error('Failed to load point tags: ' + err.message));
                    });
            });
        } catch (error) {
            console.error('Baja require error:', error);
            reject(error);
        }
    });
}

// Load historical data using BQL
async function loadExportHistoryData(pointPath, startTime, endTime, maxPoints = 1000) {
    return new Promise(async (resolve, reject) => {
        try {
            const cacheKey = pointPath;
            let historyOrd = exportHistoryCache.get(cacheKey);
            
            if (!historyOrd) {
                try {
                    historyOrd = await discoverExportHistoryOrd(pointPath);
                    exportHistoryCache.set(cacheKey, historyOrd);
                } catch (error) {
                    console.warn(`No history found for point ${pointPath}:`, error.message);
                    resolve([]);
                    return;
                }
            }
            
            require(['baja!'], function (baja) {
                const timeCondition = `timestamp >= '${startTime.toISOString()}' and timestamp <= '${endTime.toISOString()}'`;
                const bqlQuery = historyOrd + '|bql:select timestamp, value where ' + timeCondition + ' order by timestamp';
                
                console.log('Executing BQL Query:', bqlQuery);
                
                const dataPoints = [];
                
                baja.Ord.make(bqlQuery).get({
                    cursor: {
                        limit: maxPoints,
                        each: function () {
                            const row = this.get();
                            const rawTimestamp = row.get("timestamp");
                            const value = row.get("value");
                            
                            const date = new Date(rawTimestamp.getMillis());
                            
                            dataPoints.push({
                                timestamp: date,
                                timestampString: date.toLocaleString(),
                                value: value
                            });
                        }
                    }
                })
                .then(function () {
                    console.log(`Loaded ${dataPoints.length} history points for ${pointPath}`);
                    resolve(dataPoints);
                })
                .catch(function (err) {
                    console.error('BQL Query failed:', err);
                    reject(new Error('Failed to load history data: ' + err.message));
                });
            });
            
        } catch (error) {
            console.error('History loading error:', error);
            reject(error);
        }
    });
}

// Collect all point paths from dataPoints object
function getAllPointPaths() {
    const paths = [];
    for (const [pointName, pointPath] of Object.entries(dataPoints)) {
        paths.push({
            name: pointName,
            path: pointPath
        });
    }
    return paths;
}

// CSV EXPORT with Historical Data
async function exportHistoryToCSV() {
    console.log('📄 Generating CSV export with historical data...');
    
    showSuccessMessage('Loading historical data...');
    
    try {
        // Get date range (last 24 hours by default)
        const endDate = new Date();
        const startDate = new Date();
        startDate.setDate(startDate.getDate() - 1);
        
        const allPoints = getAllPointPaths();
        
        if (allPoints.length === 0) {
            showErrorMessage('No data points available to export');
            return;
        }
        
        // Load history for all points
        const historyPromises = allPoints.map(point => 
            loadExportHistoryData(point.path, startDate, endDate, 1000)
                .then(data => ({ pointName: point.name, data: data }))
        );
        
        const allHistoryData = await Promise.all(historyPromises);
        
        // Create timestamp-based CSV structure
        const timestampMap = new Map();
        
        allHistoryData.forEach(pointHistory => {
            pointHistory.data.forEach(reading => {
                const timestamp = reading.timestampString;
                if (!timestampMap.has(timestamp)) {
                    timestampMap.set(timestamp, { timestamp: timestamp });
                }
                timestampMap.get(timestamp)[pointHistory.pointName] = reading.value;
            });
        });
        
        // Convert to array and sort by timestamp
        const sortedData = Array.from(timestampMap.values()).sort((a, b) => 
            new Date(a.timestamp) - new Date(b.timestamp)
        );
        
        if (sortedData.length === 0) {
            showErrorMessage('No historical data found for the selected time range');
            return;
        }
        
        // Build CSV headers
        const headers = ['Timestamp', ...allPoints.map(p => p.name)];
        let csvContent = headers.join(',') + '\n';
        
        // Build CSV rows
        sortedData.forEach(row => {
            const csvRow = [
                row.timestamp,
                ...allPoints.map(point => {
                    const value = row[point.name];
                    if (value === undefined || value === null) return '';
                    // Escape values containing commas or quotes
                    const strValue = String(value);
                    if (strValue.includes(',') || strValue.includes('"')) {
                        return `"${strValue.replace(/"/g, '""')}"`;
                    }
                    return strValue;
                })
            ];
            csvContent += csvRow.join(',') + '\n';
        });
        
        // Download CSV file
        const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
        const link = document.createElement('a');
        const url = URL.createObjectURL(blob);
        
        const filename = `${headerName}_history_${startDate.toISOString().slice(0, 10)}_to_${endDate.toISOString().slice(0, 10)}.csv`;
        
        link.setAttribute('href', url);
        link.setAttribute('download', filename);
        link.style.visibility = 'hidden';
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
        URL.revokeObjectURL(url);
        
        console.log(`✅ CSV exported: ${filename} (${sortedData.length} rows)`);
        showSuccessMessage(`CSV exported: ${sortedData.length} readings`);
        
    } catch (error) {
        console.error('Error exporting CSV:', error);
        showErrorMessage('Failed to export CSV: ' + error.message);
    }
}

// Generate PDF Report with Historical Data
async function generateHistoryPDFReport() {
    console.log('📄 Generating PDF report with historical data...');
    
    showSuccessMessage('Loading historical data for PDF...');
    
    try {
        // Get date range (last 24 hours by default)
        const endDate = new Date();
        const startDate = new Date();
        startDate.setDate(startDate.getDate() - 1);
        
        const allPoints = getAllPointPaths();
        
        if (allPoints.length === 0) {
            showErrorMessage('No data points available to export');
            return;
        }
        
        // Load history for all points
        const historyPromises = allPoints.map(point => 
            loadExportHistoryData(point.path, startDate, endDate, 1000)
                .then(data => ({ pointName: point.name, data: data }))
        );
        
        const allHistoryData = await Promise.all(historyPromises);
        
        // Function to determine unit based on point name
        function getPointUnit(pointName) {
            const name = pointName.toLowerCase();
            if (name.includes('speed')) return 'RPM';
            if (name.includes('frequency') || name.includes('freq')) return 'Hz';
            if (name.includes('torque')) return '%';
            if (name.includes('power')) return 'kW';
            if (name.includes('current')) return 'A';
            if (name.includes('voltage')) return 'V';
            return '';
        }
        
        // Calculate statistics for each point
        const pointStats = allHistoryData.map(pointHistory => {
            const values = pointHistory.data.map(d => parseFloat(d.value)).filter(v => !isNaN(v));
            const unit = getPointUnit(pointHistory.pointName);
            
            let stats;
            if (values.length > 0) {
                stats = {
                    count: values.length,
                    min: Math.min(...values),
                    max: Math.max(...values),
                    avg: values.reduce((a, b) => a + b, 0) / values.length
                };
            } else {
                stats = {
                    count: pointHistory.data.length,
                    hasData: false
                };
            }
            
            return {
                pointName: pointHistory.pointName,
                stats: stats,
                unit: unit,
                latestValue: pointHistory.data.length > 0 ? 
                    parseFloat(pointHistory.data[pointHistory.data.length - 1].value) : null,
